  text: "You and your friend are almost finished painting this part of the mural. You ask her to hand you the bucket of yellow paint. But, before you get a firm grip on the handle, she lets go. The paint bucket crashes to the ground and spills. You open your mouth to shout at her for causing the accident, but then you have second thoughts. \"Accidents happen!\" you say. She gives you one of her big smiles, and you both get to work cleaning up the mess. You're still friends.\nGetting along with people isn't always easy. In this chapter, you'll find out about the various ways people relate to each other\u2014at home, at school, at work, and within their communities. You'll also learn about the different kinds of communication that help shape relationships. Finally, you'll look at the various types of relationships that are especially important during the teen years.\n## 1. You in Your Relationships\n### Check Your Wellness\nAre the relationships you have with others healthful and satisfying? See if you can answer yes to the following questions.\n- 1. Are you friendly with a variety of people, including boys and girls?\n- 2. Do you have close friends with whom you feel you can be yourself?\n- 3. Are you able to show your friends that you care about them? Can your friends show caring toward you?\n- 4. Can you work out problems that arise between you and your friends?\n- 5. Are you able to express your feelings without feeling anxious or hurting others?\n- 6. Can you carry on conversations with people you would like to get to know?\n- 7. Do you stick to your limits for expressing affection on dates? Do you respect the limits set by others?\nDo you have a close friend whom you have known since early childhood? If so, as preschoolers you may have spent hours together building whole cities with wooden blocks. Later, you may have discussed sports or favorite television programs. Now, as teenagers, you talk about problems you face at home or at school and give each other advice and encouragement. This bond that you and your friend have established over the years is one kind of relationship. A relationship is an association that develops between people who share similar interests or goals and exchange information, feelings, or ideas over a period of time.\n### How Relationships Develop\nRelationships often begin by chance\u2014you happen to meet the person who lives in the apartment across the hall from you, who sits in the desk next to you at school, or who works as your lab partner in a science class. The person across the hall from you may have lived there for the past five years but still be only an acquaintance (uh kwayn tuns), a person you are familiar with but not close to. On the other hand, the lab partner you have known only a few months may have already become a close friend.\nWhat determines whether a relationship will remain casual or become a close, lasting friendship? Social scientists have found that most people form close relationships with others who are like themselves in some important ways. It is reassuring to discover that another person agrees with you or has similar goals and interests. You and your lab partner, for example, may begin the relationship by sharing the goal of completing an experiment and writing up the lab report. As you work together, you may discover that you two also have similar interests. You may both enjoy backpacking and listening to jazz music. The person across the hall may be about your parents' age and enjoy classical music. Although you may exchange greetings, your relationship remains casual because you have little in common.\nCommon interests and goals are not the only reasons why people form close relationships. Some studies have suggested that people may get along better with other people whose personalities complement their own. In other words, a friend may have some positive qualities that you lack, and you may have some positive qualities that your friend lacks. Your lab partner, for example, may take risks: she may like trying new ways of setting up experiments. You, who are more cautious and well-organized, may admire her adventurous qualities. She may value your organizational ability and your attention to detail. The two of you may get along well with each other because you respect and admire each other's abilities.\nFor a relationship to be healthy, it must change as the individuals involved in the relationship change. Perhaps you have noticed some changes taking place in your present relationships with close friends. You may be able to argue with a friend now and then and not feel it is the end of the relationship. In fact, you may feel better about each other after an argument than before. You may have discovered that you can go for days or even weeks without seeing a friend and still feel close. These are some of the signs of healthy, growing relationships.\nYou and your parents probably are adjusting to a relationship. The new relationship that you are establishing may be based more on shared responsibility and decision making than it was before. As with all types of change, changes in a relationship sometimes create tension. By working together to resolve the problems and conflicts that are bound to arise, a relationship, and the individuals involved in it, can grow.\n### The Importance of Relationships\nAlthough you may like to be alone at times, relationships with others are important to your health. As you read in Chapter 1, your social health affects your overall wellness and your position on the Illness-Wellness continuum. Healthy relationships fulfill important emotional and physical needs throughout your lifetime. In fact, the need for relationships runs so deep that some social scientists believe it is as basic as your need for food and sleep.\nIf people are deprived of human company for too long, they may become depressed, lose interest in eating and caring for themselves, and even die. For our ancestors, groups provided protection from the dangers they faced everyday. Today, the family and social groups within which a person lives are important for other reasons. Family groups, for example, usually provide love and guidance. Social groups provide a sense of belonging and independence. Often, you learn more about yourself and what you believe when you are a member of a group.\nIt is within the family group, for example, that young children first begin to develop their physical and mental skills and begin to form their opinions about themselves. The family also teaches young children social skills, such as how to cooperate with others and how to behave in different situations, which allow them to get along in other social groups.\nMost teenagers consider it important to be part of one or more groups outside their families. These groups may include school groups, religious groups, sports teams, social clubs, political groups, or hobby clubs. The support of a group of people you trust helps to build your confidence and self-esteem, feeling good about yourself and being proud of who you are.\nWhen you are part of a group, many of the things you do become more fun. All kinds of activities, like studying for a test, going to a show, or roller skating, can be more enjoyable when you do them with others. Something that might seem silly doing alone, like dressing up in a costume, can be fun to do with friends.\nRight now, some of your most important relationships may be with a small group of close friends. Close friends can give each other confidence and bring out the best in one another. When you are feeling sad or discouraged, it is reassuring to have a friend who will listen to you and help you through the hard time.\n### Section Review\n- 1. Identify two things that people look for in friends.\n- 2. What tends to cause stress in relationships between teenagers and their parents?\n- 3. Why is being part of a group or groups especially important during the teenage years?\n### What Do You Think?\n- 4. Think about an important relationship in your life. How has this relationship had a positive influence on your overall wellness?\n## 2. Communication in Relationships\nWhen you laugh at someone's joke, hug your younger sister or brother, listen to a friend's problems, ask for advice, or write a letter, you are communicating. Communication is the process of sharing information, thoughts, ideas, or feelings. It happens whenever you use words, sounds, gestures, or body movements to interact with other people.\nYou communicate for many reasons: to make plans, to get your point of view across, to receive comfort, or to share good times with other people. Learning to communicate effectively can help you make friends and get along with other people. It can help to ease tensions between you and your parents and create a trusting atmosphere in which each of you respects the other's opinions.\n### Levels of Communication\nWhen you chat with a stranger at the bus stop, you may talk about the weather, the local political campaign, or the bus schedule. As the examples in Figure 5-3 show, this type of casual or trivial conversation is called small talk.\nNow suppose that you happen to see the same person a few days later. You continue your chat about the campaign. This time, you say how interested you are in politics and reveal that you are delivering campaign fliers in your neighborhood. You discover that the person you are speaking to supports the same candidate and lives in your neighborhood. At this point, you introduce yourselves and say that you hope you will see the person at the next political rally, which will be held in the high school. You discover that you both attend the same school. Your relationship has now moved from that of stranger to acquaintance, and the level of your communication has changed as well.\nYou and your new acquaintance are no longer engaging in small talk; you have begun to share ideas. When you see each other again, you may continue to talk about the campaign and what you expect the candidate to do for the community. As the conversation continues, it may shift from talking about the campaign to talking about yourselves. When people express personal feelings and reveal information about themselves, the communication is called self-disclosure. Some examples are given in Figure 5-3.\nAlthough most relationships do not develop as smoothly as the one described here, this one may show the connection between the closeness of a relationship and the level of communication. Social scientists have found, for example, that college roommates tend to make few self-disclosures early in the semester. As the relationship becomes closer and more trusting during the semester, the level and number of self-disclosures increases.\n> Figure 5-3 \u2014 Levels of communication.\n- 1. Small talk: \u201cI heard it's going to rain today.\u201d \u00b7 \u201cThat's a nice hat you're wearing.\u201d \u00b7 \u201cWho won the game last night?\u201d\n- 2. Sharing ideas: \u201cWhy don't we try doing it this way?\u201d \u00b7 \u201cI think they should ban smoking here. What do you think?\u201d \u00b7 \u201cWhich college do you think is best for studying philosophy?\u201d\n- 3. Self-disclosure: \u201cI'm so nervous about the try-outs.\u201d \u00b7 \u201cI'm having trouble getting along with my mom.\u201d \u00b7 \u201cI don't think I'm ready for a serious relationship.\u201d\nSometimes a person may offer personal information or \u201csecrets\" too early in a relationship. When this happens, the other person may feel threatened and withdraw, at least temporarily. Farther along in the relationship, however, offering privileged information frequently gains the other person's liking or acceptance.\n### Style in Communication\nCommunication is more than just speaking words; you communicate in your own personal style. Style is your delivery, or the attitude you express as you speak, listen, and respond. Your style is a combination of behaviors. Each behavior helps to determine the kinds and quality of relationships you have with friends, parents, siblings, teachers, and others.\nBody language is a way of communicating information, mood, or attitude through body movements, posture, gestures, and facial expressions. Body language can send a message along with spoken words, or it can send a silent message of its own. For example, some people slouch to show that they are at ease; others stand tall to show that they are confident. Experts in kinesics (kih nee siks), the science of body language, say that most body language is learned behavior. By observing others, children learn early in life that a kiss is a gesture of affection, a wave signals a greeting or a departure, and a scowl shows anger.\nYou may find it interesting to observe your own and others' body language. You may find, for example, that you use body language to hide feelings of anxiety when you speak before a group. Perhaps you smile and stand in a way that makes you appear more relaxed. Or, you may see your brother, head lowered, shoulders slumped, moving heavily across the soccer field after his team's defeat. Your brother's posture and body movements convey his disappointment without his saying a word.\nEye contact, or meeting someone's gaze, is another way to communicate. Teachers may use eye contact to establish a kind of connection with their students. Eye contact can help teachers to know whether students are listening or whether they understand what is being taught. As you talk with a friend, eye contact and little noises, such as \"uh-huh\" and \"yeah,\" let each of you know that the other is listening. Failure to make eye contact with a person, on the other hand, may be interpreted as shyness, shame, indifference, or even sneakiness.\nA range of emotions can be implied through eye movements. Happiness can show in eyes that \"dance\" or sparkle. Disgust can be displayed in rolling eyes or anger in glaring eyes. Even eyebrows can convey a variety of messages. They may shoot up when you question what someone has said, or they may move closer together when you hear something that you find disturbing or hurtful.\nDid you know that a statement can have different meaning depending on how you say it? Suppose, for example, that you use low tones or even whisper as you tell someone, \"Leave the package on the desk.\" This may imply that you want to be secretive. If you \"bark\" the same sentence in quick, sharp tones, it may be interpreted as an impatient or angry order. The difference is in your tone of voice, or how something is said. Tone of voice can be loud and demanding, soft and understanding, or cool and indifferent.\n### Communicating Effectively\nThe best way to get your point across is to send a clearly stated message. If you do that, there is little question about what you really mean. But, it is not always easy to send a clear signal. In fact, communicating effectively is an acquired skill, much like learning to ride a bicycle. When you first started to ride a bicycle, you probably hesitated and fell. The more you practiced, however, the less you needed to think about what you were doing and the better cyclist you became. Your skill at riding eventually became second nature, and once learned, you will never forget it.\n> Helping the Speech-Impaired \u2014 yon-maqola.\nFor some people, physical disabilities make communication with others difficult. But, with the help of recent technology, this situation is changing. A new computer system, called an Assistive Communication Device (ACD), is a welcome development for people who are not able to speak. ACDs enable these persons to \u201cspeak\u201d using the voice generated by a speech synthesizer that is part of the system.\nThe design of an ACD depends on the needs of the person using it. Some ACDs are equipped with a typical keyboard: the computer simply speaks the words typed in. Other ACDs have keyboards with pictures instead of letters. This simplifies typing, since each picture substitutes for an entire word. These systems are best for people who have limited use of their hands.\nDespite the power and complexity of a typical ACD, many are lap-sized and portable. ACD users can now take their own \u201cspeech\u201d wherever they go.\n### Mixed Messages\nAs with bicycling, part of learning how to communicate effectively is knowing what not to as well as what to do. In communication, it is important to avoid giving mixed messages. A mixed message occurs when one part of a message contradicts another. Parents, for example, may tell their daughter that she is too young to be wearing eyeshadow and blush. Later in the conversation, they may say, \"Can't you act more grownup? You're not a child anymore, you know.\"\nMixed messages also are sent when the spoken words clearly differ from the message conveyed through body language or tone of voice. For example, if someone warns you about the dangers of smoking but lights up a cigarette while talking, you will be confused about the message. Although people often do not realize it, their actions may speak louder than their words.\n### \u201cI\u201d Messages\nOne of the most important steps in learning to communicate effectively is to take responsibility for your own feelings. Feelings can be difficult to communicate, especially feelings of anger or frustration. Think about the last time you were angry with someone. How did you let the person know you were upset?\nIn order to express your feelings accurately, you may want to practice using \"I\" messages. An \"I\" message is a statement of your feelings and expectations that does not blame or judge the other person. Suppose you are upset with a friend who forgot to call you. When you speak to your friend the next day, you shout, \"Can't you remember anything?\" The question could put your friend on the defensive and cause a serious disagreement. Instead, it would be better to focus on how the situation made you feel. By saying something like \"I'm upset because we didn't talk on the phone last night,\" you open the lines of communication between you and your friend.\n### Active Listening\nLearning to listen is one of the most useful communication skills you can acquire. Although it is not a difficult skill to learn, it does require a lot of effort because listening is more than just hearing words. Active listening is focusing your full attention on what the other person is saying and, at the same time, letting that person know you understand and care.\nActive listening is truly active. The listener makes the speaker feel comfortable about opening up and expressing personal feelings. The Health Skills feature on page 114 explains how you can become a more effective listener.\n### Assertiveness\nHow do you express your opinions and feelings when they differ from another person's opinions? Are you passive, holding back your true feelings and going along with the other person? Are you aggressive? That is, do you communicate your opinions and feelings in a way that may seem threatening or disrespectful to other people?\n> Figure 5-6 \u2014 Assertive, passive and aggressive communication.\n- Assertive: using \u201cI\u201d messages to explain your feelings \u00b7 actively listening to the person \u00b7 trying to understand the person's feelings \u00b7 expressing appreciation and being respectful \u00b7 seeking a compromise that does not go against either of your values \u00b7 speaking clearly and confidently, making eye contact, appearing interested.\n- Passive: hoping the other person will guess your feelings \u00b7 always listening, rarely talking \u00b7 denying your own feelings and making excuses \u00b7 criticizing yourself and always apologizing \u00b7 always giving in to the person \u00b7 mumbling, looking away, fidgeting nervously.\n- Aggressive: using \u201cyou\u201d messages to blame the other person \u00b7 interrupting the other person and being sarcastic \u00b7 making fun of the other person's feelings and name-calling \u00b7 criticizing the other person and never giving a compliment \u00b7 always wanting your own way \u00b7 yelling or refusing to talk, pointing your finger, glaring, using physical force.\nWhen you are assertive (uh sur tiv), you express your true feelings in a way that does not threaten the other person or make you feel anxious. People who are assertive tend to have healthier, more satisfying relationships than those who are either passive or aggressive. This is because assertive behavior communicates respect both for yourself and for the other person. What do you think passive behavior communicates? What does aggressive behavior communicate?\nFigure 5-6 compares assertive communication behaviors to passive and aggressive behaviors. Like all skills, assertiveness can only be mastered with practice.\n### Section Review\n- 1. Why is communication important?\n- 2. Describe three levels of communication.\n- 3. Name and describe the three components of style in communication.\n- 4. Describe two ways to communicate your thoughts and feelings effectively.\n### What Do You Think?\n- 5. How can knowing yourself better help you to communicate more effectively?\n## 3. Friendships\nFriendship is a give-and-take relationship based on mutual trust, acceptance, and common interests or values. People look to friends for honest reactions, for encouragement during bad times, and for understanding if they make mistakes. Friends offer a sense of belonging and a handy way to remember an important fact: there are other people who understand and care about you.\nFriendships give you an opportunity to develop and use communication skills. Friendships allow you to try out a variety of roles: leader, helper, advice-seeker, or supporter. Experimenting with roles can help you learn about yourself and how you relate to others. This knowledge will be important throughout your adult life\u2014as you enter the work world, marry, start a family, and participate in community groups and decisions.\n### Types of Friendships\nFriendships range from the casual acquaintances you greet in the halls at school to the friends who share your most intimate thoughts and most of your free time. Between these two extremes are many other categories. Casual friendships are ones that often do not go beyond the sharing of ideas. Some casual friendships are friendships of convenience. You and a neighbor may mow lawns together or go sledding after a snowstorm. Even though you have little in common, you get together occasionally because you can amuse each other when there is no one else around.\nYou may be involved in some other casual friendships. When you and a classmate are assigned to the same project or to seats next to each other, a classroom friendship may begin.\nCommon-interest friendships are based on mutual interests or hobbies. You may, for example, meet a person who, like you, does volunteer work at the local hospital or enjoys hiking just as much as you do. These friendships that develop may remain casual, or they may lead to deeper, more long-lasting friendships.\nWhat makes the handful of people you think of as close friends different from those in the other categories of friendships? A close friend is a person you feel you can be yourself with, a person who can be honest with you but is not out to put you down or hurt your feelings. In a close relationship, each of you is able to overlook at least some of the other's shortcomings. A close friend is generally reliable: your friend is there to support you during the hard times as well as to share with you during the good times.\nDuring adolescence, it is common for young people to develop close friendships. These friendships offer a way to pull away from the family. By forming close friendships, adolescents can feel part of a small group, much as they did within the family, but still act independently.\nAlthough some friendships are casual, and others are important enough to last a lifetime, each is valuable for different reasons. Short-term, casual friendships offer the chance to have fun, to try new things, and to learn to be comfortable with many different people. Emotional support, self-disclosure, and the opportunity to see yourself as others see you are all possible in a close friendship.\n### Friendships with the Opposite Sex\nWhen you were younger, you probably formed friendships with children of your own sex. This is because traditionally boys and girls have been socialized differently, or taught different types of behaviors. Boys, for example, often were encouraged to be competitive. As a result, young boys tended to form casual friendships with groups of boys with whom they could compete in sports or other activities. Girls, on the other hand, were taught to nurture, or care for, others. They tended to form close one-to-one relationships with other girls.\nThe behaviors and attitudes a person has because they are socially accepted as either masculine or feminine are called sex roles. Today, sex roles are less rigid than in the past. Many people now participate in activities and behave in ways that traditionally were reserved for members of the other sex. These people recognize that each person has a range of characteristics that cannot be labeled either masculine or feminine. In choosing friends, they look for people of either sex with interests and goals similar to their own.\nWith less rigid sex roles, both males and females learn to express a variety of emotions including tenderness, compassion, or whatever a situation calls for. Opposite-sex friendships develop more frequently today than in the past. Friendships between males and females can be satisfying and close but not involve romance. These friendships help you to feel comfortable with members of the opposite sex and allow you to develop fully as a person. Some opposite-sex friendships may develop into romantic relationships as they progress. Many others simply remain friendships.\n### Forming and Maintaining Friendships\nHow would you describe your friendship pattern? Do you like having many friends or do you prefer just a few close friends? Are your friendships long-lasting or more short-term? No matter what your pattern is, developing a friendship is always a two-step process: making a friend and keeping a friend.\n### Making Friends\nWhatever your friendship pattern, it is likely that forming friendships with other teenagers is important to you. All you need to do is get started. But how? What do you look for in friends? Certainly, you may be attracted to people who are popular, good-looking, fun to be with, and witty. But outward appearances may not tell the whole story. You want friends who are trustworthy and loyal. A true friend would not cheat you or talk negatively about you to others.\nLook for people with whom you are compatible. Compatibility, the ability to exist in harmony, makes it possible for friends to have occasional disagreements and still get along well together. Of course, it is difficult to judge whether you will get along with someone before you know the person. With experience, you will become a better judge of the types of people with whom you are most compatible.\nIt is also a good idea to look for friends who are sensitive to another person's hurts, losses, or failures and who will lend support for future success. A caring friend might say, \"I know how much it hurt you when the debate team didn't accept you, but I hope you'll try again.\" Or, \"I know how hard this assignment is. Maybe we can work on it together.\" Words like these show empathy (em puh thee), an ability to understand how another person feels.\nOnce you have identified a person who has qualities that are particularly important to you, how do you approach him or her? Asking for the person's telephone number and following up with a call is one way to begin. Being sincerely complimentary about something\u2014\u201cYou were terrific in last night's game\"\u2014is another way to open up the lines of communication. Sometimes, simply letting someone know directly that you want to be friends is the best approach. Figure 5-9 gives some additional suggestions for making new friends. The most important thing to remember is to be yourself. Putting on an act to win a friend will only make both of you feel uncomfortable.\n### Keeping Friends\nForming friendships is only half the story. Maintaining them is just as important and sometimes far more difficult. Lasting friendships are built on sharing: sharing experiences, feelings, responsibility. For a friendship to grow, friends must spend time together. It is the quality of time, rather than the quantity of time, that is most important to a relationship. Friends do not need to see each other everyday, or even every week, in order for them to build a lasting friendship.\nFriendships also grow when friends are able to understand and trust each other. Understanding and trust develop from self-disclosure, that is, talking honestly about yourself, your feelings, and your needs. Both friends must also take equal responsibility for a relationship. You may be involved in a friendship in which one of you is always the \u201cgiver\" and the other the \u201ctaker.\" Givers may feel that they are always -helping their friends but getting little in return; takers may feel as if their friends do not trust them enough to ask for help. Relationships like these are not satisfying for either person and usually do not last long. For a friendship to last, both people must learn to be the \"giver\" sometimes and the \"taker\" other times.\n> Should you tell a friend that you are angry?\nYou and Cal have been friends for years, so it's hard to believe he didn't invite you to his party. All the other kids in your old group are going. That's how you found out about it: Ted asked you for a ride. Cal's also invited some people you don't know well but would like to meet. Maybe he doesn't think you're good enough for this crowd. You're angry and hurt. It might feel good to tell Cal off, but what about your friendship? There are still three days left before the party, and Cal sits next to you in homeroom.\n- 1. Use the DECIDE process to decide what you would do in this situation. Explain your reasons for making this decision.\n- 2. How might this situation become more difficult if you choose not to talk to Cal before the party?\nIn all friendships, even strong ones, problems arise and must be dealt with. Jealousy, for example, can cause problems in any friendship. A person may be jealous of a friend's accomplishments, appearance, possessions, or something else. Sometimes, jealousy results when a friend wants to branch out of one group or best-friend relationship and develop other close relationships. This can represent a threat to the existing group or friendship and can cause feelings of anxiety about being left out.\nWhen jealous feelings arise, it is important to use your communication skills to discuss the problem. First, get your feelings out in the open. It is best to do this in person, but if this is too difficult, you can write a letter explaining your feelings. Be sure to listen to your friend's point of view and try to understand his or her feelings.\nIt also may be helpful to discuss what each of you expects and needs from your friendship. It may be that your expectations are different from your friend's or that they changed without your being aware of it. Perhaps you wanted someone to confide in, or you hoped the friendship would make you more popular at school. Thinking about and discussing these things helps you to gain a better understanding of friendship and of ways to work things out.\nOccasionally, a friend may act cruelly toward you. You may have done something that angered your friend, or your friend may be facing problems at home, school, or elsewhere. Unfortunately, sometimes people transfer the pain or anxiety they are feeling onto their close friends. If you are the victim of a friend's cruelty, you should confront your friend to find out what the real problem is. By confronting your friend, you communicate that you are not willing to be mistreated, and you also show your concern and desire to work things out.\n### Section Review\n- 1. Why do you need friendship?\n- 2. Why are close and casual friendships important for personal growth?\n- 3. How have changes in traditional sex roles affected friendship patterns?\n- 4. Describe two qualities that are desirable in friends.\n### What Do You Think?\n- 5. What do you see as the most important problem that can arise within a friendship? How would you handle this problem?\n## 4. Intimate Relationships\nDeveloping as a person means developing also as a sexual being. As teenagers become aware of their sexuality, some tough questions arise: How can I show physical affection without it leading to sex? Are my sexual feelings normal? Are my partner and I emotionally ready right now for a sexual relationship?\nThere are no easy answers for these questions. The values you learn from your family, religious teachings, personal experiences, and friends influence your thinking about questions involving physical intimacy. The important thing is that you think about these questions, gather as much information as you can, and then make decisions that feel comfortable and right for you.\n### Physical Attraction\nThe teenage years are a time when most young people experience intense feelings of attraction. Perhaps you have had a crush on a rock star or a teacher. You may have spent a great deal of time daydreaming about him or her. This feeling of intense, sometimes overwhelming, interest in another person is called an infatuation. From these normal, healthy feelings of infatuation you have as a teenager, you develop the ability to form strong attachments as an adult.\nDuring the teenage years, most people develop an attraction to members of the other sex. Being sexually attracted to people of the other sex is called heterosexuality (het uh roh sek shoo al ih tee). Some people are sexually attracted to people of their own sex, which is known as homosexuality (hoh mo sek shoo al ih tee). Homosexuality is still not well understood. Some teenagers who have close, caring relationships with members of their own sex wonder if they are homosexual. Close, caring friendships between members of the same sex do not indicate sexual preference. Homosexuality also is not determined by your physical appearance, style of dress, hobbies, or interests.\nHomosexuals have sometimes been the target of unflattering jokes, discrimination, and even violence. With education, it is possible that more people may accept the fact that sexual preference does not determine honesty, loyalty, caring, or other valuable qualities.\n### Dating\nWhile some teenagers have begun to date by high school, others do not start dating until later. Dating is a way for a teenager to get to know a person to whom he or she is / attracted. Dating often grows out of group activities that include both boys and girls. A group of you may enjoy skating together on a Saturday afternoon, for example, or going to school sports events and meeting for pizza afterward.\nDuring mixed-group activities you may discover that you especially enjoy being with a certain friend of the other sex. You may enjoy being with someone who shares your interests or has a similar sense of humor. You may also be physically attracted to this person. It is natural and healthy H to feel physical attraction and to want to get to know the person better. This may lead to dating, either in a group or by yourselves.\nDating gives you an opportunity to learn about members of the other sex. It may help you develop communication skills and to learn how the other person views the sex roles that he or she learned as a child. You may even discover what qualities you want in the person you choose to marry.\nDating practices vary with individuals and according to family guidelines. Although it has been traditional for males to initiate dates, today many young women make arrangements for dates, provide transportation, and pay their share of expenses.\nAt first, most teenagers date in a random, casual way. They may not focus on one special person or stick to a pattern of dating every Friday or Saturday night. After a few dates, however, some couples decide to go steady, that is, to form a relationship in which it is understood that the partners will see each other regularly. Some couples go steady because it is a form of security: each is guaranteed a date whenever the need arises. For some couples, going steady also can be a time of courtship, a period that often leads to engagement and then marriage.\nHaving a \"steady\" does give you a chance to know the other person well, but dating on a steady basis also has some drawbacks. By dating the same person, you limit your chances of meeting other people with whom you might like to develop long-term relationships. You may also feel pressured to make decisions about physical intimacy before you are ready. If conflicts arise and the relationship does not work out, it is sometimes difficult to break up with a steady boyfriend or girlfriend.\n### Teenage Pregnancy\nS\nIt is normal to have sexual feelings for someone to whom you are physically attracted. It is also normal to be confused and unsure of how to handle these feelings. Most teenagers try to think ahead and to set limits for expressing their sexual feelings on dates. By setting limits before a situation arises, it is easier to stick to the standards you set.\nUnfortunately, some teenagers do not always think through the possible consequences of sexual behavior. One serious consequence is teenage pregnancy. In this country, at least 1 million girls between the ages of 15 and 19 become pregnant each year. About 40,000 pregnant teenagers are under the age of 15. In fact, the pregnancy rate for teenagers aged 14 and younger has been increasing at an alarming rate.\nTeenage pregnancy is a serious health problem. Babies born to young mothers are often smaller and less healthy than those born to older women. Teenage mothers themselves are more likely -to have health problems during pregnancy than older women. This is because pregnant teenagers do not always eat well or get adequate medical care during pregnancy, especially in the early months.\nAside from the health problems, how does having a baby affect the lives of a teenage couple? Teenage parents often report feeling trapped and overwhelmed by the responsibilities of parenthood. Many teenage mothers drop out of school. Some fathers do not help support or care for the child; others drop out of school and work at jobs that pay much less than what a high-school graduate can earn. As a result, many teenage parents never complete their educations, often live in poverty, and must depend on public assistance programs for survival. 5\nAlthough many young people are aware of the health, economic, and social problems teenage parents face, they often do not believe pregnancy can happen to them. Few teenagers want to become pregnant. Statistics have shown, however, that one in six teenagers who engage in intimate sexual contact become pregnant. Sexual intimacy is a high-risk behavior for anyone who is not ready to accept the lifelong responsibility of children.\n### Emotional Intimacy\nIn a public television program that dealt with adolescent sexual feelings, one young man who had been going steady for two years noted that he and his partner had decided that their relationship came before sex. \"We're not ready for sexual intimacy, but we share lots of other intimate experiences,\" he said.\nPerhaps you are wondering how two people can share intimate experiences without being sexually active. You may be surprised to discover that you and your partner are sharing intimate experiences when you trust each other with personal feelings or fantasies that you have not told to any one else. You may exchange \"inside\" jokes or have pet names for each other that other people are unaware of. You may study together or practice lines for your school play and find that you are not embarrassed even when you make mistakes. You may enjoy hobbies or sporting events together and frequently feel like best friends.\nWhen young couples share experiences like these and can express how they feel about each other without physical intimacy, they are giving their relationship a chance to mature through emotional intimacy. Emotional intimacy is a kind of communication that involves sharing innermost feelings and being supportive. Trust is absolutely necessary for this sort of intimacy. When people are emotionally intimate, each trusts the other to listen and accept what is being said without making judgments.\nSometimes, however, sexual feelings become so strong and confusing that it can be hard to resist experimenting. Part of experimenting in anything you do is making mistakes. Usually, mistakes make little difference in the long term, and you learn from them. Mistakes in sex, however, can be serious, especially if they result in pregnancy, sexually transmitted disease, or low self-esteem. If you are sexually active or are considering sexual activity, ask yourself whether or not you are prepared to cope with the kinds of problems, regrets, and disappointments that are listed in the chart in Figure 5-15.\nContrary to what you may think, not every teenager is sexually experienced. Often those who talk the loudest do the least. They may be exaggerating or even fantasizing about their sex lives. Today millions of young people under the age of eighteen are choosing to postpone sexual activity for a variety of good reasons. After all, saying \"no\" is the best method of birth control there is.\nIf you happen to be sexually active now and believe that building a relationship around emotional intimacy makes more sense, you and your partner can change. If your partner tries to make you feel guilty about abandoning the sexual aspects of your relationship, then he or she is not interested in respecting your feelings or getting to know you more deeply. Rather than stay in an unhealthy relationship, try to meet people who understand the importance of dealing responsibly with sexual feelings and maintaining constructive, emotionally close relationships.\n### Section Review\n- 1. How does dating usually begin?\n- 2. What are the benefits of having a steady boyfriend or girlfriend? What are the drawbacks?\n- 3. In what ways does having a baby change the lives of teenage parents?\n- 4. How can partners maintain emotional intimacy without physical intimacy?\n### What Do You Think?\n- 5. How will your relationships with the opposite sex help you to determine the qualities that are important in a marriage partner?\n> Figure 5-15 \u2014 How sexual intimacy may leave you feeling: guilty for going against your values \u00b7 disappointed that sex fails to measure up to your expectations \u00b7 hurt that your partner seems more interested in physical gratification than emotional closeness \u00b7 anxious about pregnancy and sexually transmitted disease \u00b7 fearful that parents will find out.\n## Health Skills \u00b7 Being an Effective Listener\nTom's friend Meg ran up to him in the hall between classes and grabbed his arm. She looked very upset. \"I really need to talk,\" Meg whispered. \u201cCan you come over after school? You won't believe what happened!\" Meg has done this before, and Tom is always willing to listen. Once Meg starts to explain what's bothering her, though, she gets embarrassed and stops talking. Sometimes she even gets mad at Tom. He knows that talking things over would help Meg a lot, and he worries that he's not a good enough listener. What can he do?\nThe guidelines that follow give concrete suggestions for being an effective listener. They can help you translate your good intentions into real help for a friend. \u0448\u0438\u0438\u0438\u0438\u0438\u043d\u0438\u043c\u044f\u043c \u0438 \u0438\n### 1. Start with Passive Listening\nWhen you're listening, you can show that you're paying attention and interested without actually speaking in return. Passive listening techniques include making eye contact, nodding your head, leaning forward, and letting your facial expression reflect your response. Short, encouraging verbal responses such as \"uh-huh\" and \"oh?\" are also part of passive listening.\n### 2. Emphasize Active Listening\nPassive listening does not always indicate that you fully understand what the other person is saying. To show acceptance, respect, sympathy, and encouragement, be an active listener. \u0438\n- Use verbal responses, such as \"I see,\" \"I know what you mean,\" \"Then what happened?\" or \"Really?\" and \"That's wonderful!\" \"How terrible!\" or\n- Comment directly on what the other person is saying or restate the speaker's ideas in your own words. Resist telling the person what to do. Instead, assure the speaker that you are understanding, not judging, what is being said. This can encourage the person to explore unexpressed feelings.\n- Listen for the emotions behind the words. Phrase your responses so they communicate: \"This is what I understand your ideas and feelings to be. Am I correct?\"\nTry these strategies: Restating: \"Do you mean .. .?\" Comparing: \"Was it like. . .?\" Encouraging unexpressed feelings: \"I guess you felt. . .\" Encouraging more information: \u201cTell me more about. . .\"\n### 3. Use Door Openers\nMany people find it difficult to express their feelings. They need direct encouragement, or door openers, to continue speaking. You may also use door openers at the start of a conversation in order to help a speaker begin.\nTry these door openers: \"Do you want to talk about it?\" \"You seem upset about . . .\" \u201cWhy does that bother you?\"\n### 4. Be Natural\nThe guidelines above indicate types of responses. Exactly what you say will depend on you and the person you're listening to. Being an effective listener means responding \"from the heart,\" not \"by the book.\" You are the best judge of what words to use when a friend needs a good listener. ,\n### Apply the Skill\n- 1. Review Tom's situation. What do you think he might have been doing to make Meg embarrassed, frustrated, or angry? Explain. How might he improve his listening skills?\n- 2. Imagine that a friend has just said the statements below to you. How would you communicate that you have heard what is being said and that you understand and accept the friend? (a) \u201cMy math teacher gives too much homework. I can never get it all done. I don't even know where to begin.\u201d (b) \u201cI don't want to talk about it. You wouldn't understand anyway. No one understands \u2014 especially my parents!\u201d (c) \u201cDon't tell anyone, but I think I'm in love!\u201d Now imagine that these conversations are taking place on the telephone instead of in person. In what way would you change your responses? Why would you change them?\n- 3. Observe two people in conversation in such places as the cafeteria, in line at the movies, or at your own dinner table. Pay attention to signs of effective listening. Jot down examples of passive and active listening techniques. Also list negative listening practices. How successful was the conversation? Why?\n- 4. Ask one person to tell you about his or her day. As the person speaks, practice effective listening. Then ask the speaker if he or she noticed any difference in the way you listened. Did you notice any improvement in your listening techniques? Explain. Was this conversation more or less successful than others you've had with this person? Explain.\n- 2. Imagine that a friend has just said the statements below to you. How would you communicate that you have heard what is being said and that you understand and accept the friend? (a) \"My math teacher gives too much homework. I can never get it all done. I don't even know where to begin.\u201d (b) \"I don't want to talk about it. You wouldn't understand any way. No one understands\u2014 especially my parents!\" (c) \"Don't tell anyone, but I think I'm in love!\" Now imagine that these conversations are taking place on the telephone instead of in person. In what way would you change your responses? Why would you change them?\n- 3. Observe two people in conversation in such places as the cafeteria, on line at the movies, or at your own dinner table. Pay attention to signs of effective listening. Jot down examples of passive and active listening techniques. Also list negative listening practices. How successful was the conversation. Why?\n- 4. Ask one person to tell you about his or her day. As the person speaks, practice effective listening. Then ask the speaker if he or she noticed any difference in the way you listened. Did you notice any improvement in your listening techniques? Explain. Was this conversation more or less successful than others you've had with this person? Explain.\n## Chapter Review\n### Chapter Summary\n- Relationships develop over time when people who share similar interests or goals exchange ideas, thoughts, and feelings.\n- Being part of a group may provide a sense of belonging, an opportunity to learn social skills, an awareness that you are not so different from others, and a way to have fun.\n- Friendships provide an opportunity to try out a variety of roles, to build self-esteem, to see yourself as others see you, and to develop and use communication skills.\n- Communication is important to relationships. In a close friendship, both friends must be able to disclose personal information, to actively listen, and to take responsibility for their own feelings.\n- Male and female friendship patterns have differed because of the different ways boys and girls were socialized. As sex roles become less rigid, more boys and girls will form close, nonromantic friendships.\n- Some desirable qualities in friends are honesty, loyalty, trustworthiness, compatibility, and empathy.\n- In trying to make a new friend, be sincere and act natural. To keep a friend, it is important to share experiences, feelings, and responsibilities, and to work out any problems that arise.\n- Dating provides an opportunity to understand the other sex, develop communication skills, and learn what you want in a mate.\n- Going steady guarantees a certain kind of security and offers a chance to know another person well. It also may mean limiting your chances of meeting other people, conflicts over physical intimacy, and difficulties if the relationship ends.\n- When teenagers begin to date, they must make difficult decisions about their sexuality.\n- Millions of teenagers maintain emotionally intimate relationships while postponing sexual activity.\n### Vocabulary Review\nListed below are some of the important terms in this chapter. Choose the term that best matches the phrase in the exercise that follows.\n> acquaintance \u00b7 active listening \u00b7 assertive \u00b7 body language \u00b7 communication \u00b7 compatibility \u00b7 emotional intimacy \u00b7 empathy \u00b7 eye contact \u00b7 friendship \u00b7 heterosexuality \u00b7 homosexuality \u00b7 \u201cI\u201d message \u00b7 mixed message \u00b7 passive \u00b7 relationship \u00b7 self-esteem \u00b7 self-disclosure \u00b7 sex roles \u00b7 small talk\n- 1. process of sharing information, thoughts, ideas, or feelings\n- 2. the ability to exist in harmony with another person\n- 3. one part of a message contradicts another\n- 4. the sexual attraction to people of one's own sex\n- 5. revealing information about yourself\n- 6. expressing one's true feelings in a way that does not threaten others\n- 7. communicating mood or attitude through body movements, gestures, posture, and facial expression\n- 8. a give-and-take relationship based on mutual trust, acceptance, and common interests or values\n- 9. the ability to understand how someone else feels\n- 10. behaviors and attitudes that are accepted as either masculine or feminine\n### What Have You Learned?\n- 1. Describe what happens when people are deprived of human company for too long.\n- 2. How do families help children acquire the skills that allow them to interact with others?\n- 3. Give an example of how a person might send a mixed message.\n- 4. Of what value is eye contact? How does tone of voice give meaning to what you say?\n- 5. What is active listening? Why is it important in relationships?\n- 6. Give examples of passive, aggressive, and assertive communication behaviors.\n### What Do You Think?\n- 1. How might communication skills help improve your relationships with others?\n- 2. What are some common barriers to good communication between adults and teens?\n- 3. Why do you think that some people find it difficult to make or to keep friends?\n### What Would You Do?\n- 1. You are visiting another country and are unable to speak the language. How can you communicate your needs?\n- 2. You know that one of your friends is shy and probably has low self-esteem. How could you help your friend?\n- 3. You are at a party where you know only two people. How would you get acquainted with other people?\n### For Further Study\n- 1. Watch a half-hour television program with the sound off. Jot down various types of body language that you observe along with the messages they conveyed. Were you able to interpret the story or the situation? Describe what you think the program was about.\n- 2. From an advice column in a newspaper or magazine, select two letters about problems in teenage relationships. Without reading the advice, write your own response to the problems. Then, compare your response to the advice offered in the column. Bring the letters into class for further discussion.\n- 7. Describe the benefits that close friends can provide. How is a close friend different from other kinds of friends?\n- 8. Why are friendships between members of the opposite sex more common today?\n- 9. How can a lack of self-disclosure make it difficult to form a lasting friendship?\n- 10. Why are communication skills important when problems arise within a friendship?\n- 11. Why do some couples go steady?\n- 12. How can emotional intimacy strengthen an intimate relationship between teens?\n- 4. Do you think that mixed-group activities are important in the process of developing relationships with the other sex? Explain.\n- 5. What do you think can be done to control the number of teenage pregnancies? Provide at least three suggestions.\n- 4. Imagine that you are part of a close-knit group of friends at school. Members of your group sometimes tease a classmate who is mentally disabled. You think this behavior is not right. How would you handle the situation?\n- 5. Imagine that you are a parent of a teenager who has begun to date. What advice would you give your child about physical and emotional intimacy?" }

const panel = $('#panel'), pbody = $('#pbody');
const seenModal = $('#seenModal'), seenContent = $('#seenContent');
let curr = 0, seen = new Set(), seenData = new Map(), cache = new Map(), pendingLookups = new Map(), lastReq = 0, paras = [];

function loadSeen(){
  seen.clear();
  seenData.clear();
  try {
    // Migration from the very old format (common key)
    const oldData = localStorage.getItem('spetionSeenWords');
    if (oldData) {
      const parsed = JSON.parse(oldData);
      if (Array.isArray(parsed)) {
        parsed.forEach(item => {
          const lang = uiLang || 'uz'; // fallback
          const key = `spetionSeenWords:${lang}`;
          const currentLangData = localStorage.getItem(key) || '[]';
          const langList = JSON.parse(currentLangData);

          let obj;
          if (typeof item === 'string') {
            obj = { word: item, translation: '', lemma: item, addedAt: Date.now() };
          } else {
            obj = item;
          }

          if (!langList.some(x => x.word.toLowerCase() === obj.word.toLowerCase())) {
            langList.push(obj);
            localStorage.setItem(key, JSON.stringify(langList));
          }
        });
      }
      localStorage.removeItem('spetionSeenWords');
    }

    const data = localStorage.getItem(SEEN_KEY());
    if (!data) return;
    const parsed = JSON.parse(data);
    if (Array.isArray(parsed)) {
      parsed.forEach(item => {
        if (typeof item === 'string') {
          const w = item.toLowerCase();
          seen.add(w);
          seenData.set(w, { word: item, translation: '', lemma: item, addedAt: Date.now(), practice: { status: 'new', correct: 0, wrong: 0, lastPracticedAt: 0, nextReviewAt: 0, ease: 2.5 } });
        } else if (item && item.word) {
          const w = item.word.toLowerCase();
          if (!item.practice) item.practice = { status: 'new', correct: 0, wrong: 0, lastPracticedAt: 0, nextReviewAt: 0, ease: 2.5 };
          seen.add(w);
          seenData.set(w, item);
        }
      });
    }
  } catch(e) { console.error(e); }
}
function saveSeen(){
  localStorage.setItem(SEEN_KEY(), JSON.stringify([...seenData.values()]));
}
function getSeenTranslation(word) {
  const data = seenData.get(word.toLowerCase());
  return data ? data.translation : '';
}
function updateSeenUI(){
  $('#cnt').textContent = seen.size;
  document.querySelectorAll('.w').forEach(s => {
    const w = s.textContent.toLowerCase();
    const data = seenData.get(w);
    s.removeAttribute('title');
    if (data) {
      s.classList.add('seen');
      if (data.translation) {
        s.dataset.translation = data.translation;
      } else {
        delete s.dataset.translation;
      }
    } else {
      s.classList.remove('seen');
      delete s.dataset.translation;
    }
  });
}
function addSeenWord(word, translation = '', lemma = ''){
  const w = word.toLowerCase();
  const existing = seenData.get(w);
  if (!existing) {
    seen.add(w);
    seenData.set(w, {
      word: word,
      translation: translation,
      lemma: lemma || word,
      addedAt: Date.now(),
      practice: { status: 'new', correct: 0, wrong: 0, lastPracticedAt: 0, nextReviewAt: 0, ease: 2.5 }
    });
  } else {
    // Обновляем, если пришел непустой перевод
    if (translation) existing.translation = translation;
    if (lemma) existing.lemma = lemma;
    // Обновляем время, чтобы в таблице было сверху при смене контекста
    existing.addedAt = Date.now();
  }
  saveSeen();
  updateSeenUI();
  if (seenModal.classList.contains('open')) renderSeenTable();
}
function removeSeenWord(word){
  const w = word.toLowerCase();
  if (seen.has(w)){
    seen.delete(w);
    seenData.delete(w);
    saveSeen();
    updateSeenUI();
    if (seenModal.classList.contains('open')) renderSeenTable();
    if (practiceModal && practiceModal.classList.contains('open')) updatePracticeUI();
  }
}
function clearSeenWords(){
  seen.clear();
  seenData.clear();
  saveSeen();
  updateSeenUI();
  if (seenModal.classList.contains('open')) renderSeenTable();
  if (practiceModal && practiceModal.classList.contains('open')) updatePracticeUI();
  tip.style.display = 'none';
}
function openSeenTable(){
  renderSeenTable();
  seenModal.classList.add('open');
}
function closeSeenTable(){
  seenModal.classList.remove('open');
}

function getPracticeWords({dueOnly = false} = {}) {
  const now = Date.now();
  return [...seenData.values()].filter(item => {
    if (!item.translation) return false;
    if (dueOnly) {
      return !item.practice || item.practice.status !== 'known' || item.practice.nextReviewAt <= now;
    }
    return true;
  }).sort((a,b) => {
    const da = a.practice?.nextReviewAt || 0;
    const db = b.practice?.nextReviewAt || 0;
    return da - db;
  });
}

function scheduleReview(item, knew) {
  if (!item.practice) item.practice = { status: 'new', correct: 0, wrong: 0, lastPracticedAt: 0, nextReviewAt: 0, ease: 2.5 };
  const p = item.practice;
  p.lastPracticedAt = Date.now();

  if (knew) {
    p.correct++;
    let interval = 0;
    if (p.correct === 1) interval = 3600000; // 1 soat
    else if (p.correct === 2) interval = 86400000; // 1 kun
    else if (p.correct === 3) interval = 259200000; // 3 kun
    else interval = 604800000; // 7 kun

    p.nextReviewAt = Date.now() + interval;
    if (p.correct >= 3) p.status = 'known';
    else p.status = 'learning';
  } else {
    p.wrong++;
    p.correct = Math.max(0, p.correct - 1);
    p.status = 'learning';
    p.nextReviewAt = Date.now() + 600000; // 10 daqiqa
  }

  saveSeen();
}

const practiceModal = $('#practiceModal');
let practiceSession = {
  words: [],
  index: 0,
  mode: 'cards'
};

function openPractice() {
  updatePracticeUI();
  practiceModal.classList.add('open');
}

function updatePracticeUI() {
  const content = $('#practiceContent');
  const all = [...seenData.values()].filter(i => i.translation);
  const due = getPracticeWords({dueOnly: true});

  const stats = {
    total: all.length,
    new: all.filter(i => !i.practice || i.practice.status === 'new').length,
    learning: all.filter(i => i.practice?.status === 'learning').length,
    known: all.filter(i => i.practice?.status === 'known').length,
    due: due.length
  };

  content.innerHTML = `
    <div style="margin-bottom:20px">
      <h3>${t('practiceStats')}</h3>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap:10px; margin-top:10px">
        <div class="note">${t('totalWords')}: <b>${stats.total}</b></div>
        <div class="note">${t('newWords')}: <b>${stats.new}</b></div>
        <div class="note">${t('learningWords')}: <b>${stats.learning}</b></div>
        <div class="note">${t('knownWords')}: <b>${stats.known}</b></div>
        <div class="note" style="color:var(--mark)">${t('dueWords')}: <b>${stats.due}</b></div>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px">
      <button class="btn" onclick="startPractice('cards')">${t('modeCards')}</button>
      <button class="btn" onclick="startPractice('choice')">${t('modeChoice')}</button>
      <button class="btn" onclick="startPractice('write')">${t('modeWrite')}</button>
      <button class="btn" onclick="startPractice('due')">${t('modeDueOnly')} (${stats.due})</button>
    </div>
  `;
}

function startPractice(mode) {
  const dueOnly = mode === 'due';
  const words = getPracticeWords({dueOnly});
  if (words.length === 0) {
    alert(dueOnly ? t('nothingToReview') : t('noWordsForPractice'));
    return;
  }
  if (!dueOnly && mode === 'choice' && words.length < 4) {
    alert(t('noWordsForPractice'));
    return;
  }

  practiceSession = {
    words: words.sort(() => Math.random() - 0.5),
    index: 0,
    mode: mode === 'due' ? 'cards' : mode
  };
  renderPracticeStep();
}

function renderPracticeStep() {
  const content = $('#practiceContent');
  const item = practiceSession.words[practiceSession.index];
  if (!item) {
    updatePracticeUI();
    return;
  }

  content.innerHTML = `
    <div style="text-align:center; padding:20px">
      <div class="note" style="margin-bottom:10px">${practiceSession.index + 1} / ${practiceSession.words.length}</div>
      <h1 style="margin:20px 0">${esc(item.word)}</h1>
      <div id="practiceAction" style="margin-top:30px"></div>
    </div>
  `;

  const action = $('#practiceAction');
  if (practiceSession.mode === 'cards') {
    action.innerHTML = `<button class="btn" onclick="showPracticeTranslation()">${t('showTr')}</button>`;
  } else if (practiceSession.mode === 'choice') {
    const others = [...seenData.values()]
      .filter(i => i.translation && i.word !== item.word)
      .sort(() => Math.random() - 0.5)
      .slice(0, 3);
    const choices = [item, ...others].sort(() => Math.random() - 0.5);
    action.innerHTML = `<div style="display:grid; gap:10px">
      ${choices.map(c => `<button class="btn choice-btn" onclick="checkChoice('${esc(c.word)}')">${esc(c.translation)}</button>`).join('')}
    </div>`;
  } else if (practiceSession.mode === 'write') {
    action.innerHTML = `
      <input type="text" id="practiceInput" class="btn" style="width:100%; text-align:center" placeholder="...">
      <button class="btn" style="margin-top:10px; width:100%" onclick="checkWrite()">${t('correct')}</button>
    `;
    $('#practiceInput').focus();
    $('#practiceInput').onkeydown = e => { if (e.key === 'Enter') checkWrite(); };
  }
}

function showPracticeTranslation() {
  const item = practiceSession.words[practiceSession.index];
  const action = $('#practiceAction');
  action.innerHTML = `
    <h2 style="color:var(--mark); margin-bottom:20px">${esc(item.translation)}</h2>
    <div style="display:flex; gap:10px">
      <button class="btn" style="flex:1" onclick="handlePracticeResult(true)">${t('knew')}</button>
      <button class="btn" style="flex:1; color:var(--mark)" onclick="handlePracticeResult(false)">${t('notKnew')}</button>
    </div>
  `;
}

function checkChoice(word) {
  const item = practiceSession.words[practiceSession.index];
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (b.textContent === item.translation) b.style.borderColor = '#2ecc71';
    else if (b.textContent === seenData.get(word.toLowerCase())?.translation) b.style.borderColor = 'var(--mark)';
  });
  handlePracticeResult(word.toLowerCase() === item.word.toLowerCase(), 1000);
}

function checkWrite() {
  const item = practiceSession.words[practiceSession.index];
  const val = $('#practiceInput').value.trim().toLowerCase();
  const trText = item.translation.toLowerCase();
  const isCorrect = trText.includes(val) || val.includes(trText);

  const action = $('#practiceAction');
  action.innerHTML = `
    <h2 style="color:${isCorrect?'#2ecc71':'var(--mark)'}; margin-bottom:10px">${isCorrect ? t('correct') : t('wrong')}</h2>
    <p>${t('translation')}: <b>${esc(item.translation)}</b></p>
    <button class="btn" style="margin-top:20px; width:100%" onclick="handlePracticeResult(${isCorrect})">${t('next')}</button>

const RE_W = /[A-Za-z\u00C0-\u024F]+(?:['’\-][A-Za-z]+)*/g;
function tokenize(txt, pi, el){
  let last = 0, m; RE_W.lastIndex = 0;
  while ((m = RE_W.exec(txt)) !== null){
    if (m.index > last) el.appendChild(document.createTextNode(txt.slice(last, m.index)));
    const s = document.createElement('span');
    s.className = 'w'; s.textContent = m[0]; s.tabIndex = 0;
    s.dataset.p = pi; s.dataset.i = m.index;
    const low = m[0].toLowerCase();
    const data = seenData.get(low);
    if (data) {
      s.classList.add('seen');
      if (data.translation) s.dataset.translation = data.translation;
    }
    el.appendChild(s); last = m.index + m[0].length;
  }
  if (last < txt.length) el.appendChild(document.createTextNode(txt.slice(last)));
}

function sentenceOf(pi, idx){
  const t = paras[pi]; if (!t) return '';
  let a = 0, b = t.length;
  for (let k = idx; k > 0; k--) if (/[.!?]/.test(t[k-1]) && /\s/.test(t[k]||' ')) { a = k; break; }
  for (let k = idx; k < t.length; k++) if (/[.!?]/.test(t[k])) { b = k+1; break; }
  return t.slice(a,b).trim();
}

const forms = w => {
  const f = [w];
  if (IRREG[w]) f.push(IRREG[w]);
  if (/ied$/.test(w))  f.push(w.replace(/ied$/,'y'));
  if (/ies$/.test(w))  f.push(w.replace(/ies$/,'y'));
  if (/ves$/.test(w))  f.push(w.replace(/ves$/,'f'), w.replace(/ves$/,'fe'));
  if (/(ches|shes|xes|zes|ses)$/.test(w)) f.push(w.replace(/es$/,''));
  if (/s$/.test(w) && !/ss$/.test(w)) f.push(w.replace(/s$/,''));
  if (/ing$/.test(w)) f.push(w.replace(/(.)\1ing$/,'$1'), w.replace(/ing$/,'e'), w.replace(/ing$/,''));
  if (/ed$/.test(w))  f.push(w.replace(/(.)\1ed$/,'$1'),  w.replace(/ed$/,'e'),  w.replace(/ed$/,''));
  if (/er$/.test(w))  f.push(w.replace(/er$/,''),  w.replace(/er$/,'e'));
  if (/est$/.test(w)) f.push(w.replace(/est$/,''), w.replace(/est$/,'e'));
  if (/ily$/.test(w)) f.push(w.replace(/ily$/,'y'));
  if (/ly$/.test(w))  f.push(w.replace(/ly$/,''));
  return [...new Set(f)].filter(x => x.length > 1);
};

/* ================= LUG'ATLAR =================
   Zanjir: Merriam-Webster (kalit bo'lsa) → dictionaryapi.dev → WordNet → Wiktionary.
   Birinchi natija bergani ishlatiladi.
   Merriam-Webster Learner's kalitini bepul olish mumkin:
   dictionaryapi.com/register — olsangiz, pastdagi qatorga qo'ying.  */
const MW_KEY = "";

const TIMEOUT = 7000;
async function jget(url){
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), TIMEOUT);
  try{
    const r = await fetch(url, {signal: c.signal});
    if (!r.ok) return null;
    return await r.json();
  }catch(_){ return null; }
  finally{ clearTimeout(t); }
}
const strip = s => (s||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();

async function srcFree(w){
  const j = await jget('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(w));
  if (!Array.isArray(j) || !j[0] || !j[0].meanings) return null;
  const defs = [];
  j.slice(0,2).forEach(e => (e.meanings||[]).forEach(m => {
    (m.definitions||[]).slice(0,3).forEach(d => {
      if (d && d.definition) defs.push({ pos: m.partOfSpeech, text: d.definition, ex: d.example });
    });
  }));
  if (!defs.length) return null;
  const ph = j.flatMap(e => e.phonetics||[]);
  return { lemma: j[0].word, defs,
           phon: j[0].phonetic || ph.map(p=>p.text).find(Boolean) || '',
           audio: ph.map(p=>p.audio).find(a=>a), src: 'Free Dictionary' };
}

const POS = {n:'noun', v:'verb', adj:'adjective', adv:'adverb', u:''};
async function srcWordNet(w){
  const j = await jget('https://api.datamuse.com/words?md=d&max=1&sp=' + encodeURIComponent(w));
  if (!Array.isArray(j) || !j[0] || !j[0].defs) return null;
  if (j[0].word.toLowerCase() !== w.toLowerCase()) return null;
  const defs = j[0].defs.map(d => {
    const p = d.split('\t');
    return { pos: POS[p[0]] !== undefined ? POS[p[0]] : p[0], text: p.slice(1).join(' ') };
  });
  return { lemma: j[0].word, defs, phon:'', audio:null, src:'WordNet' };
}

async function srcWiki(w){
  const j = await jget('https://en.wiktionary.org/api/rest_v1/page/definition/' + encodeURIComponent(w));
  const en = j && j.en;
  if (!Array.isArray(en)) return null;
  const defs = [];
  en.forEach(g => (g.definitions||[]).slice(0,1).forEach(d => {
    const text = strip(d.definition);
    if (!text) return;
    const ex = (d.parsedExamples||d.examples||[]).map(x => strip(x.example || x)).find(Boolean);
    defs.push({ pos: (g.partOfSpeech||'').toLowerCase(), text, ex });
  }));
  if (!defs.length) return null;
  return { lemma: w, defs: defs.slice(0,3), phon:'', audio:null, src:'Wiktionary' };
}

async function srcMW(w){
  if (!MW_KEY) return null;
  const j = await jget('https://www.dictionaryapi.com/api/v3/references/learners/json/'
                       + encodeURIComponent(w) + '?key=' + MW_KEY);
  if (!Array.isArray(j) || !j[0] || typeof j[0] === 'string') return null;
  const defs = [];
  j.slice(0,3).forEach(e => { const t = (e.shortdef||[])[0]; if (t) defs.push({ pos: e.fl||'', text: t }); });
  if (!defs.length) return null;
  const hwi = j[0].hwi || {};
  const pr = (hwi.prs||[])[0] || {};
  const a = pr.sound && pr.sound.audio;
  const dir = a ? (/^bix/.test(a) ? 'bix' : /^gg/.test(a) ? 'gg' : /^[^a-zA-Z]/.test(a) ? 'number' : a[0]) : '';
  return { lemma: (hwi.hw||w).replace(/\*/g,''), defs,
           phon: pr.mw ? '/' + pr.mw + '/' : '',
           audio: a ? `https://media.merriam-webster.com/audio/prons/en/us/mp3/${dir}/${a}.mp3` : null,
           src: "Merriam-Webster Learner's" };
}

const SOURCES = [srcMW, srcFree, srcWordNet, srcWiki];

/* Слово может иметь несколько значений (bark = "лай" / "кора").
   Источники словарей отдают их в своём порядке (обычно по частотности),
   а не по смыслу предложения. Здесь мы пересортировываем/отбираем те
   значения, чей текст (или пример) реально пересекается со словами
   контекста — точное совпадение весит больше, однокоренное (forms()) — меньше.
   Если пересечений вообще нет — оставляем дефолтный порядок как есть,
   чтобы не портить случаи, где угадать нечем. */
function pickRelevantDefs(defs, ctx, word){
  if (!defs || defs.length <= 1) return defs || [];
  const ctxList = contentWords(ctx).filter(w => w !== word.toLowerCase());
  const ctxWords = new Set(ctxList);
  if (!ctxWords.size) return defs.slice(0,3);

  const scored = defs.map((d, i) => {
    const bag = contentWords(`${d.text || ''} ${d.ex || ''}`);
    let score = 0;
    bag.forEach(w => {
      if (ctxWords.has(w)) { score += 2; return; }
      const stem = forms(w);
      if (ctxList.some(cw => stem.includes(cw) || forms(cw).includes(w))) score += 1;
    });
    return { d, score, i };
  });

  const best = Math.max(...scored.map(s => s.score));
  if (best === 0) return defs.slice(0,3);

  scored.sort((a,b) => b.score - a.score || a.i - b.i);
  return scored.slice(0,3).map(s => s.d);
}

const RED = /\b(?:simple past(?: tense)?|past tense|past participle|present participle|gerund|plural|third[- ]person singular|comparative|superlative|inflection|misspelling)\b[^.]*?\bof\s+([A-Za-z][A-Za-z'-]*)/i;

async function dict(word, ctx){
  const FETCH_TIMEOUT = 2500;
  const cands = forms(word).slice(0,4);
  for (const src of SOURCES){
    for (const f of cands){
      try {
        let e = await withTimeout(src(f), FETCH_TIMEOUT);
        if (!e || !e.defs.length) continue;
        /* "simple past of go" kabi bo'sh ta'rif bo'lsa — o'zakka o'tamiz */
        for (let i = 0; i < 2; i++){
          const red = e.defs.every(d => RED.test(d.text)) ? (e.defs[0].text.match(RED)||[])[1] : null;
          if (!red || red.toLowerCase() === e.lemma.toLowerCase()) break;
          const base = await withTimeout(src(red.toLowerCase()), FETCH_TIMEOUT) || await withTimeout(srcFree(red.toLowerCase()), FETCH_TIMEOUT);
          if (!base || !base.defs.length) break;
          e = base;
        }
        e.defs = pickRelevantDefs(e.defs, ctx, word);
        return e;
      } catch(e) { continue; }
    }
  }
  return { lemma: IRREG[word] || forms(word)[1] || word, defs: [], phon:'', audio:null, src:null };
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(() => resolve(null), ms))
  ]);
}

async function tr(text){
  try{
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${uiLang}&dt=t&q=` + encodeURIComponent(text));
    if (r.ok){
      const j = await r.json();
      const out = (j[0]||[]).map(x => x[0]).join('');
      if (out.trim()) return out.trim();
    }
  }catch(_){}
  try{
    const r = await fetch(`https://api.mymemory.translated.net/get?langpair=en|${uiLang}&q=` + encodeURIComponent(text));
    const j = await r.json();
    const out = j && j.responseData && j.responseData.translatedText;
    if (out && !/MYMEMORY WARNING|QUOTA/i.test(out)) return out;
  }catch(_){}
  return null;
}

let audioEl = null;
function say(word, url){
  try{ speechSynthesis.cancel(); }catch(_){}
  if (url){
    audioEl && audioEl.pause();
    audioEl = new Audio(url.startsWith('//') ? 'https:'+url : url);
    audioEl.play().catch(()=>tts(word));
  } else tts(word);
}
function tts(word){
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US'; u.rate = .85;
  const v = speechSynthesis.getVoices().find(x => /^en/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function lookup(word, ctx, el){
  const id = ++lastReq;
  const DETAILS_TIMEOUT = 3000;
  document.querySelectorAll('.w.active').forEach(e=>e.classList.remove('active'));
  el && el.classList.add('active');
  const key = word.toLowerCase();
  const cacheKey = `${uiLang}:${key}`;

  // 1. Попытка быстрого ответа (seenData, cache, quick dict)
  let sd = seenData.get(key);
  let cached = cache.get(cacheKey);
  let quick = getQuickTranslation(word, word);

  let fastTranslation = (sd && sd.translation) || (cached && cached.u) || quick;
  let fastLemma = (sd && sd.lemma) || (cached && cached.d && cached.d.lemma) || word;

  if (fastTranslation) {
    renderWordPanelFast(word, fastTranslation, fastLemma);
    if (!sd) addSeenWord(word, fastTranslation, fastLemma);
  } else {
    renderWordLoading(word);
  }

  // 2. Если есть активный запрос для этого же слова, ждем его
  if (pendingLookups.has(cacheKey)) {
    try {
      await pendingLookups.get(cacheKey);
      if (id !== lastReq) return;
      const finalData = cache.get(cacheKey);
      if (finalData) {
        renderWordPanel(word, finalData, ctx, el);
      }
      return;
    } catch(e) {}
  }

  // 3. Выполнение запросов (параллельно)
  const lookupPromise = (async () => {
    try {
      const dPromise = withTimeout(dict(word, ctx), DETAILS_TIMEOUT);
      const trPromise = tr(word);

      const [d, tWord] = await Promise.all([dPromise, trPromise]);

      // Если tWord пришел первым (или d завис), а у нас еще не было перевода - показываем fast
      if (tWord && !fastTranslation && id === lastReq) {
        renderWordPanelFast(word, tWord, (d && d.lemma) || word);
      }

      let u = tWord || fastTranslation || '';
      let finalD = d || { lemma: word, defs: [], phon: '', audio: null, src: null };

      // Если лемма другая, уточняем перевод
      if (finalD.lemma && finalD.lemma.toLowerCase() !== key) {
        const tLemma = await tr(finalD.lemma);
        if (tLemma) u = tLemma;
      }

      const contextual = await contextWordTranslation(word, finalD.lemma || word, ctx, u);
      const res = { d: finalD, u: contextual, timeout: !d };
      cache.set(cacheKey, res);

      addSeenWord(word, contextual, finalD.lemma || word);
      return res;
    } finally {
      pendingLookups.delete(cacheKey);
    }
  })();

  pendingLookups.set(cacheKey, lookupPromise);
  const finalResult = await lookupPromise;

  if (id !== lastReq) return;
  renderWordPanel(word, finalResult, ctx, el);
}

  const targets = [...new Set([clean(word), clean(d.lemma)])].filter(x => x.length > 1);
  const mark = s => targets.length
    ? esc(s).replace(new RegExp(`\\b(${targets.join('|')})(\\w{0,3})\\b`, 'ig'), '<em>$1$2</em>')

  const isSeen = seen.has(key);

  open(`

      </div>

  { word: 'fat', patterns: ['high in fat', 'foods high in fat', 'fat, salt, and sugar', 'dietary fat'], translation: 'yog‘' },
  { word: 'salt', patterns: ['high in fat, salt, and sugar', 'high in salt'], translation: 'tuz' },

function getContextRuleTranslation(word, lemma, ctx){
  const lang = uiLang || 'uz';
  const rules = lang === 'ru' ? CONTEXT_TRANSLATIONS_RU : CONTEXT_TRANSLATIONS_UZ;
  const w = word.toLowerCase();
  const l = (lemma || word).toLowerCase();
  const c = (ctx || '').toLowerCase();

  const found = rules.find(rule => {
    const rw = rule.word.toLowerCase();
    return (rw === w || rw === l) && rule.patterns.some(p => c.includes(p.toLowerCase()));
  });

  return found ? found.translation : '';
}

/* Umumiy (har qanday so'z uchun ishlaydigan) kontekstga mos tarjimani tanlash.
   G'oya: Google Translate lug'at (dt=bd) rejimi bir so'zning bir nechta ma'nosini
   va har bir ma'no uchun inglizcha sinonimlarni qaytaradi. Biz gapdagi boshqa
   so'zlar (kontekst) qaysi ma'noning sinonimlariga ko'proq mos kelishini solishtirib,
   o'sha ma'noga tegishli tarjimani tanlaymiz — bu qat'iy ro'yxatga bog'liq emas. */
const STOPWORDS = new Set(['the','a','an','and','or','but','is','are','was','were','be','been',
  'being','to','of','in','on','at','for','with','as','by','that','this','these','those','it',
  'its','you','your','he','she','they','we','i','their','his','her','not','no','do','does','did',
  'have','has','had','will','would','can','could','should','may','might','must','so','if','than',
  'then','also','into','from','about','up','out','over','under','more','most','such','just','only',
  'very','which','who','whom','when','where','while','because','some','any','all','each','other']);

function contentWords(text){
  return (text || '').toLowerCase().match(/[a-z']+/g)?.filter(w => w.length > 2 && !STOPWORDS.has(w)) || [];
}

async function fetchDictSenses(word){
  try {
    const r = await withTimeout(fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${uiLang}&dt=bd&dt=t&q=` + encodeURIComponent(word)), 2500);
    if (!r || !r.ok) return [];
    const j = await r.json();
    const bd = j && j[1];
    if (!Array.isArray(bd)) return [];
    const senses = [];
    bd.forEach(group => {
      const entries = group && group[2];
      if (!Array.isArray(entries)) return;
      entries.forEach(e => {
        const term = e && e[0];
        const synonyms = (e && Array.isArray(e[1])) ? e[1] : [];
        if (term) senses.push({ term, synonyms });
      });
    });
    return senses;
  } catch(_) { return []; }
}

async function disambiguateTranslation(word, ctx){
  const senses = await fetchDictSenses(word);
  if (!senses.length) return null;
  const ctxList = contentWords(ctx).filter(w => w !== word.toLowerCase());
  const ctxWords = new Set(ctxList);
  if (!ctxWords.size) return senses[0].term;

  let best = null, bestScore = -1;
  senses.forEach(s => {
    let score = 0;
    s.synonyms.forEach(syn => {
      contentWords(syn).forEach(w => {
        if (ctxWords.has(w)) { score += 2; return; }
        const stem = forms(w);
        if (ctxList.some(cw => stem.includes(cw) || forms(cw).includes(w))) score += 1;
      });
    });
    if (score > bestScore) { bestScore = score; best = s; }
  });
  return (best && bestScore > 0) ? best.term : senses[0].term;
}

async function contextWordTranslation(word, lemma, ctx, fallbackTranslation){
  // 1. Qo'lda yozilgan (curated) qoidalar — ma'lum iboralar uchun eng aniq tarjima
  const ruleTranslation = getContextRuleTranslation(word, lemma, ctx);
  if (ruleTranslation) return ruleTranslation;

  // 2. Har qanday so'z uchun ishlaydigan avtomatik ma'no-moslashtirish
  try {
    const smart = await disambiguateTranslation(lemma || word, ctx);
    if (smart) return smart;
  } catch(_) {}

  return fallbackTranslation || '';
}
