erson has abandoned you. You also may feel guilty about your angry feelings, because you know that the person could not help dying. Finally, you may feel depressed. All these feelings are normal reactions to the death of someone you love.\nWhat can you do to overcome feelings of sadness? It is important to admit the emotion and to share your feelings with a close relative or friend. If you are sad about a failure, it might also help to make a list of your accomplishments or do something nice for yourself. If you are grieving, allow / yourself to cry and to feel all of the emotions the loss brings I on. It is important not to withdraw from other people or isolate yourself. If you do, the feeling can become overwhelming and may interfere with your ability to cope with everyday events.\n### SAD \u00b7 Yorug\u2018lik bilan davolash\nDo you suffer from the \"winter blahs\" as the days get shorter? Some people are not only sad in winter, they have SAD, seasonal affective disorder.\nSAD, researchers have discovered, is a deficiency disorder. Just as scurvy is caused by a lack of vitamin C, so some people get SAD from a lack of a full range of light, which is not typically found indoors. As the supply of natural light decreases, those with SAD begin to show signs of depression. Unlike depressed people, who have trouble sleeping and eating, SAD patients act more like hibernating animals. They sleep excessively (up to 18 hours a day), crave starchy foods, and gain weight.\nTreatment for SAD sufferers involves phototherapy, exposure to a full range of bright lights for two hours a day. For 80 percent of SAD sufferers, the light treatment seems to lower the level of certain substances in the body, which relieves the symptoms of SAD.\nResearchers suggest two simple cures for normal \u201cwinter blahs\"\u2014taking a walk outdoors during daylight and increasing the light level in your home.\n### Coping with Your Emotions\nSometimes emotions can become too much to handle. In such cases, people may use coping strategies consciously or unconsciously. A coping strategy is a way of dealing with an unbearable feeling or situation. Freud referred to coping strategies as defense mechanisms because they are the ways people defend themselves against negative emotions.\nTo some extent, coping strategies can protect you from painful situations. When you use a coping strategy, you temporarily put off dealing with a problem and the emotions it causes. You experience a feeling of temporary relief, which allows you to think through the problem with a clear mind. When overused, however, coping strategies can stunt emotional growth. If you become too dependent on coping strategies, you may not learn to express your true feelings. By using coping strategies to avoid problems, you may not develop the skills that are important for mental health.\n> Figure 2-15 \u2014 Common coping strategies, each with an example.\n- Compensation: making up for weaknesses in one area by excelling in another. You do poorly in school, so you make up for it by becoming the lead saxophone player in the school orchestra and starting your own jazz band.\n- Daydreaming: creating made-up situations in your mind and indulging in fantasy to escape unpleasant events. You wish that you did well at sports, so you imagine scoring the winning basket in your school's most important game.\n- Denial: refusing to recognize the existence of an emotion or problem. Your parents are getting divorced, but you act as though nothing is wrong; when concerned friends ask how you feel, you laugh and tell them it does not bother you.\n- Displacement: transferring emotions from the original source to another. You are arguing with a friend and slam the door of your locker.\n- Identification: assuming the qualities of a person you admire. You admire your older brother so much that you begin to talk and act like him.\n- Projection: putting your own faults onto another person. At your after-school job you do not complete your tasks; when you get fired, you blame your boss, saying she was too lazy to explain them to you.\n- Rationalization: making excuses for actions or feelings. You work in a convenience store at weekends and take some candy and magazines when no one is watching, figuring it is a large store and they can afford it.\n- Reaction formation: behaving in a way opposite to the way you feel. You feel guilty smoking a cigarette, so you cover up your feelings by bragging to friends about your smoking.\n- Regression: returning to immature behavior to express emotions. You are angry at your brother for using your bicycle, so you scream at him and your parents and run into your room and slam the door.\n- Sublimation: channelling energy into an acceptable goal rather than an unacceptable one. You always seem to argue with people, so you join the debate team at school.\nFigure 2-15 describes some common coping strategies. A few will be discussed here to illustrate how they relate to your emotions. More will be said about coping strategies in the next chapter, which deals with stress.\n### Denial\nRefusing to recognize an emotion or problem is called denial. For example, suppose Clayton, the teenager who failed math and science, tried to hide his failure by \"for getting\" to tell his parents of his poor grades. By doing this, he has not only hidden the truth from his parents but from himself as well. By denying the situation, Clayton put off dealing with it until the initial pain has lessened. He might then be better able to deal constructively with his failure. He may be able to come up with a plan for studying harder, perhaps even asking his parents for help. If, however, Clayton continued to use denial to ignore his problem, he would not take action to correct the situation. This would be a negative use of the coping strategy.\nSometimes denial can allow a person to escape from an extremely painful experience, such as the death of a loved one. In this situation, denial may be a necessary step in the person's recovery process. At some point, however, the grieving individual has to allow him- or herself to feel the pain and accept the loss.\n### Displacement\nSue is furious with her boyfriend because he is, once again, late for their date. Sue may vent her anger in different ways: she can punch a pillow, or she can scream at her little sister, even though her sister has done nothing wrong. Have you ever taken out the anger you feel toward one person on someone or something else? If so, you have used the coping strategy known as displacement, the transferring of an emotion from the source to another person or object.\nAlthough venting your emotions on an object is better than taking them out on an innocent person, it is best to discuss your feelings with the person who caused them. Displacement can be useful because it allows you time to calm down before you confront the problem. In Sue's case, if she is angry because her boyfriend is always late, she should tell him how she feels. Together, they can work out a solution to the problem. If Sue does not confront the situation, she has used displacement to avoid the problem.\n### Rationalization\nWhen a person makes excuses for his or her actions or feelings, it is called rationalization. Usually people use rationalization to avoid risking their self-concept or feeling guilty. For example, Denise wanted to ask William out to a movie. She was nervous because she did not know whether William would accept her invitation. Denise convinced herself that she had too much homework to do to go to a movie. By rationalizing, Denise was able to avoid a possible rejection by William. If Denise admits her fears, she may be able to convince herself not to let them stand in her way. If, however, Denise continues to make excuses to herself, she may miss out on an important opportunity for growth. When rationalization is overused, a person does not learn how to deal with problems effectively.\n### Regression\nExhibiting emotional behavior that is characteristic of young children is called regression. You can see a lot of regression during a traffic jam at rush hour: adults leaning on their horns or screaming at the top of their lungs. For the most part, regression is not a constructive coping strategy because it does not solve the problem at hand. Instead, the childish behavior that indicates regression often makes a situation worse. In most cases of regression, it is better to find another way of expressing frustration or anger. If you feel a tantrum coming on, take an emotional break by calling a friend, taking a walk, or by counting to ten before you react to the problem. The break will allow you to think more clearly about the situation and about a mature solution.\n### Other Coping Strategies\nSome other coping strategies that people use to deal with their emotions include compensation, daydreaming, identification, projection, reaction formation, and sublimation. Look over the definitions and examples of these coping strategies in Figure 2-15. Can you think of times when you used each of these coping A strategies? Did you use the coping strategy in a positive or negative way? How could you have turned a negative use into a positive one?\nLearning to express your emotions in positive ways is not an easy skill to master. Most people need help dealing with their emotions from time to time. Strong emotions can interfere with your ability to concentrate on or think clearly about a situation. If you find that your emotions are preventing you from participating in your normal activities, it may be time to ask for help. Try talking to a trusted friend or family member about your problem. Sometimes, just talking about your feelings will help you see things more clearly. Other times, mental health counselors may be available to help you learn how to cope with life situations.\n### Section Review\n- 1. How do psychologists define emotion?\n- 2. Name five common emotions.\n- 3. Give an example of a coping strategy.\n- 4. Why should you avoid using coping strategies too frequently?\n### What Do You Think?\n- 5. Describe a situation in which you or a friend expressed an emotion in an unhealthful way. How could the emotion have been expressed in a healthful way?\n## Health Skills \u00b7 Expressing Emotions in a Positive Way\nMatthew had been dating Joan for a year, and he thought things were great between them. Joan felt differently. She wanted to start dating other boys. Matthew was so stunned he couldn't even describe his feelings.\nHow would you react if you were in Matthew's situation? Yell? Cry? Pound a pillow? Act as if you didn't care? Pick a fight with your little sister? Talk to Joan? All of these behaviors are possible responses to strong feelings. They are ways of trying to cope with emotions that can seem overwhelming.\nWhile you cannot control what you feel, you can control what you do, or your behavior. Some responses to strong feelings improve the situation or at least make you feel better. Others can make a bad situation worse. The following guidelines will help you learn to express your feelings constructively. \n### 1. Accept Your Feelings\nStrong emotions, even unpleasant ones, are normal. Denying them will not make them go away, and it may cause them to erupt later in destructive behaviors. It is important to identify and accept your feelings; then you can start to work on expressing them constructively.\n### 2. Inventory Your Current Behavior\nEveryone experiences emotions, such as love, fear, sadness, and anger. Are you aware of how you usually react to these feelings? On index cards, inventory your recent responses to each of these emotions. Briefly describe when and how you expressed each feeling in the recent past and how the situation was resolved. Circle those responses that led to a positive outcome.\n> Namuna kartochka \u2014 Anger. 1. My sister wore my blouse. I yelled at her. She yelled back. Mom got mad. I was frustrated. 2. Argued with Dad about the car. Went for a bike ride. Cooled off. Then talked to Dad. Felt better.\n### 3. Seek Constructive Alternatives\nYour inventory will show what has worked well for you in the past. Here are some other tips to help you deal with your emotions in a positive way:\n- Communicate your feelings: Find someone trusted to talk to or \"a shoulder to cry on.\" Don't lash out and hurt people's feelings; that just adds to your\u2014 and their\u2014problems. Try not to withdraw from those who care about you. They can be a big help if you let them.\n- Let off steam: Do something you enjoy that requires physical or creative energy. Run or do some other physical activity; paint or play an instrument. Even taking a walk to clear your head can help. Smashing things does not help. While you may feel better for a moment, you will have to deal with the damage later.\n- Confront the cause of the feeling: Once you have calmed down, talk to the person who caused the emotion. Make clear how you feel without blaming the other person. You may find it was all a misunderstanding or that the person is now sorry. Even if the situation cannot be reversed by clearing the air, you may feel ready to move on.\n- Avoid \"drowning your sorrows\": Do not turn to destructive behaviors as a smokescreen. Although overeating or not eating, drinking, smoking, doing drugs, or taking extreme physical risks may help you forget your problems for a moment, they can do damage that lasts a lifetime.\n### 4. Evaluate Your Progress\nIf the way you currently express your emotions works, keep it up. If not, try to stop and think a moment before you act. Recall your own positive experiences (from your inventories) and the tips above. Consider the consequences of possible responses. At first it may take a lot of self-control to change your responses to strong emotions, but the more you practice constructive behaviors, the more automatic they will become. If, however, persistence doesn't help, or if you often feel overwhelmed by your emotions, it is time to ask a trusted adult for some help.\n### Apply the Skill\n. What do you think his feelings were? List two positive and two negative ways he could have expressed those emotions. For each, what might the results have been? 2. Make a response inventory for fear, love, sadness, and anger. Write each emotion at the top of an index card. Briefly describe three times in the recent past when you have experienced that feeling, how you expressed it, and the outcome. What responses worked best for you? Worst? Why? 3. Look over your inventories. Make a new card for the emotion that gave you the most trouble. For a week, record each time you express that emotion. Make a real effort to improve your responses. If your progress is not satisfactory to you, consider asking someone for help.\n## Chapter Review\nChapter Review\n### Chapter Summary\n- An individual's personality consists of all the traits that make the person unique.\n- People with good mental health are comfortable with themselves and the world around them, realistic about their strengths and weaknesses, and able to handle the responsibilities of daily living.\n- Some personality traits are thought to be inherited, while others are shaped by a person's environment. Most traits are influenced by both heredity and environment.\n- Self-concept, the view a person has of him- or herself, is the most important influence on mental health. Self-concept is mostly influenced by people and events in an individual's early years.\n- Freud believed that personality is shaped by early childhood experiences and conflicts that the individual may not even remember. Through psychoanalysis, the person can become aware of these experiences and resolve the conflicts.\n- Erikson developed an eight-stage theory of personality development. Each stage is characterized by different crises.\n- Maslow theorized that every individual has a basic drive to live up to his or her potential and achieve self-actualization. Most people, however, are not able to satisfy that drive because other more basic needs have not been met.\n- The ability to recognize and appropriately express emotions, such as love, anger, fear, guilt, happiness, and sadness is an important component of mental health.\n- Coping strategies are ways of temporarily dealing with overwhelming feelings or situations. When coping strategies are overused, a person may not learn to solve problems or express his or her true feelings.\n### Vocabulary Review\nListed below are some of the important terms in this chapter. Choose the term that best matches the phrase in the exercise that follows.\n> conscious thought \u00b7 coping strategy \u00b7 denial \u00b7 displacement \u00b7 ego \u00b7 emotion \u00b7 extrovert \u00b7 id \u00b7 identity \u00b7 introvert \u00b7 Maslow's hierarchy of needs \u00b7 personality \u00b7 psychoanalysis \u00b7 rationalization \u00b7 regression \u00b7 self-actualization \u00b7 self-concept \u00b7 self-esteem \u00b7 superego \u00b7 unconscious thought\n- 1. all the traits that make each person different from everyone else\n- 2. the part of an individual's personality that distinguishes between right and wrong\n- 3. a thought of which a person is not aware, but which affects a person's behavior\n- 4. the mental and physical picture one has of oneself\n- 5. an ordering of a person's needs from most basic to self-fulfillment\n- 6. reaching one's full potential\n- 7. the degree to which one likes oneself or feels good about oneself\n- 8. a reaction to a situation or event that involves a person's mind, body, and ways of behaving\n- 9. transferring an emotion, such as anger, to an innocent person or object\n- 10. a conscious or unconscious way of dealing with a strong feeling or difficult situation\n### What Have You Learned?\n- 1. Describe a mentally healthy person.\n- 2. Explain how heredity and environment interact to shape personality.\n- 3. Why are peer groups an important influence on a teenager's personality?\n- 4. What factors affect self-concept?\n- 5. What did Freud believe to be the most important influence on personality?\n- 6. Compare and contrast the personality theories of Freud, Erikson, and Maslow.\n- 7. According to Erikson, what crisis must teenagers resolve?\n### What Do You Think?\n1. How do you think emotions add to the enjoyment of life? 2. Which do you think has the most impact on personality: heredity or environment? Explain your answer.\n### What Would You Do?\n1. You are feeling angry because your friend broke one of your favorite records and refuses to pay for it. What would you do to work out your anger in a healthful way? 2. Imagine you have been grounded for poor grades. Your parents say you cannot go out with your friends until you bring your grades up to a C average. How would you feel and what would a healthful response be?\n### For Further Study\n- 1. A Swiss psychologist named Jean Piaget (1896-1980) developed a theory accounting for how intellectual abilities develop in children. Research Piaget's theory of cognitive development. Explain his theory in a written report.\n- 2. At the library, find out the name of one person Maslow considered to have achieved self-actualization. Write a report describing the person's positive, healthful personality traits. Do you agree that this person achieved self- actualization?\n- 3. Interview five teenagers to find out how they are resolving their identity crises. Discuss the results with your class. With the help of your classmates develop a list of healthful ways to resolve an identity crisis." },
{ title: "Managing Stress",
  text: "You crouch on the starting platform, gripping the edge with your fingertips. Every muscle in your body is tense as you wait to dive into the pool. All your physical and mental energy will be channeled into this race. You listen for the starting gun. But what if the gun never sounds? What happens to the energy and tension stored in your body? How does it get released?\nThere are many occasions when you are prepared to take action and can't. Sometimes, it's because you are worried or excited too far in advance. Sometimes, it's because you don't know what action to take. There are some things you cannot change no matter what you do. The result of situations like these is stress.\nThe stresses of living, growing, and changing are part of your everyday life. In this chapter, you will learn about stress and how it affects you. You will also learn how to cope with stress and how to redirect it in positive ways.\n## 1. What Is Stress?\n### Check Your Wellness\nStress is a normal part of life. How well do you cope with it? If you can answer yes to the questions below, you show good stress management skills.\n- 1. Are you aware of the things that cause you stress?\n- 2. Do you plan your time to avoid last-minute rushes?\n- 3. Do you take time every day to relax and do things you enjoy?\n- 4. Do you get eight hours of sleep a night, eat a balanced diet, and get regular exercise?\n- 5. Do you avoid tobacco, alcohol, caffeine, and other drugs?\n- 6. Can you laugh, cry, and express your emotions freely?\n- 7. When you feel stress, do you use relaxation techniques, such as meditation or deep breathing?\n- 8. Can you share your problems with close friends or relatives?\n- 9. Do you know where to get help if the stresses in your life seem overwhelming?\nStress is a reaction of the body and mind to something in everyday life. You experience stress when situations, events, or people make demands on your body and mind. These demands are often part of your daily routine. The sound of an alarm clock, for example, can cause stress. When you hear the alarm, you know that you must open your eyes, sit up, and start the day. Your body and mind react to the ringing alarm, and you experience stress.\nMany situations, events, and people can cause stress. The cause is not always obvious, but all stress is caused by something in your life. The causes of stress are called stressors. The alarm that wakes you is one example of a stressor. Other stressors in your life may be upcoming tests or games or arguments with friends. These stressors make demands on your body and mind and cause you to react. Can you think of other stressors that you experience daily?\n### What's Good About Stress?\nStress is a necessary part of living. Without stressors and the demands they make, you might not face many of the challenges that lead you to accomplish things. Think about a recent accomplishment\u2014perhaps you defeated a tough opponent in tennis. You may remember the feeling of stress you experienced. Do you think that you performed well as a result of the stress? Although people speak of stress as a negative experience, stress can be a positive experience.\nStress that produces positive effects is called eustress (yoo stres). Not all stress is eustress. The positive or negative effect that a stressor has on you is often the result of your ability to manage, or cope with, the stress it produces. As you know, coping strategies help you manage your difficult emotions. Coping strategies also help you manage stress.\nWhen coping strategies are constructive, they are healthy. When they are unconstructive, they are unhealthy. Suppose you must take a major test next week, and you feel you must do well on it. In the week before the test, there are many ways you can cope with the stress it causes. Constructive coping strategies might include setting aside time to study each day, asking a friend to review with you, or asking the teacher for help. Unconstructive coping strategies might include ignoring the test until the day before or complaining to the teacher after the test that it was too hard.\nConstructive coping strategies are skills that help you solve a problem. They last a short time and are appropriate for the situation. No matter what coping strategy you use, once the stressor has occurred, you have solved the problem. You will be healthier, however, if you learn skills that make a stress a positive experience whenever possible.\n### What's Bad About Stress?\nPeople who complain about being under too much stress are usually talking about distress, or negative stress. Distress can be caused by unconstructive coping strategies, by too many stressors at one time, or by situations or events that are distressful. These situations or events are often unhappy but unavoidable. For example, the death of someone you love always causes distress. Although you learn to cope with the loss, the experience is still a negative one.\n> Figure 3-1 \u2014 Ranking of stressors by high-school students. Har bir hodisa \u201clife-change units\u201d bilan baholanadi. Bir yil ichida yig\u2018ilgan ball 150 dan kam bo\u2018lsa \u2014 kam stress; 150\u2013300 \u2014 o\u2018rtacha o\u2018zgarish; 300 dan ortiq \u2014 hayotingiz kuchli o\u2018zgargan. Skanerda ikkita ustun aralashib ketgani uchun ballarni hodisalarga aniq juftlab bo\u2018lmadi, shuning uchun hodisalar va ballar alohida berilgan.\n- Getting married \u00b7 Being suspended from school \u00b7 Being pregnant and unwed \u00b7 Having a newborn brother or sister \u00b7 Experiencing the death of a parent \u00b7 Acquiring a visible deformity \u00b7 Going through a parent's divorce \u00b7 Becoming an unwed father \u00b7 Becoming involved with drugs or alcohol \u00b7 Having a parent jailed for a year or more \u00b7 Going through parents' separation \u00b7 Experiencing the death of a brother or sister \u00b7 Experiencing a change in acceptance by peers \u00b7 Having an unwed, pregnant teenage sister \u00b7 Discovering that you are an adopted child \u00b7 Having a parent remarry \u00b7 Experiencing the death of a close friend \u00b7 Having a visible congenital deformity \u00b7 Having a serious illness requiring hospitalization \u00b7 Moving to a new school district \u00b7 Failing a grade in school\n- Not making an extracurricular activity \u00b7 Experiencing the serious illness of a parent \u00b7 Breaking up with a boyfriend or girlfriend \u00b7 Having a parent go to jail for 30 days or less \u00b7 Beginning to date \u00b7 Having more arguments with parents \u00b7 Having an outstanding personal achievement \u00b7 Observing an increase in the number of arguments between parents \u00b7 Having a parent lose his or her job \u00b7 Experiencing a change in parents' financial status \u00b7 Being accepted at the college of your choice \u00b7 Being a senior in high school \u00b7 Experiencing serious illness of a brother or sister \u00b7 Experiencing father's increased absence from home due to a change in his occupation \u00b7 Experiencing departure from home of a brother or sister \u00b7 Experiencing the death of a grandparent \u00b7 Having a third adult added to the family \u00b7 Becoming a full-fledged member of a religion \u00b7 Observing a decrease in the number of arguments between parents \u00b7 Having fewer arguments with parents \u00b7 Having mother begin to work outside the home\n- Ballar (kamayish tartibida): 101 \u00b7 92 \u00b7 87 \u00b7 81 \u00b7 77 \u00b7 77 \u00b7 76 \u00b7 75 \u00b7 69 \u00b7 68 \u00b7 67 \u00b7 64 \u00b7 64 \u00b7 63 \u00b7 62 \u00b7 62 \u00b7 58 \u00b7 56 \u00b7 56 \u00b7 55 \u00b7 55 \u00b7 53 \u00b7 53 \u00b7 51 \u00b7 50 \u00b7 50 \u00b7 47 \u00b7 46 \u00b7 46 \u00b7 46 \u00b7 45 \u00b7 43 \u00b7 42 \u00b7 41 \u00b7 38 \u00b7 37 \u00b7 36 \u00b7 34 \u00b7 31 \u00b7 27 \u00b7 26 \u00b7 26\nFigure 3-1 lists some significant stressors for high-school students. Many of these stressors are changes in one's family or school life. These changes threaten a person's sense of security or self-concept. Not all of the changes are distressful. Each change is measured in \"life-change units\" and given a score. The number of life-change units you accumulate during a year is one way to measure the amount of stress you experience. Even if the changes are for the better, many changes in a short time can cause distress.\nDistress in everyday life is often caused by too many stressors at one time, such as too many things to do in the time available. For example, Sandra is a good student, but she is taking advanced courses. This year, she is also on the field hockey team and has the lead in the class play. Each day after school, she attends either rehearsals or field hockey practice. She has little time in the evenings for homework and studying. Sandra has coped with the stress by completing her assignments on weekends. This weekend, however, she has promised to help with the housework. With the time she has left, she will have to choose between doing her school work and visiting her friends.\nIf Sandra's problem continues, she may experience other stressors. She may begin to sleep or exercise less than she should. Her grades may suffer. These problems also can become stressors and lead to feelings of helplessness, anger, or fear. Sandra will then have to cope with her emotions and the stressors. The result can become a complicated series of problems that interfere with her health.\n### Section Review\n1 - What is stress?\n- 2. What is a stressor? Give some examples of stressors from your own life.\n- 3. What is a coping strategy?\n- 4. How can stress be good or bad?\n### What Do You Think?\n- 5. From the list in Figure 3-1, choose the stressor that you feel would cause you the most distress. Which one would cause the most eustress?\n## 2. How Stress Affects Your Body\nWhen you encounter a stressor, physical changes take place in your body. These changes allow you to react quickly and to use your body's resources to cope with the stressor. The changes that occur can be either helpful or harmful. Their effect depends on your response, the length of time they last, and the coping strategies you use.\n### Stages of Stress\n4\nAs your body copes with stress, it must adapt, or adjust, to the stressor and the changes it causes. This process of adapting, called the general adaptation syndrome, occurs in three stages. The three stages\u2014the alarm stage, the resistance stage, and the exhaustion stage\u2014can happen quickly, or they can happen slowly. Your body's responses as you go through these stages depend on the stressor and the way in which you deal with it.\nImagine that you are walking through a forest. Just as you are enjoying the sights, sounds, and smells of the forest, a huge black bear appears in front of you. How would your body react? : ?\n### Alarm Stage\nAs soon as you become aware of something you consider dangerous, such as the bear, you enter the first stage of stress, the alarm stage. Your body releases a substance known as adrenaline into your bloodstream, which gives you a burst of energy and causes many other changes in your body. Your heart begins to beat faster, increasing the flow of blood to your muscles. Your breathing quickens, providing more oxygen for your body's activities. Your muscles tighten, making you ready to run. Less blood flows to your stomach and digestive system, so your arms and legs can have all the blood they need. Your pupils widen, allowing more light into your eyes. A lump develops in your throat as your throat muscles contract to help open the airways to your lungs and make breathing easier.\nThese changes take only a few seconds, but once they have taken place, your body is ready to react. You can react in one of two ways: you can stand and fight, or you can run away. This reaction is called the fight or flight response because the changes prepare you to either \"fight\" the stressor or take \"flight\" and escape.\nScientists believe that these reactions were essential for primitive people who had to survive wild animals and other dangers. The same reactions still occur to some degree with any stressor. When faced with a challenge, such as a difficult test or a theatrical performance, your body reacts with some of the same physical changes. These physical changes, which are shown in Figure 3-4, make it possible for you to choose between \"fight\" and \"flight.\"\n> Figure 3-4 \u2014 Stressorga duch kelganda tanada yuz beradigan o\u2018zgarishlar: more blood goes to the brain \u00b7 pupils open wide to take in more light \u00b7 hearing ability increases \u00b7 sweating increases \u00b7 rate of breathing increases \u00b7 heart rate and blood pressure increase \u00b7 adrenaline is released \u00b7 blood receives more energy-producing substances \u00b7 urine production decreases \u00b7 digestive system slows \u00b7 amount of stomach acid increases \u00b7 blood clotting ability increases \u00b7 body cells release energy faster \u00b7 blood vessels carry less blood to the skin and digestive system \u00b7 muscles tense.\nAs your body responds to the stressor, your mind also reacts. During the alarm stage, you become more alert. You take in information and concentrate better. You also experience a greater level of anxiety, which can lead to either constructive or unconstructive coping strategies.\nFor example, Bill, who had a major part in a class play, reacted with fear and anxiety on the opening night of the play. By concentrating on his role and ignoring the audience, he did well and did not forget his lines. In other words, Bill used the energy that the fight or flight response gave him to concentrate on his role. At the play's second performance, Bill did not cope constructively. He watched the audience and allowed the lump in his throat to keep him from delivering his lines clearly. His muddled lines caused him even more anxiety, and he forgot some of them altogether.\n### Resistance Stage\nThe resistance stage is the second stage of the general adaptation syndrome. During this stage, the body tries to recover from the alarm of the first stage. The heart and breathing slow down. Pupils return to their normal size. Muscles relax. Blood returns to the stomach and digestive system. This normal, balanced state is called homeostasis (home ee oh stay sis). When your body is in homeostasis, its internal functions stay the same, even when the external environment changes. You then have the energy to do the things you usually do.\nIf coping strategies are constructive and last a short time, the stress response ends at this stage. The body has resisted the stressor effectively and can regain homeostasis. When Bill coped constructively with the anxiety of opening night, his body was able to regain homeostasis soon after the curtain went down. When Bill did not cope constructively, he experienced further distress, and his body did not return to homeostasis quickly. He continued to feel anxious for several days. His distress and unconstructive coping kept both his mind and his body from functioning well. He felt tired, irritable, and unable to face new stressors.\n### Exhaustion Stage\nImagine that Bill used unconstructive coping strategies to deal with other stressors in his life. He ignored his homework assignments. When his grades began to drop, he blamed his teachers and classmates for his problems. He withdrew from friends and school activities. As his distress became overwhelming, he began to feel exhausted and ill.\nIf Bill's coping strategies continue to be extremely un constructive, Bill may enter the exhaustion stage, the third stage of the general adaptation syndrome. The exhaustion stage does not occur with each stress response. If it did, your body would wear out. Exhaustion occurs only if distress continues for a long time\u2014usually weeks, months, or even years. People often enter the exhaustion stage when they experience stress that is beyond their control\u2014such as a divorce or other serious family problems.\nIn the exhaustion stage, you become less able to resist new stressors, and your body has more difficulty returning to homeostasis. As your body's balance remains disturbed, making judgments, interacting with people, and maintaining your health become more difficult. In extreme cases, the exhaustion stage can lead to unhealthy behavior, serious illness, or even death. '\nTo remain healthy, your body needs to regain homeostasis soon after experiencing stress. To help your body do this, you need to learn constructive coping strategies.\n### Stress and Illness\nOnce you understand the fight or flight response, you can identify some of your own physical responses to stress. Muscle tension, \"butterflies\" in your stomach, flushing of your face, and a pounding in your head can all be symptoms, or evidence, of stress. Physical symptoms such as indigestion, skin rashes, backaches, or headaches can be caused by prolonged stress. These symptoms are sometimes called psychosomatic (sy kuh soh mat ik) symptoms. Psycho means \"of the mind,\" and somatic means \"of the body\"; psychosomatic symptoms therefore are evidence of the ways in which the mind affects the body.\nBy itself, stress does not usually cause serious illness. Most of us experience physical symptoms from time to time but regain homeostasis rather quickly. Severe or prolonged distress, however, can affect your health. It can lower your body's resistance to illness, and it can make some diseases more serious and harder to control.\n### Lowered Resistance\nNormally, the body protects itself from disease through the immune (ih myoon) system. The immune system protects the body through a complicated process involving a number of specialized body cells. When you speak of \"fighting off\" the flu or a cold, it is the immune system that does the fighting. When your immune system functions well, you are able to resist some illnesses, even when you are exposed to them.\nScientific research has shown that prolonged stress or distress can keep the immune system from functioning well. If your immune system is not working well, you may have minor illnesses, like colds and flu, more often. You may also be more likely to develop a serious illness. Scientists have found that many infections and even certain kinds of cancer, the uncontrolled growth of cells, are more common among people who experience prolonged stress or distress. Although stress is not the major cause of these diseases, it can be one of many causes that combined lead to illness.\n### Stress-Related Illnesses\nThe changes that occur in the body because of stress can lead to illness. For example, for some people, the experience of stress increases the amount of acid in the stomach until they develop ulcers. Ulcers are open sores in the lining of the stomach, caused by too much acid. The increased acid then keeps the ulcer from healing. Additional stress\u2014perhaps just the stress of worrying about the ulcer\u2014can make the ulcer worse.\nSome diseases become worse during stressful experiences. People with asthma (az muh), a type of lung disease, may react to stress with an asthmatic attack. During an asthmatic attack, the person has trouble breathing and gasps for air. Although these symptoms usually can be controlled with medication, people with asthma need to recognize their bodies' reactions to stressors so that they can manage serious asthmatic attacks.\nAnother disease that causes problems for people under stress is diabetes (dy uh bee tis). Diabetes is a disease in which the body has difficulty maintaining a balanced amount of sugar in the blood. Because sugar is a source of energy for the body, unexpected changes in energy levels can cause problems with a diabetic person's sugar balance. Diabetic people often need to take medication or control their diets so that their bodies regain homeostasis. Because stress changes the body's energy level, recognizing and coping with stress are especially important for people with diabetes.\nStress can even contribute to diseases that take years to appear. Heart disease, for example, can be caused partly by stress. Stress raises a person's blood pressure. High blood pressure occurs when the blood pushes hard against the blood vessels as it flows through them. Over time, high blood pressure can contribute to heart attacks. Coping constructively with stress is one way to help control high blood pressure and lower the risk of heart attacks.\nStress also contributes to accidents and injuries. People who are tired, distracted, or careless are more likely to injure themselves and others. When stress affects your ability to concentrate or to think clearly, you need to be especially careful. Recognizing stress allows you to take extra care.\n### Understanding Headaches\nWhat gives you a headache? Anxiety over an upcoming test? Skipping meals? Eating a particular food? Bright lights? These and other stresses of daily life can lead to headaches. Until now, millions of headache sufferers have relied on painkillers to relieve their headaches.\nRecently, scientists have begun looking at the chemical and electrical changes that occur in the brain during a headache. They have found that the level of neurotransmitters, the chemical messengers of the brain, often falls just before a headache starts. The brain's electrical activity also dulls, limiting blood flow throughout the brain.\nKnowing this, doctors can now deal more directly with headaches. For people who suffer from severe daily headaches, doctors now prescribe drugs that restore the chemical balance of the brain and improve blood flow. Other headache sufferers are taught how to use biofeedback and relaxation techniques to reduce the pain.\n### Section Review\n- 1. Name and describe the stages of the general adaptation syndrome.\n- 2. What is the fight or flight response?\n- 3. Name some ways stress is related to illness.\n- 4. What are some illnesses that are caused partly or made harder to control by stress?\n### What Do You Think?\n- 5- Choose a major stressor that you think you may encounter in the near future. How would you cope with the stressor? Trace how your body and mind would react as you progress through the stages of stress.\n## 3. Stress and Behavior\n> Figure 3-7 \u2014 Stress bilan bog\u2018liq keng tarqalgan his-tuyg\u2018u va xatti-harakatlar: anger \u00b7 anxiety \u00b7 boredom \u00b7 depression \u00b7 fear \u00b7 feeling bothered \u00b7 forgetfulness \u00b7 frustration \u00b7 hurrying \u00b7 indecisiveness \u00b7 irritability \u00b7 lack of motivation \u00b7 laughter \u00b7 loss of appetite \u00b7 nail biting \u00b7 nervousness \u00b7 overeating \u00b7 overcritical thoughts and actions \u00b7 poor attention span \u00b7 tears \u00b7 teeth grinding \u00b7 upset \u00b7 withdrawal.\nWhile stress, both eustress and distress, is a normal part of life, your response to stressors and the ways in which they affect you is unique. No two people experience stress in the same way. Each person reacts to events, situations, and people with a different personality and with his or her own series of coping strategies. Figure 3-7 lists some common feelings and behaviors that people experience when under stress. As you can see from the list, there is a wide range of emotions and behaviors associated with stress. Which of these reactions do you experience? Do your friends and family members react to stress in a similar or a different manner?\n### Personality\nAs you learned in Chapter 2, your personality affects the way you see the world and the way you interact with those around you. One theory on personality claims that there are two basic personality types: type A and type B. This theory was first proposed by a group of researchers who were studying heart disease and its possible causes. The researchers discovered that personality was one important factor in an individual's reaction to stress.\nPeople with type A personalities frequently create some of their own stressors. These people tend to be rushed, trying to accomplish as much as possible in the shortest time possible. Type A personalities tend to be competitive. They want to succeed and will drive themselves hard to accomplish their goals. They also have high standards for themselves. If they fail to meet these standards, they can become angry and frustrated. Type A personalities may experience stressors as challenges, but they can easily experience distress.\nType B personalities are less competitive and less rushed. They are calmer and less concerned about accomplishment. Type B personalities are less likely to experience distress if they do not meet high standards for success. They also are less likely to develop stress-related symptoms and illnesses.\nSome type B personalities, however, have difficulty facing challenges. They may cope with stressors by ignoring them. Doing this, they may miss opportunities for learning and achievement. They may be bored and unable to set goals. These problems can create another kind of distress in which the person needs to learn to recognize stressors and react.\nIn reality, few people are entirely type A or type B personalities, most people are a combination of both types. The difference between the types, however, can be useful in thinking about stress and the ways in which you cope with it.\n### Coping Strategies\nEveryone uses a variety of coping strategies to react to the stressors in their lives. The coping strategies you choose depend on your age and experience. Babies, for example, have no experience with coping and can only cry when faced with a stressor. As you grow older, you learn new coping strategies, and experience shows you which ones are most constructive. t\nThe coping strategies you use are linked to your self-concept, personality, and emotions. As shown in Chapter 2, part of staying healthy is learning to recognize and express your emotions. Emotions are often stressors, because they challenge your body to react. It is not surprising, then, that many of the same coping strategies you use to express emotions, you also use when you deal with stress.\nThe following section describes some coping strategies that are used by high-school students and adults. Remember that these are only a few of the ways in which you may cope with stress. Remember, too, that a coping strategy is constructive if it is appropriate to the situation and if it is a short-term method for dealing with a problem.\n### Denial\nDenial is a way of ignoring a stressor by acting as if it did not exist. Denial can be constructive when you are coping with many stressors at one time. For example, suppose that you had to take four final exams in three days. At first, you might feel overwhelmed, frustrated, and almost ready to give up. As you begin to cope with the stress, however, you might try ignoring, or denying, all but one of the exams at any one time. In this way, you could concentrate on one exam at a time without worrying about all four at once. This coping strategy may work because it lasts only a short time and helps you to meet the challenge of taking all four tests.\nOf course, you also can use denial unconstructively. Suppose you denied all four exams and did not study at all. When faced with taking each exam, you would probably enter the alarm stage. Because you would not be ready to meet the challenge, you would have trouble coping with the stressor, and your body would not regain homeostasis quickly.\n### Sublimation\nSublimation is a way of shifting your attention and energy from a stressor to something else in your life. Sublimation gives you an appropriate way to express emotions that are stressful. David, for example, was angry when his parents refused to let him go to an evening party. After a few angry words, he spent the afternoon playing football with his friends. By evening he was too tired to go to the party, and his anger was over. He had released his anger and the stress he experienced by coping constructively.\nPhysical activity, playing football, shooting baskets, taking walks, can be a constructive form of sublimation. It can also be unconstructive. If David had coped with his anger by breaking windows, his use of sublimation would have been unconstructive. His behavior would have become an additional stressor, and he probably would have remained angry.\n### Daydreaming\nMost people use daydreaming once in a while as a way of escaping stressors for a short time. Daydreaming can be constructive if it helps you concentrate on a goal or feel less anxious about a stressor. For example, Emily was worried about her gymnastics competition and found concentrating on her routine difficult. That afternoon, before she was scheduled to perform, she began daydreaming, imagining that she had won first place. To her surprise, she performed better than ever, winning second place. 4\nIn this instance, Emily's daydreaming was constructive. It lasted only a short time, took her mind off the stress, and thus helped her to accomplish her goal. Daydreaming, of course, can also be unconstructive. If Emily had daydreamed during class, for example, or if her daydreaming had kept her from performing other activities, she would have coped unconstructively with the stress she experienced.\n### Humor\nHumor can be an effective way to deal with some stressful situations. If you have ever laughed at yourself after doing something that was not really funny, such as slipping on a wet floor or saying something embarrassing in front of a group of people, you may have realized your laughter helped to relieve the feeling of stress the event caused. Humor can be a constructive coping strategy because it allows you to deal with a stressor and quickly reestablish homeostasis.\nHumor can also be an unconstructive way of handling stress. If a person uses laughter to cover up his or her true reactions to a stressor, or if a person laughs inappropriately at a serious situation, the coping strategy may be unhealthy.\n### Section Review\n- 1. What is the difference between a type A personality and a type B personality?\n- 2. How do you know whether or not a coping strategy is constructive?\n- 3. How are denial, humor, and daydreaming used to cope with stress?\n### What Do You Think?\n- 4. Review the list of coping strategies in Figure 2-15 on page\n- 39. Do you use different coping strategies to cope with stress than you did five years ago? Explain.\n## 4. Managing Stress\ni\nBecause stress affects your health in many ways, stress management is essential to staying healthy. In a sense, everything you do to maintain your health is a way to manage stress. Eating right, exercising regularly, expressing your feelings, managing your time well, developing hobbies, participating in a variety of activities, saying no to drugs and alcohol\u2014these are all ways in which a healthy person manages stress. You will learn more about these skills in later chapters.\nHere, you will learn about some methods that help to counteract the negative effects of stress.\n### Relaxation\nMany special methods can help you achieve relaxation, a state in which your body and mind are resting. When you are relaxed, you may be awake and alert, but you are not responding actively to stressors.\nTaking a hot shower or bath, stretching, or having someone massage your neck can help relax tense muscles. Stretching the muscles in your neck, shoulders, and upper back is an especially useful way to relax because these muscles often become tense when you sit for long periods.\nOne method for relaxing tense muscles is called progressive relaxation. It is a technique in which you relax by concentrating on each group of muscles in your body, one at a time. Progressive relaxation is described in the Health Skills on page 64.\nDeep breathing is a good way to manage short-term stress when you can't take time for progressive relaxation. When you breathe deep, you take in as much air as you can, making sure that your abdomen as well as your chest expands. By breathing this way, you take in more oxygen, which helps your body to function better. Deep breathing helps you relax muscles throughout your body. It is also useful with other relaxation methods.\n### Creative Visualization\n> Figure 3-12 \u2014 bo\u2018yin va yelka uchun bo\u2018shashtirish mashqlari.\n- Turn your head slowly to the left and then to the right. Return to normal position.\n- Roll your shoulders forward and backward. Then raise both shoulders toward your ears and drop them down as far as possible.\n- Keeping your head straight, slowly touch your left shoulder to your left ear. Then touch your right shoulder to your right ear. Relax.\n- Place your right hand on your left shoulder. With your left hand, grab your right arm above the elbow. Pull to the left while looking over your right shoulder. Hold, breathe deeply and release. Repeat with the other side.\nAnother method of stress management is called creative visualization (vizh oo ul y zay shun). It is a way of using your imagination to cope with stressors. When you visualize, you imagine that the stressor is an object that you can see, or sometimes hear, and you act on the stressor by doing something to what you have imagined.\nSuppose, for example, that you come home from school feeling overwhelmed with work and worries. You might try imagining that each of your problems is a piece of clothing. You might imagine that you are picking each piece of clothing off the floor and hanging it in your closet. As you visualize your closet filling with clothes, you can feel your problems disappearing.\nWhen you first begin to use creative visualization, you will find that your problems constantly reenter your mind. Creative visualization, like most methods of stress management, requires practice.\n### Biofeedback\nBiofeedback is a special method of stress management in which you learn to control some of your physical functions by recognizing your body's signals.\nTo learn biofeedback, you use special equipment that allows you to know what is happening in your body. A trained health professional usually teaches this method.\nThe health professional might, for example, attach a special device to the muscles in your back. The instrument will let you know when you begin to tense these muscles. By paying attention to your thoughts as your muscles become tense, you can learn to control the tensing of the muscles by changing your thoughts.\nWith training and practice, people can master biofeedback. Many do not need special equipment to visualize and control their tension. Biofeedback has been useful for people who have stress-related symptoms or illnesses such as headaches, high blood pressure, or asthma.\n### Getting Help When You Need It\nLearning ways to manage stress is important, but most people need extra help at some time. Another skill that keeps you healthy is recognizing when the stresses in your life are becoming overwhelming. At these times, you may want to find someone to help you with your problems. For many people, changes in their lives create special problems for a while. Because high school is a time of many changes, high- school students often find themselves in need of help.\n> Friend to Friend \u2014 do\u2018stlar suhbati.\n- George: I'm so worried about this big paper due next week, and I don't even know where to begin.\n- Larry: I know what you mean. I feel like that at times, too.\n- George: Well, what helps you when you feel that way?\n- Larry: When I have a big project to do, I think of all the steps I have to follow to get it done. Then, I make a list of all the steps and figure out how long each step will take me.\n- George: That sounds like a good approach. Do you think you can help me plan the steps involved in doing this paper?\n- Larry: Sure. Why don't we meet in the library after school and talk about it then?\nSometimes, all you need is someone to talk to. Sharing your problems can help you see them more clearly. Just describing your concerns to someone else often helps you to understand them better.\nMany people are willing to talk if you take the time to ask. Friends, parents, teachers, school counselors, school nurses, and clergy are usually available for support. If you have a specific question and do not know whom to ask, any of these people can refer you to someone who can answer your question and address your concerns.\nAt some time in your life, you may want or need some kind of long-term counseling. There are many specialists available to help people who need special attention. Some specialists are trained to treat mental illnesses, which you will learn about in Chapter 4. Others are trained to help you identify stressors and learn constructive coping strategies.\n### Section Review\n- 1. What is relaxation? Name and describe three relaxation techniques.\n- 2. Explain how the process of creative visualization can help you manage stress.\n- 3. What is biofeedback?\n### What Do You Think?\n- 4. Suppose, after a particularly stressful day, you find yourself unable to fall asleep. How would you relax?\n## Health Skills \u00b7 A Relaxation Technique\nIt is nine o'clock at night, and Pam is busy studying for the three exams she has this week. Although she has a lot of work ahead of her, Pam feels calm and relaxed. Her mind is alert and focused on her studies. How does Pam stay in control while faced with this workload? She uses progressive relaxation to help her relax. Pam has found that this 15-minute technique relieves fatigue, reduces anxiety, and helps her feel more alert.\nDuring progressive relaxation, you focus on relaxing each part of your body, from your head down to your toes. This helps you release any tension that has been building up in your body.\nThe technique of progressive relaxation is outlined below. You will discover that the more you practice the technique, the better you become at managing stress.\n### 1. Getting Ready\n- Find a quiet environment where there will be few distractions. Choose a comfortable position, either sitting or lying down. Make sure that your arms and legs are uncrossed.\n- Close your eyes and take several deep breaths. Consciously relax your body, releasing tension each time you exhale. Try to imagine that you are in a peaceful environment, for example, by a mountain stream or in a beautiful meadow.\n### 2. Relaxing Your Muscles\nBegin with your forehead and work your way down to your toes. Tighten each muscle group and hold for 10 seconds, then relax and go to the next muscle group. Try the following sequence:\n- Forehead: Wrinkle your forehead\u2014try to make your eyebrows touch your hairline.\n- Eyes: Close your eyes as tightly as you can.\n- Mouth: Form a frown with the corners of your mouth.\n- Shoulders: Raise your shoulders up to your ears.\n- Upper arms: Bend your elbows and tense your upper arms.\n- Hands and forearms: Tightly clench your fists.\n- Back: Gently arch your back.\n- Stomach: Tighten your stomach muscles.\n- Hips: Tighten your hip and buttock muscles. ,\n- Thighs: Squeeze your legs together.\n- Feet: Bend your ankles back toward your body.\n- Toes: Curl your toes under as tightly as you can.\n- Whole body: Tense all the muscles in your whole body. Relax, breathe deeply, and release any remaining tension in your muscles. Stay still and just enjoy the feeling of deep relaxation for a few moments.\n### 3. The Final Step\nNow you are ready to come out of your deeply relaxed state.\n- Count backwards from ten while you gradually start moving your toes, fingers, and limbs.\n- Open your eyes and stand up slowly. Your whole body should feel rested and alert.\n### Apply the Skill\n- 1. Choose a time when you are feeling tense or tired and try the progressive relaxation method. Find a quiet spot and spend about 15 or 20 minutes doing the exercise. Before you begin, write down how you feel and what is on your mind. After you finish, write down how you felt during and after the exercise.\n- 2. Teach the progressive relaxation technique to a friend or relative. After they have tried it, discuss with them their reactions to and feelings about the technique. What other techniques have they used to handle the stress in their lives? How does this technique compare to those?\n- 3. For a quick relaxation technique, simply tense the muscles in your whole body, as in the last part of step 2. Hold for 10 seconds and release. Repeat three times. Try this technique when you feel stress during the day, such as before an exam or competition. Did the technique help you to relax? List some other times during a typical day that this technique might be helpful.\n- 4. For one week, practice the progressive relaxation technique twice a day. Try to set aside some time each morning and evening to do the exercise. Each time, record how you felt before, during, and after doing the exercise.\n## Chapter Review\n### Chapter Summary\n- Stress is a reaction of the mind and body to a stressor\u2014a situation, event, or person\u2014 that makes a demand on the individual.\n- Stress can be positive or negative. Positive stress is eustress; negative stress is distress.\n- People manage stress with coping strategies.\n- A number of life changes over a short time can lead to distress.\n- People undergo a three-stage reaction to stress, called the general adaptation syndrome. The stages of the syndrome are alarm, resistance, and exhaustion.\n- During the alarm stage, the body prepares itself to deal with the stressor. This is known as the fight or flight response. During resistance, the body tries to regain homeostasis. If the body remains under stress, it enters the exhaustion stage.\n- Stress can lower the body's resistance to illness and make some diseases worse.\n- Personality affects the response to stressors. Type A personalities view stressors as challenges but may experience distress. Type B personalities tend to ignore stressors and may miss opportunities.\n- The coping strategies used to handle stress can be either constructive or unconstructive. Constructive coping strategies last a short time and are appropriate to the situation. Common coping strategies include denial, sublimation, daydreaming, and humor.\n- Most of the skills used to maintain health are also ways to manage stress. Methods for managing stress include relaxation, creative visualization, and biofeedback.\n- Many people need help in managing stress from time to time. Many sources of help, including friends, family members, teachers, clergy, school counselors, and other specialists, can help people deal with stress.\n### Vocabulary Review\nListed below are some of the important terms in this chapter. Choose the term that best matches the phrase in the exercise that follows.\n> adrenaline \u00b7 alarm stage \u00b7 biofeedback \u00b7 creative visualization \u00b7 distress \u00b7 eustress \u00b7 exhaustion stage \u00b7 fight or flight response \u00b7 general adaptation syndrome \u00b7 high blood pressure \u00b7 homeostasis \u00b7 psychosomatic symptoms \u00b7 relaxation \u00b7 resistance stage \u00b7 stress \u00b7 stressor \u00b7 symptoms \u00b7 type A personality \u00b7 type B personality \u00b7 ulcer\n- 1. stress that produces positive effects\n- 2. reaction of the body and mind to something in everyday life\n- 3. series of stages by which the body reacts to a stressor\n- 4. ways in which the mind affects the body\n- 5. state in which the body's internal functions remain balanced, even when the external environment changes\n- 6. personality that is competitive, driven to achieve, and likely to create stressors\n- 7. the state in which the mind and body are at rest\n- 8. method of using the imagination to cope with stressors\n- 9. open sore in the lining of the stomach\n- 10. substance that produces a burst of energy in the body\n### What Have You Learned?\n- 1. What is stress? What is a stressor?\n- 2. Explain how eustress and distress differ.\n- 3. What are coping strategies?\n- 4. What happens to your body during the fight or flight response?\n- 5. How can you use the physical changes of the fight or flight response to help you cope with stress?\n- 6. Describe the general adaptation syndrome.\n### What Do You Think?\n- 1. Name three things your school could do to help reduce student stress.\n- 2. Many people who experience serious distress do not seek help. Why is this so?\n- 3. What might life be like if there were no stress at all?\n### What Would You Do?\n- 1. Last year you found that you experienced a lot of distress at exam time. Imagine that in four weeks, it will be exam time again. What could you do to cope better with the stress?\n- 2. Your best friend is complaining of stiff, cramped muscles. The problem has become worse since her parents separated. How would you help her?\n- 3. You have decided to run for class president and must make a speech in front of the student body. What can you do to help yourself perform better during your speech?\n### For Further Study\n1. Keep a stress journal for one week. During the week, note the stressors you face, the ways in which your mind and body react to these stressors, and the coping strategies you use. At the end of the week, determine whether your coping strategies were constructive or unconstructive. Consider other coping strategies that you might have used. 2. At the library, find out more about the work of Hans Selye, the scientist who first identified the general adaptation syndrome. What else did he say about stress in our lives? What other research did he do?" },
{ title: "Understanding Mental Disorders",
  text: "When you begin your sculpture, you don't fully concentrate on what you are doing. You're feeling anxious and depressed, and your thoughts are on your troubles. As your fingers knead the clay, you find you are focusing on the form you are shaping, and you realize that you are feeling a little better.\nExpressing your feelings through some art form or by talking with another person often can relieve feelings of depression. Sometimes, however, emotions can get out of control. Then, special help is needed.\nIn this chapter, you will learn about various mental disorders, how they develop, and what can be done to control them. You'll also find out about the services that are available for help in times of emotional crisis.\n## 1. What Are Mental Disorders?\n### Check Your Wellness\nHow much do you know about mental disorders? To test your knowledge, decide whether each of the statements below is true or false.\n- 1. Some physical diseases, such as brain tumors, may lead to mental disorders.\n- 2. If feelings of depression are long-lasting and interfere with everyday activities, a person should seek professional help.\n- 3. Some mental disorders, such as clinical depression, tend to run in families.\n- 4. Eating disorders, such as anorexia nervosa and bulimia, are really mental disorders.\n- 5. Many suicide victims talk about committing suicide before they actually do it.\n- 6. Some warning signs of mental illness are: sudden personality change, inability to concentrate, risky behaviors, and persistent feelings of hopelessness.\n- 7. Help for mental problems is available from many sources, including school counselors, hotlines, crisis centers, clergy, local hospitals, and mental health clinics.\nWhen are some types of behavior considered normal and appropriate? Why are some types of behavior considered abnormal and inappropriate? As you read about the teenagers described below, would you say they were displaying healthy or unhealthy behavior?\n> In the last six months, Linda has become more and more concerned about germs. She washes her hands at least 100 times a day, scrubs the doorknobs in her house, and insists that her knives, forks, and spoons should be boiled before she uses them.\n> Bob is an avid skateboarder. Since his parents' divorce, he has used his skateboard in increasingly dangerous situations. Now, he regularly dodges cars and trucks as he skateboards across a four-lane highway near school.\n> Pat is five feet six inches tall and weighs 97 pounds. For the past year, she has been on a strict diet of cottage cheese, lettuce, and water. She still considers herself heavy and wants to lose five pounds.\n> Willy enjoys collecting pictures and descriptions of past wars. Outside of school, he spends all of his spare time in his room organizing his collection. He has no time for friends or social activities.\n### Recognizing Mental Disorders\nMost mental health specialists would agree that each of these teenagers shows signs of a mental disorder. A mental disorder is an illness that affects the mind and prevents a person from being productive, adjusting to life situations, and getting along with others. Most mental disorders are characterized by abnormal thoughts, feelings, or behaviors that make people uncomfortable with themselves or at odds with others. Abnormal means that a person behaves, feels, or thinks in a way that is highly unusual and inappropriate in a given situation. Washing your hands before eating is considered normal behavior. Washing your hands 100 times a day like Linda is considered abnormal. When a mental disorder is present, its signs usually occur frequently and over a long period of time.\nLabeling a person as mentally ill is difficult. It involves making a judgment. Unlike a cold or the flu, the signs of mental disorders are not always easy to identify. For example, it is sometimes hard to tell if someone is seriously depressed or just appropriately sad.\nSince each person exists as part of a particular society and culture, each person's notion of mental illness is shaped by his or her culture, as well as his or her family and community experiences. Culture is the ideas, customs, expectations, and ways of living that characterize a particular group of people. A behavior or way of thinking that might be considered normal in our culture may be considered abnormal in another culture. Look at Figure 4-1. Would these behaviors be considered abnormal in another culture? Are they considered normal in our culture?\nYou may be surprised to find that not everyone in your class agrees on what is normal or abnormal behavior. Mental health specialists also do not always agree. For this reason, mental health specialists meet every so often to discuss mental disorders. They define and describe mental disorders and group them according to similar symptoms, which are the signs or evidence of an illness.\nOver the years, the descriptions and classifications of mental disorders have changed. Today, over 230 types of mental disorders are recognized. Although many experts agree on the kinds of mental disorders, there are still many different opinions about the causes.\n### Causes of Mental Disorders\nSome mental disorders have been traced to physical causes. When the cause of a mental disorder is physical, the mental disorder is classified as an organic disorder. The type of brain damage caused by the misuse of alcohol or drugs, such as cocaine, is an example of an organic disorder. The mental confusion and loss of brain function that can occur if an individual has a growth, or tumor, in the brain is another example. This condition is known as dementia (dih men shuh). There are other diseases that also lead to dementia.\nMental disorders not due to alcohol, drugs, or disease are called functional (fung shuh nul) disorders. These disorders can be caused by personal experiences, such as painful childhood experiences or a series of stressful events. These experiences are known as environmental factors.\nThe exact cause of many mental disorders is not understood. Sometimes, there are a combination of factors involved. These factors can include inborn causes, early experiences, and current causes. f\n### Inborn Causes\nSome mental disorders may be inherited, or passed on to an individual before birth, like other physical characteristics, such as eye color and body type. Sometimes, an individual may inherit a tendency toward a disorder. The disorder may only become apparent when.it is set off by an environmental factor, such as repeated physical abuse or a series of difficult events. )\n### Early Experiences\nOther mental disorders may be the result of unresolved conflicts. As you may recall from Chapter 2, Sigmund Freud, the founder of psychoanalysis, believed that these unresolved conflicts often involve childhood or early life experiences. Today, psychoanalysts help people to connect the symptoms of mental disorders with difficult early experiences and unresolved inner conflicts.\n### Current Causes\nSome mental health specialists think that current environmental influences are more important than early childhood experiences in explaining a mental disorder. They consider the significant people in the individual's life, as well as the individual. When treating an individual, these mental health specialists often include persons, such as the patient's family, who are important to the patient.\n### Section Review\n- 1. What is a mental disorder?\n- 2. Why is it sometimes difficult for someone to recognize a mental disorder?\n- 3. What is the difference between organic disorders and functional disorders?\n- 4. Give four examples of various possible causes of mental disorders.\n### What Do You Think?\n- 5. Why do you think that some people seek a doctor's help for a physical disease, such as flu, but hesitate to seek professional help for a mental disorder?\n## 2. Kinds of Mental Disorders\nEvery mental disorder has many different symptoms, depending upon the individual. For this reason, it is difficult to describe in detail specific mental disorders. A case history, a brief description of someone who suffers from a disorder, is often used to give a general picture of the disorder. A case history focuses on only a few symptoms of a disorder, but these symptoms are usually the ones most frequently experienced. You should remember when you read a case history that only a trained, experienced mental health professional can diagnose a mental disorder.\nThere usually is more than one way to treat a mental disorder. The particular therapy, or treatment technique, chosen depends upon the individual and the training of the therapist, the mental health professional. More will be said about the different types of therapies in the last section of this chapter.\n### Anxiety Disorders\nHave you ever been afraid of a situation, person, or object that you knew could not really harm you? Have you been fearful without knowing why? If so, you have experienced anxiety (ang zy ih tee). Anxiety is fear that does not have an identifiable source or fear caused by a danger that no longer exists. Severe anxiety can cause people to flee from situations or objects that cannot really harm them.\n> Case History: Martin was going on a job interview. As he walked toward the elevator, he began to feel dizzy and nauseous. His heart began to pound, and he had trouble catching his breath. He knew he could not face getting into the elevator so he climbed three flights of stairs to get to his interview on time.\nEveryone experiences some anxiety at one time or another. For example, you may feel anxious before a final exam, a big date, or tryouts for the basketball team. These feelings are normal and usually short-lived. When anxiety persists and interferes with normal, everyday functioning, however, it may be a sign of an anxiety disorder. When anxiety is related to a specific situation or object, it is called a phobia (foh bee uh). One of the most common phobias is agoraphobia (ag uh ruh foh bee uh), the fear of going out alone. People with agoraphobia are often too frightened to leave their own homes. Figure 4-3 lists some common types of phobias.\n> Figure 4-3 \u2014 Common phobias. Skanerda bu jadval o\u2018qib bo\u2018lmaydigan holga kelgan; nomlari o\u2018qilganlari: acrophobia (balandlikdan qo\u2018rqish) \u00b7 agoraphobia (yolg\u2018iz ko\u2018chaga chiqishdan) \u00b7 algophobia (og\u2018riqdan) \u00b7 hydrophobia (suvdan) \u00b7 monophobia (yolg\u2018iz qolishdan) \u00b7 mysophobia (iflos va mikroblardan) \u00b7 nyctophobia (qorong\u2018ilikdan) \u00b7 pyrophobia (olovdan).\nWhen Martin, the person in the case history, sought help in handling his severe anxiety, he was diagnosed as having claustrophobia (klaw struh foh bee uh). Claustrophobia is the fear of small, closed places. Martin overcame his fear through psychotherapy (sy koh thehr uh pee). Psychotherapy is conversation with a trained therapist who helps an individual understand and overcome the cause of a mental problem. In Martin's case, the therapist discovered that as a small child, Martin had fallen into a well and had been trapped for several hours. The terror Martin had felt during this experience was the source of his anxiety. Once Martin was able to understand the roots of his anxiety and that the danger he associated with closed places no longer existed, he was able to overcome his fear.\n### General Anxiety and Panic Disorders\nWhen a person is anxious and cannot specify a cause for the anxiety, it is called a general anxiety disorder. When attacks of extreme anxiety come and go for no apparent reason, it is called a panic disorder. A person with a panic disorder can be anywhere when he or she suddenly starts to feel panicky or extremely anxious.\n### Obsessive-Compulsive Disorder\nSometimes, people respond to anxiety by letting an idea or thought take over their mind. An idea or thought that takes over the mind and cannot be forgotten is called an obsession (uhb sesh un). A person with an obsession that leads to a compulsion (kum puhl shun), an unreasonable need to behave in a certain way, has an obsessive-compulsive disorder.\nRemember the case history of Linda at the beginning of this chapter? Linda suffers from an obsessive-compulsive disorder. Because of some deep-seated anxiety, she is obsessed with catching germs. This causes her to behave in a compulsive way: washing her hands constantly, scrubbing doorknobs, and boiling knives, spoons, and forks.\n### Affective Disorders\nWhen the moods or emotions a person feels become extreme and interfere with the person's daily life, it is known as an affective disorder.\n> Case History: Ever since Jason's girlfriend broke up with him, he has been feeling sad and hopeless. Jason used to love playing in the school band, but now he has decided to quit playing the drums altogether. He is having trouble sleeping and feels tired all the time. His grades have fallen from a B average to a D average.\nEveryone feels depressed now and then. It is normal to feel depressed if you experience an important loss or a failure in your life. For example, you would expect to feel depressed if you just broke up with someone you loved, if you had recently moved to a new school, or if you didn't make a team you tried for. Usually, however, the feeling of depression lifts after a few days or weeks, and you get on with your life. In Jason's case, however, his feelings of hopelessness and depression are taking over his life, leaving him unable to cope with everyday activities.\n### Clinical Depression\nWhen a person is overwhelmed by sad feelings for months and stops being able to carry out everyday activities, it is called clinical depression. Clinical depression can be caused by a stressor, or it can be a symptom of another disease, such as alcoholism. Depression also tends to run in families. Negative attitudes learned early in life may also contribute to clin
