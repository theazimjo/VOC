/* ============================================================
   TEMA 1 — CLINIC (Клиническая карта): холодная бумага, сетка
   как в блокноте наблюдений, тизно-зелёный акцент, моно-цифры.
   ============================================================ */
html[data-theme="clinic"]{
  color-scheme: light;
  --paper:#F4F6F5; --card:#FFFFFF; --ink:#12211E; --ink2:#5B6B67;
  --rule:#D7E0DD; --mark:#0E7C6B; --mark2:#2B9E8B; --soft:#DCEFEA; --glow:rgba(14,124,107,.12);
  --logo-filter:saturate(.55) brightness(.95);
  --font-ui:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:'Source Serif 4',Georgia,serif;
  --font-display:'Source Serif 4',Georgia,serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius:9px; --radius-lg:14px;
  --bg-pattern:
    linear-gradient(var(--rule) 1px,transparent 1px) 0 0/100% 27px,
    linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/27px 100%;
  --bg-pattern-op:.35;
}

/* ============================================================
   TEMA 2 — NOTEBOOK (Полевой блокнот): тёплая бумага, линовка,
   переводы «от руки», ржаво-охристый акцент.
   ============================================================ */
html[data-theme="notebook"]{
  color-scheme: light;
  --paper:#E8E2D4; --card:#F5F1E6; --ink:#2E2A22; --ink2:#7A7361;
  --rule:#CFC6AF; --mark:#8B3A2B; --mark2:#A6503A; --soft:#E9D9AE; --glow:rgba(139,58,43,.14);
  --logo-filter:sepia(.35) saturate(.8) brightness(.92);
  --font-ui:'Space Mono',monospace;
  --font-body:'Lora',Georgia,serif;
  --font-display:'Libre Caslon Display',Georgia,serif;
  --font-mono:'Space Mono',monospace;
  --radius:3px; --radius-lg:4px;
  --bg-pattern:repeating-linear-gradient(180deg,transparent,transparent 27px,var(--rule) 28px);
  --bg-pattern-op:.55;
}

html[data-theme="dashboard"]{
  color-scheme: dark;
  --paper:#0F1512; --card:#171F1B; --ink:#EDEFEA; --ink2:#8FA39A;
  --rule:#26302B; --mark:#5EEAD4; --mark2:#FF8A65; --soft:#16332C; --glow:rgba(94,234,212,.18);

  --font-display:'Sora',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:16px; --radius-lg:20px;
  --bg-pattern:radial-gradient(560px 320px at 50% -60px, rgba(94,234,212,.16), transparent 70%);

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-ui),-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding-bottom:56vh;
  position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:var(--bg-pattern);opacity:var(--bg-pattern-op)}
.bar,main,header.plate,.colophon,#panel,.modal{position:relative;z-index:1}
.mark{background:var(--logo) center/contain no-repeat;filter:var(--logo-filter);flex:none}

/* ---------------- toolbar ---------------- */
.bar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--rule)}
.bar-in{max-width:1000px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .mark{width:19px;height:19px}
.wordmark{font-size:11px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;
  margin:0 auto 0 2px;white-space:nowrap}
.wordmark i{font-style:normal;color:var(--ink2);font-weight:400}
#langSel{background:var(--card);border-color:var(--mark);font-weight:500}
select,.btn,input.btn{font-family:inherit;font-size:12.5px;color:var(--ink);background-color:var(--card);
  border:1px solid var(--rule);border-radius:var(--radius);padding:7px 9px;cursor:pointer;line-height:1;
  transition:border-color .15s,background .15s}
select option{color:var(--ink);background:var(--card)}
select option:disabled{color:var(--ink2);background:var(--card)}
.btn:hover,select:hover{border-color:var(--mark);background:var(--card)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.w:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
select{max-width:200px}
#find{width:104px;cursor:text}
.tally{font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--ink2);white-space:nowrap;
  border:1px solid var(--rule);border-radius:99px;padding:6px 11px}
.tally b{color:var(--mark);font-weight:600}
.progress{height:2px;background:var(--mark);width:0%;transition:width .12s linear}
html[data-theme="dashboard"] .progress{background:linear-gradient(90deg,var(--mark),var(--mark2));
  box-shadow:0 0 10px var(--glow)}
html[data-theme="notebook"] .tally{border-radius:99px 4px 99px 4px}

/* ---------------- masthead ---------------- */
.plate{max-width:640px;margin:0 auto;padding:64px 24px 0;position:relative}
.plate .halo{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:420px;height:420px;
  background:var(--logo) center/contain no-repeat;filter:var(--logo-filter);opacity:.045;pointer-events:none}
.crest{display:flex;align-items:center;gap:12px;position:relative}

.crest span{display:block;font-family:var(--font-display),Georgia,serif;font-size:14px;font-style:italic;
  letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink2)}

  line-height:1.1;letter-spacing:-.022em;margin:0 0 16px;position:relative}
.meta{font-size:12px;color:var(--ink2);letter-spacing:.05em;margin:0 0 4px}

/* ---------------- reading ---------------- */

  line-height:1.22;letter-spacing:-.018em;margin:2.6em 0 .9em;padding-top:1.5em;
  border-top:1px solid var(--rule);scroll-margin-top:64px;position:relative}
#text h2::before{content:"";position:absolute;top:calc(1.5em - 30px);left:0;width:20px;height:20px;
  background:var(--logo) center/contain no-repeat;filter:var(--logo-filter)}

#text p.fig{font-size:calc(var(--read)*.72);line-height:1.6;color:var(--ink2);background:var(--card);
  border:1px solid var(--rule);border-left:2px solid var(--mark);border-radius:0 10px 10px 0;
  padding:15px 17px;margin:0 0 1.5em}
.w{cursor:pointer;border-radius:3px;transition:background .12s,color .12s}
.w:hover{background:var(--soft)}
.w.seen{box-shadow:inset 0 -1.5px 0 0 var(--soft)}
.w.active{background:var(--mark);color:#fff;box-shadow:none}

/* TEMA — so'zning matndagi ko'rinishi har xil g'oyaga mos */
html[data-theme="clinic"] .w.seen{box-shadow:none;border-bottom:1.5px dotted var(--mark);box-shadow:inset 0 -1.5px 0 0 transparent}

/* ---------------- word panel ---------------- */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);

.p-head{display:flex;align-items:flex-start;gap:12px}

.lab::after{content:"";flex:1;height:1px;background:var(--rule)}
.uz{font-family:var(--font-display),Georgia,serif;font-size:22px;font-weight:500;line-height:1.35;margin:0;

  text: "You and your friend swoop and glide over the lake like two brightly colored birds. The air is clean and cold, and the ice glistens white against the blue of the sky and the dark green of the pines. The blades of your skates sparkle as you cut a graceful pattern on the glassy surface of the ice. The feeling of all your muscles working together as you gather speed is exhilarating. Your cheeks are tingling with the cold and the excitement. Your whole body is alive with energy and good health.\nEveryone wants to feel good and to have special moments like these. The choices you make every day contribute to your ability to enjoy life to its fullest. In this chapter, you'll find out how you can choose and maintain the particular life style that suits you\u2014a life style that will keep you feeling fit, energetic, and happy.\n### Check Your Wellness\nYour level of wellness is high if you can answer yes to the following questions.\n- 1. Do you eat a well-balanced diet and avoid foods high in fat, salt, and sugar?\n- 2. Do you participate in vigorous exercise at least three times a week?\n- 3. Is your weight within the normal range for your age, height, and sex?\n- 4. Do you feel good about yourself?\n- 5. Do you set aside time each day to relax?\n- 6. Do you avoid drugs, alcohol, and tobacco?\n- 7. Do you get about eight hours of restful sleep each night?\n- 8. Do you have close relatives and friends you can talk to?\n- 9. Can you express your feelings in healthful ways?\n- 10. Do you use a seat belt and avoid driving with a person who is using drugs or alcohol?\n- 11. Do you try to lessen your exposure to air, water, and noise pollution?\n- 12. Are your decisions based on your own values and goals, rather than those of others?\n## 1. What Are Health and Wellness?\nWhat is health? How can I tell if I am healthy? Can I control my own health? How can I influence my future health? You may have just begun to ask yourself questions like these. At one time you might have said that a healthy person is anyone who does not have a cold or some other illness. Now that you are older, you may feel that this definition does not include all the things that cause you to feel well or to be healthy.\n### Aspects of Health\nThe term health has come to have a wider meaning than it used to. It no longer means just the absence of illness. Health is now used\u2014and will be used in this book\u2014to refer to the well-being of your body, your mind, and your relationships with other people. These types of well-being are called physical health, mental health, and social health. The concept of health that includes all three of these aspects is called wellness.\nWhen you are physically healthy, you are able to carry out everyday tasks without becoming overly tired. You have enough energy to enjoy leisure activities and to meet emergencies. If you are mentally healthy, you like yourself for your achievements, and you learn from your mistakes. You can cope with the demands of life and adjust to new situations. When you have healthy social relationships, you get along well with others. You have friends, and you are capable of loving relationships. You respect the rights of others, and you know how to give and accept help.\nIt is easy to see how the three aspects of wellness are related. When you are ill or facing many problems and pressures, your relationships with your friends and family may suffer. When you are coming down with the flu, for example, you may get upset if you are asked to do the dishes or take out the garbage. If you are worried about an exam in a difficult subject, you may get a headache or stomachache. If you are lonely and have few friends, you probably do not feel good about yourself. You may even feel tired or overeat because of your unhappiness.\nThis view of wellness as a combination of physical, mental, and social well-being is also known as a holistic (hoh lis tik) concept of health. Holistic means whole, and here it refers to the connections among these three aspects of health as they affect the whole person. People with a holistic view of wellness are aware of and work to improve all three aspects of their health. They regard wellness as an important goal, the result they want to achieve through their actions. M\nAnother way to express the holistic concept of wellness is with the term quality of life. Quality of life refers to how satisfying and rewarding your life is. Recently, this term has received more attention in our society. One reason for this increasing emphasis can be found in the length and conditions of life that people have now come to expect. Look at Figure 1-2. You can see that since 1900, the life expectancy of Americans has increased by about 27 years. For much of the history of the world, just staying alive and active until age 47 was quite an accomplishment. This is still true in some parts of the world today. You can imagine that people living in areas of drought and food shortages are not concerned about what we call quality of life. They are too busy just trying to stay alive. In this country and other countries, however, many people are concerned about how they will feel and what they can accomplish and enjoy during these added years of life expectancy. These people are concerned not only about feeling good in the present but also about planning for a lifetime of wellness.\n> Figure 1-2 \u2014 Life expectancy in the United States. 1900: 47 years \u00b7 1920: 54.1 \u00b7 1940: 62.9 \u00b7 1960: 69.7 \u00b7 1980: 73.7 \u00b7 1985: 74.7. Source: Statistical Abstract of the United States, 1987.\n### What Determines Health and Wellness\nWhat are some of the factors that influence your wellness and life expectancy? Can you control or influence any of these factors?\nTo answer these questions, consider another set of statistics comparing 1900 to the present. The three leading causes of death in 1900 were not the same as the leading causes of death today. The leading causes of death then were diseases that could be passed from one person to another, as shown in Figure 1-3. In contrast, today's leading causes of death are diseases that are strongly influenced by your individual life style, the way you choose to live your life. As you will see, the way you choose to live your life strongly influences the quality of your life, both now and in the future.\n> Figure 1-3 \u2014 Leading causes of death. In 1900: 1. Pneumonia and influenza \u00b7 2. Tuberculosis \u00b7 3. Diseases of the stomach and intestines \u00b7 4. Heart disease \u00b7 5. Stroke \u00b7 6. Kidney disease \u00b7 7. Accidents \u00b7 8. Cancer \u00b7 9. Childhood diseases \u00b7 10. Diphtheria. Today: 1. Heart disease \u00b7 2. Cancer \u00b7 3. Stroke \u00b7 4. Accidents \u00b7 5. Lung disease \u00b7 6. Pneumonia and influenza \u00b7 7. Diabetes mellitus \u00b7 8. Suicide \u00b7 9. Liver disease \u00b7 10. Atherosclerosis.\nOf course, some other factors also influence your health and wellness. These include heredity, environment, and culture, but even these factors are affected to some extent by your life-style decisions.\n### Heredity\nTo some extent, heredity, all the traits that are passed on biologically from parent to child, determines a per son's level of wellness. These traits include hair color, eye color, height, build, and many other characteristics. Heredity also influences the soundness of your body, your reactions to stressful situations, and the aging process.\nAs you probably know, some disabilities, diseases, and tendencies toward certain illnesses are inherited. Although inherited disabilities put some limits on an individual's level of wellness, there are still many things a person can do to reach his or her optimum (ahp tuh mum) health, the highest level of wellness possible. Many disabled people are energetic and productive and enjoy a high quality of life in spite of their disabilities.\nOvercoming a disability is an extreme example of using mental, social, and physical resources to make up for a limitation. There are also less dramatic examples. For example, some people inherit a tendency toward high blood pressure, a condition that can contribute to heart disease and shorten life. If they are aware of their condition and know how to cope with it, they can make diet and other life-style changes to control their blood pressure. Their actions allow them to lead long and healthy lives in spite of this inherited tendency.\nExcept in a small number of cases, heredity does not prevent a person from enjoying a healthy life. For most people, the life-style choices they make every day are far more important than heredity in maintaining, harming, or improving their wellness.\n### Physical Environment\nYour environment is all your surroundings and the influences they have on you. To be healthy, everyone needs a healthful physical environment, or physical surroundings. You know that climate, extreme heat or cold, and extremely dry or damp air can affect your wellness. It is also true that air pollution, water pollution, radiation, and even loud noise can injure your health.\nIf you are aware of environmental hazards, you can take steps to protect yourself. You can avoid swimming in polluted water, wear a sunscreen for protection against the sun's rays, and always keep your radio's volume at less-than- harmful levels.\nYou can also take steps to make your environment healthier. Everyone should be aware of the dangers of a polluted environment and help to limit or decrease pollution. That includes disposing of waste materials correctly, bicycling or walking short distances instead of driving, and recycling paper goods, cans, and bottles. Some teenagers are part of environmental watch groups that keep track of air and water cleanliness in their communities.\nYour physical environment includes the environment indoors as well as outdoors. Your home, school, and workplace are part of your physical environment. Cigarette smoking in public places and disease-causing organisms in restaurant food are some indoor hazards of the physical environment. Your own knowledge and behavior can help make your physical environment safer. How could you and your friends contribute to improving the environment of your school cafeteria or a local park?\n### Social Environment\nYour environment is made up of more than your physical surroundings. The people around you\u2014your family, friends, and other people you spend time with\u2014make up another part of your environment, your social environment.\nWhen you were a child, your parents were the major part of your social environment. They taught you to speak and to communicate in other ways. They strongly influenced your feelings about yourself and your ideas of how to get along with other people. In addition, they probably taught you health habits that are so basic you do not even think about them anymore. Washing your hands before eating or fixing a meal, for example, may have become routine, but now you understand that these habits help to prevent the spread of germs.\n### Mind Over Illness?\nDo emotions and thoughts play a role in helping the body ward off disease? The new field of psychoneuroimmunology (PNI) suggests they might. PNI researchers are now exploring the two-way connection between the brain and the immune system, the body's defense against disease. The brain's\nnetwork of nerves releases many chemicals, some of which depend on mood. These chemicals bind directly to the disease-fighting cells of the immune system and influence how the cells behave. Immune cells are more active when a person's mood is good than when he or she is depressed.\nThe immune cells send chemical messages back to the brain. These chemicals affect sleep, body temperature, heart rate, and mood.\nPNI supports common beliefs. A person with a positive attitude combats disease better than someone who has \"lost the will to live.\" Good health and a positive outlook tend to reinforce each other. While wellness may not be \"all in your mind,\" PNI has found that there is a close connection. What role does mood play in fighting disease?\nAs you have grown older, your social environment has expanded to include your neighbors and schoolmates. Your teachers, relatives, friends, and those involved in the community activities you participate in are an important part of your social environment.\nYou have probably heard a lot of talk about peer pressure. Traditionally, the word peers has meant equals, those people who are in the same situation as you. Today, it is often used to mean your friends, or a larger group of acquaintances your own age. The friends you select from among your acquaintances can have an important effect on your level of wellness. Friends who practice unhealthful behaviors can put a lot of pressure on you to do the same. It is sometimes difficult to stand up to that kind of pressure. Selecting friends who choose healthful habits and life styles makes it easier for you to choose wellness.\n### Culture\nYour social environment is only one part of your culture. Culture is all the ideas, customs, and ways of living that characterize a particular group of people. That group may be a nation, a region of a country, or an ethnic group. Culture includes accents and food preferences, attitudes and manners.\nSometimes you are not aware of the characteristics of your own culture until you come in contact with another culture. You probably do not think you have an accent until you visit a part of the country where people speak differently. In some cultures, it is rude to take off your shoes when visiting someone else's house; in other cultures it is rude not to. In some cultures, people eat little or no meat; in others, meat is central to the diet. This is just one example of how cultural differences can affect your health. Can you think of other examples?\nSometimes, you may get \"mixed messages\" from your culture. For example, our culture emphasizes the value of health and fitness. At the same time, it suggests that unhealthful behaviors, such as smoking and drinking, are fun and part of a healthful life style. You have probably seen advertisements with young, healthy-looking people trying to promote products that are not really good for your health. Because your culture offers you so many choices, you must be informed about what promotes health and what does not. This way you will be able to make your own choices without being influenced by misleading messages.\n### Section Review\n1. What are the three aspects of wellness?\n- 2. What is a holistic view of health?\n- 3. How are the three leading causes of death today different from those of 1900?\n- 4. What factors determine your health? Which of these factors can you control?\n### What Do You Think?\n- 5. What are two ways you could improve your physical health? Your mental health? Your social health?\n## 2. You and Your Health\nIf there were just a few painless habits you could choose to practice that would lead to a long and healthy life, of course you would practice them. Even if there were no absolute guarantee of good health, just a greater probability of it, the choice would still be worthwhile. Such a choice does not come from a fairy-tale land of magic potions that protects the user from disaster. It is a real choice you can make in your daily life. One way to judge the changes in your health that your daily life-style choices can make\u2014for the better as well as for the worse\u2014is to use the Illness-Wellness continuum.\n### The Illness-Wellness Continuum\ni\nRemember the last time you were coming down with, the flu? You could feel it beginning, perhaps with a runny nose or general tiredness. Then, your symptoms became worse and your energy level dropped lower. You might have run a fever and had to stay in bed. After several days, your fever broke, you felt more energetic, and your cough no longer kept you awake at night. You might have been a bit tired and sniffly still, but you were feeling better. Finally, you felt great again.\nYou moved from having the sniffles to walking around with a cold to lying in bed with a fever and cough to being up and around with a few symptoms to regaining wellness. You can think of the sequence you followed\u2014from wellness to illness and back again\u2014as a continuum (kun tin yoo um), a progression in either direction from one stage (sniffles) to another (walking around with a cold) to another, and so on.\nContinuums can represent other health-related changes in your life. How would you use a continuum to express changes you might experience when you start (or stop) an exercise program? How could a continuum show the changes brought on by your moving away from friends to a new school or by failing to make the swim team?\nYour overall wellness also can be illustrated on a continuum. This sliding scale is called the Illness-Wellness continuum. Look at Figure 1-7. Notice that on the Illness- Wellness continuum, you can move in either direction. As you move in one direction, you move toward illness; as you move the other way, you approach wellness. You can see also that there is a midpoint on the continuum. At this neutral point, a person is not sick but is not enjoying the full benefits of optimum health, either.\nAt one time, as you learned earlier, many people in this country were satisfied just to be at the neutral point of health. Then, people were much more concerned about avoiding illness than about improving the quality of their lives. Today, achieving a higher level of wellness and a better quality of life is possible for many of the people in this country. More than ever before, people today control where on the Illness- Wellness continuum they fall.\n### Risk Behaviors\nLook again at the Illness-Wellness continuum in Figure 1-7. You can see that a risk behavior, or an action that increases the chances of a harmful outcome, moves you toward the illness-early death end of the continuum. You are probably aware of many risks to your health and do your best to avoid them. For example, you know it is dangerous to run across a four-lane highway. You also know that wearing a seat belt in a car will reduce your risk of injury in case of accident, but do you always remember to use one? If you do not, you are taking a risk that moves you toward the illness- early death end of the continuum. Perhaps thinking about your behavior in these terms will change your mind about some of the unnecessary risks you take.\nMost activities have varying degrees of risk. For example, if you exercise vigorously without doing warm-ups first, you risk pulling a muscle. If you ride a motorcycle without a helmet, you risk serious injury and death.\nSometimes, risks are worth taking if there is a benefit greater than the possible harm. Skiing, for example, involves some risk of injury, but many people decide that this enjoyable and healthful activity is worth the risk. They also may realize that equipment, instruction, fitness, and attitude can lessen their risks while skiing. It is always worthwhile to think carefully about any activities that involve risks before you do them. \u0410\nNot all risk behaviors involve immediate threats to your physical safety. Eating an unbalanced diet is a risk behavior. As you may know, the typical fast-food meal contains a great deal of salt, fat, and sugar. Eating a meal like this too frequently may cause you to put on too much weight. Living on a diet of fast food may lead to more serious, long-term health problems, such as cancer and heart disease. How far along the Illness-Wellness continuum do you think one fast- food meal per week would move you? What about two meals per day? You will learn more about the effects of dietary risk factors in Chapters 8 and 9.\nAnother set of risks to your wellness involves mental and social health. Keeping anger or other strong emotions \u201cbottled up\u201d inside can risk both your mental and social well being. It is much better for your health to express your feelings by talking with someone you trust. Your relationships with others will also benefit. Strong negative feelings, when not communicated, can harm a relationship, causing resentment, jealousy, and arguments. You will learn more about the healthy expression of emotions in Chapter 2 and about communication skills in Chapter 5.\n### Moving Along the Continuum\nTo achieve a better quality of life, you need to know about, choose, and practice behaviors that promote wellness. You also should be aware of your own particular conditions and needs. Awareness is the first step toward making healthful choices and decisions. The second step is acquiring the knowledge you need to promote your own wellness. Some of this knowledge is general information, such as the benefits of regular exercise, and some knowledge may relate to your particular circumstances, such as the proper diet for gaining weight.\nYou also need to be able to distinguish between risk behaviors, which lead away from wellness, and healthful behaviors, which lead toward wellness. The last step is applying your awareness and knowledge by making healthful choices and then taking action on those choices.\nThe remainder of this chapter, and the chapters that follow, will show you how to gain an awareness of your own health, how to acquire and evaluate health-related knowledge, and how to decide which behaviors best promote your health. Finally, you will learn how to turn your decisions into a healthful life style.\n### Awareness\nHow do you become aware of your own level of wellness? In some cases, you know when you have a health problem. You know when your ankle hurts or when you have a sunburn. You are probably aware that some symptoms require medical attention and some do not.\nOther medical problems do not show up so readily. You should have regular check-ups to detect early signs of illness you might not be aware of. At these check-ups, you will probably discuss your life style, including what you eat, how much you sleep, how much exercise you do, and whether or not you smoke. Together, you and your doctor can determine if you are at risk for certain health problems because of your life-style choices.\nYou may even discuss some of your feelings with your doctor. If you are depressed, for example, it is worthwhile to discover why. Feeling \"low\" all the time can be the cause or the result of a physical problem. If you are unhappy because of something that cannot be changed, such as the death of a loved one, the support of friends or professionals may help you to understand and accept your feelings.\nLearning what questions to ask of your doctor and of yourself is an important step toward health self-awareness. The Check Your Wellness inventory at the beginning of this chapter should give you a good start. How well did you do on the inventory? What other questions might you ask yourself about your health? What questions might you ask your doctor or other health professional?\n### Knowledge\nKnowledge about health is growing every day. New discoveries and research studies appear in the news all the time. Some of this knowledge\u2014about the dangers of overexposure to sunlight, for example\u2014is important to everyone. Some, such as the development of new medications, is useful to the professionals who prescribe them. Other information, such as research on the harmful effects t of a particular fad diet, is important to people who may try it. You need to be able to sort out the knowledge that might apply to your life.\nSome sources of health information are more reliable than others. Which is a better source of knowledge, an advertisement for a quick weight-loss diet or a study of weight loss in a scholarly journal? While the answer to that question is obvious, the value of other sources of information may not be as easy to determine.\nThis book gives you a good foundation of health-related knowledge. It also suggests how you can evaluate other health information you receive. It is up to you to stay informed about things that affect your wellness. The process of updating your knowledge is one you will need to continue throughout your life.\n### Behavior Choices\nEven with awareness and knowledge, it is not always easy to decide on the best course of action. In the earlier discussion of risks, the action of running across a highway presents a clear risk, but the skiing example is more complicated. Many behaviors have both positive and negative results, and you must choose between them. Sup pose you were an inexperienced skier invited to ski a run known for its difficulty. Your best friend, a good skier, could not go on the trip if you. did not go. Add some more complications, such as bad weather, or an upcoming exam for which you need to study, or alcohol being consumed in the car. Real life is full of such complications. How would you decide what to do?\nAwareness of your own skiing ability is essential in this example. Knowledge of the dangers of driving or skiing in bad weather is also important, but even more important is knowledge about the extreme risk of drinking and driving. But, what about your friend or your exam? Here you must consider your values, the things most important to you. You value friendship, but you also value your own and your friend's safety. You value doing well in school, and so do your parents. Your decisions not only affect you, they affect other people, their health, and their values. The DECIDE process described in the Health Skills on page 16 provides a step-by-step procedure that can help to make hard decisions easier. Look at the DECIDE process and review the steps. How could you apply these steps to the skiing example?\n### Skills\nWhat would you think of a baseball team that spent all its time thinking and learning about the game but never played? Do you think that the team would win many games without practice? Of course not. Many people think that knowing about healthful behavior is enough to guarantee good health. This is not true. Like the baseball players, 4 you have to practice. To have good health, you must apply the healthful decisions you have made.\nOne quality a successful baseball player needs is skill. Awareness of natural talent, knowledge of the game, and a good choice of bat are not much good without the skill to hit a curve ball or lay down a bunt. How do baseball players develop new skills? They usually begin by observing and analyzing their current behavior. Next, they make changes. Then, there is practice and more practice.\nJust like the baseball player who worked to change his or her swing, you may have some habits you wish to change. A habit is a pattern of behavior that has become automatic and is hard to break. It is possible, however, to break old habits by learning new skills. With practice, your new skills will become just as natural as the old habits had been. The Health Skills in this book will help you to develop the skills you need to put decisions for wellness into action.\n### Section Review\n1. What is the Illness-Wellness continuum?\n- 2. What is a risk behavior? Give an example of an immediate risk and a long-term risk.\n- 3. What steps should a person take to move toward the wellness side of the Illness-Wellness continuum?\n### What Do You Think?\n- 4. Where do you think you are on the Illness-Wellness continuum? List five behaviors that you currently practice that influence your level of wellness. A\n## 3. Taking Control of Your Health\nNow is the time for you to start taking control of your own health. In the last few years, as you have become more physically and emotionally mature, you have also become more independent. You have begun to make many of the decisions that used to be made for you by your parents and other adults. How many of your own food choices do you now make, for example? Who decides how much exercise you should do? Who chooses your friends? Who decides what yo a do with your friends? More and more, the answer is you.\n### Accepting Responsibility\nNow that you have so much control over your own life, you also need to accept responsibility for it. Begin by learning the answers to these two questions: What are the leading causes of death among teenagers today? What are the risk behaviors associated with these deaths?\n> Figure 1-11 \u2014 Leading causes of death among teenagers. 1. Accidents \u00b7 2. Suicide \u00b7 3. Homicide \u00b7 4. Cancer \u00b7 5. Heart disease \u00b7 6. Birth defects \u00b7 7. Stroke \u00b7 8. Pneumonia and influenza \u00b7 9. Lung disease \u00b7 10. Diabetes mellitus.\nIn Figure 1-11, you can see that the three most common causes of teenage death are not illness. Would you be surprised to learn that there is a risk behavior common to all three? That risk behavior is substance abuse, the use of alcohol or drugs. Most fatal accidents, for example, involve cars, and nearly half of all car accidents involve alcohol or drugs. Many suicides, too, are related to substance abuse. Homicide also is often tied to drugs and alcohol. The impaired judgment of people under the influence of drugs or alcohol can lead to violent behavior.\nSome other risk behaviors also contribute to the rate of death among teenagers. These include: taking chances for the fun of it; being unwilling or unable to talk about problems or to ask for help; and accepting a known risk just to be one of the crowd. You will learn more about each of these risk behaviors throughout this book.\nSome of these risk behaviors contribute to another set of health threats to teenagers: unwanted pregnancy and sexually transmitted diseases. All of these problems have a major impact on physical, mental, and social health. They affect not only the quality of your life but that of others. Making responsible decisions about relationships of all kinds, including sexual ones, is an important sign of maturity. It shows that you are beginning to take control of your own health. Thinking about the possible effects of your actions before you take them may be difficult, but it is an important thing to do.\n### Looking Ahead\nConsidering the long-term effects of your behavior is another sign of maturity. Earlier in this chapter, you looked at the statistics on life expectancy and causes of death for adults today. The decisions you make and the behaviors you practice now are already influencing the length and quality of life you can expect in the future.\nThe most common killers of adults today are health conditions that can be strongly influenced by life style. Life-style choices include diet, exercise, and the use of tobacco, alcohol, and other drugs. Your current and future health depend largely on the decisions you are starting to make now. Learn ing to make decisions for wellness and to practice healthful behaviors is a wise investment that you can make in yourself and your future. It is an investment that pays the highest reward\u2014the reward of good health.\n### Section Review\n1. What are the three most common causes of teenage death today?\n- 2. What kind of accidents kill the most teenagers?\n- 3. What risk behavior is often associated with the three leading causes of teenage death?\n### What Do You Think?\n- 4. What life-style changes could you make now to improve your future quality of life?\n## Health Skills: Making a Decision\nSuppose you had to make this decision: You've just found the perfect after-school job. It's near home, it's fun to do, and it will pay for the bicycle you need for your bicycling trip next summer. Then you make the basketball team that you've tried out for three times. Unfortunately, the team practices during the same hours as your job. How should you choose between the team and the job?\nAlthough many of your choices are not this complicated, you sometimes face even harder decisions. They require much thought and soul-searching because they can make important differences in your life. Do you sometimes \"hide from\" tough choices because they make you feel anxious? Do you ever rush headlong into decisions without really thinking them through? There is a process, called DECIDE, that makes decision-making easier. This process is simple to remember because each letter in the word DECIDE stands for a step in the process.\n### 1. Define the Problem\nLook carefully at the decision you are facing, and state the issue clearly. Is it important and complex enough to warrant using DECIDE? Some choices are too easy. You already know what to do. Others don't really make much difference, a flip of a coin would do.\n### 2. Explore the Alternatives\nMake a list of all possible alternatives for solving your problem. Be sure to include \"doing nothing\" if it is appropriate. If you need more information to fully understand some alternatives, do the research now. You may find some choices unrealistic; do not include them.\n### 3. Consider the Consequences\nOne by one, think through what might happen with each alternative. List both positive and negative results. Consider what probably would happen, not what you hope would happen. Ask yourself: How risky is each alternative? What are its chances of success? How would it affect my future? Re member to consider the effects on other people.\n### 4. Identify Your Values\nYour values, the things you believe in strongly, affect how you live your life and how you feel about yourself. Sometimes, your values- influence your decisions even when you are not aware of them. At other times, you may overlook your values when you want something badly. When you do this, though, your values often affect how you feel about the decision later on. Think about your long-term goals as well as the beliefs of your family, religion, and community. Consider your own and others' health and safety, and yourself-respect. Which of the choices are most in line with your values?\n### 5. Decide and Act\nUse the information you have collected to compare each of the alternatives. Decide which one is best for you. Act on your decision by first breaking it down into smaller steps, and then setting a realistic deadline for accomplishing each step. Then, follow through with your plan.\n### 6. Evaluate the Results\nHow did your decision work out? What are its effects on your life? On others? What did you learn? What would you do differently? If you can change some aspect of the result for the better, do it now.\n### Apply the Skill\n- Imagine that you face the decision introduced at the beginning of this feature \u2014 to choose the job or the team. Follow the steps of DECIDE to determine what you would do in this situation. Write out your answers for steps 1 through 5. Be sure to consider all alternatives; there may be more than two. (For example, it may be possible to postpone a choice or to take another route to a goal.) Don't forget to include the step to act on your decision.\n- List other difficult, important decisions for which DECIDE might be useful. Do they fall into categories? What categories of decisions would not be suitable for DECIDE?\n- Set up a possible situation like the one in the beginning of this feature. In other words, imagine a person facing a complicated, important decision. Include enough information about the problem to show that it is a tough choice. Then use DECIDE to work through the decision-making process. Remember, at times there is more than one \"right\" choice. Your particular values, skills, background, and preferences all help determine what is right for you.\n- Consider a tough decision you have made in the past or one you are facing now. Use DECIDE to determine what you should do (or should have done). Write out steps 1 through 5. Did DECIDE help you focus on important values or choices you might otherwise have overlooked? Which ones? Did DECIDE make the decision-making process easier? Why or why not?\n## Chapter Review\n### Chapter Summary\n- Health is more than the absence of disease; it is the well-being of your body, mind, and relationships with other people.\n- The holistic concept of wellness emphasizes the connection between physical health, mental health, and social health.\n- Your behavior, or life style, has the strongest influence on your level of wellness. Other factors that influence your level of wellness include heredity, physical and social environment, and culture.\n- Your level of wellness can be illustrated on a continuum known as the Illness-Wellness continuum. As you move in one direction, you move toward illness or early death. As you move in the other direction, you move toward overall wellness. At the midpoint, you are neither ill nor well.\n- Risk behaviors increase the chances of illness or death. It is important to analyze the risks of an activity before doing it.\n- You can change your level of wellness by increasing your self-awareness, acquiring knowledge, making healthful behavior choices, and practicing and using skills.\n- The major health hazards for teenagers include accidents, homicide, suicide, unwanted pregnancy, sexually transmitted diseases, and drug and alcohol abuse.\n- The life-style decisions you make and carry out now affect both your current level of wellness and your future quality of life.\n### Vocabulary Review\nListed below are some of the important terms in this chapter. Choose the phrase that best describes the term in the exercise that follows.\n> continuum \u00b7 culture \u00b7 environment \u00b7 goal \u00b7 habit \u00b7 heredity \u00b7 holistic \u00b7 Illness-Wellness continuum \u00b7 life style \u00b7 optimum health \u00b7 physical environment \u00b7 quality of life \u00b7 risk behavior \u00b7 values \u00b7 wellness\n- 1. the way or style in which you choose to live your life\n- 2. all your surroundings and the influence they have on you\n- 3. the well-being of your body, mind, and relationships with other people\n- 4. a sliding scale that illustrates your overall level of wellness\n- 5. whole\n- 6. an action that increases the chance of a harmful outcome\n- 7. all the traits passed on biologically from parent to child\n- 8. a pattern of behavior that has become automatic and hard to change\n- 9. all the ideas, customs, and ways of living that characterize a group of people\n- 10. the highest level of wellness\n### What Have You Learned?\n- 1. Briefly describe three characteristics of mental health.\n- 2. Give an example of how the three aspects of health are interrelated.\n- 3. How much has the average life expectancy of Americans increased since 1900?\n- 4. How can heredity affect your overall level of health?\n- 5. List three possible health hazards in the physical environment. Explain how you can protect yourself from them.\n- 6. Define peer pressure and explain how it can affect your health.\n- 7. Use a continuum to illustrate a health-related change in your life.\n- 8. List three risk behaviors that can be fatal.\n### What Do You Think?\n- 1. Describe a problem you recently had to face. Then explain how your physical, mental, and social well-being played a part in reacting to the problem and in resolving it.\n- 2. In spite of all the knowledge available about the health risks of smoking, many teenagers still smoke. Why do you think this is so? What argument against smoking do you think would be the most effective for teens?\n- 3. Compare a TV, magazine, or newspaper ad promoting a healthful behavior with one for \u2026 (skanerda tugallanmagan)\n### What Would You Do?\n- 1. You have a friend who lives on junk food and smokes cigarettes. He says he knows these behaviors are not harming him because he feels fine. What would you tell him?\n- 2. You are not getting along with your friends or family. Often, you want to be alone. Should you seek help? From whom? Explain.\n- 3. All your friends are drinking a diet supplement instead of eating regular meals. When you ask about the diet, they give you the brochure that came with the supplement. How \u2026 (skanerda tugallanmagan)\n### For Further Study\n- 1. Find out what is meant by the term preventive medicine. How does preventive medicine lead to optimum health?\n- 2. Research the disease tuberculosis. Find out the cause of the disease and what environmental and social conditions led to its being a \"killer disease\" in 1900. Then, explain why tuberculosis of the lungs, or consumption, is no longer a major threat in this country.\n- 3. Look in the library for reliable sources of information about health; ask a librarian for help, if necessary. Select three sources and explain why they are reliable." },
{ title: "Your Personality",
  text: "> Bu bobda o\u2018qiysiz: shaxsiyatingiz ruhiy salomatligingizga qanday hissa qo\u2018shishi \u00b7 shaxsiyat qanday shakllanishi \u00b7 his-tuyg\u2018ularni sog\u2018lom yo\u2018l bilan ifodalashni o\u2018rganish nega muhimligi.\nYour party guests will be arriving shortly. You check the table again to be sure everything is in order. You rearrange the fruit bowl, and count the dishes for the third time. You've been looking forward to your party for weeks, but now you're feeling nervous. You take a look at yourself in the mirror and try out your best party smile. You step back and . . . there goes the doorbell!\nEveryone is a bit nervous before a party, although most people aren't likely to admit it. Everyone feels shy and unsure sometimes. These are normal feelings that you cannot get rid of entirely. However, you can learn how to keep them in perspective and how to deal with them positively. In this chapter, you'll learn about ways to build your self-image so that you'll feel better about yourself. You'll also learn how to improve the way you reveal your personality to others. You express your unique personality in everything you do.\n## 1. Personality and Mental Health\n### Check Your Wellness\nDo your attitudes and behaviors contribute to your mental health? See if you can answer yes to the questions below.\n- 1. Do you usually feel good about yourself and your life?\n- 2. Are you aware of your strengths and your weaknesses?\n- 3. Are you able to give love and receive it?\n- 4. Do you enjoy spending time alone?\n- 5. Can you handle your disappointments and learn from them?\n- 6. When you feel sad or angry, do you express your feelings in appropriate ways?\n- 7. Can you share your feelings with close friends and family members?\n- 8. Are you open to new ideas and experiences?\nThink about a party you have been to recently. Remember the different ways people were acting. One person may have been the \"life of the party.\" Perhaps some others enjoyed dancing, while yet another group of people held a quiet conversation. There might have been another person sitting quietly on the couch, watching the dancing and appearing not to have a care in the world.\nDid you ever wonder why people act so differently in the same situation? It is because each person has a unique personality. An individual's personality consists of the traits that make him or her different from everyone else. These traits include behaviors, attitudes, feelings, and ways of thinking that are characteristic of an individual in a given situation. For example, when you are introduced to a new group of people, you may be characteristically outgoing or you may be shy. At school you may be the first to raise your hand, or you may be daydreaming. You may cry frequently or hardly ever. These traits are all part of your personality.\n### Describing Personality\nHow do you describe someone's personality? Here is how four teenagers described their own personalities:\nYoon: I have a lot of energy and make friends easily. I love sports and am very competitive. But if things don't go my way, I get extremely upset and even throw tantrums.\nRichard: School doesn't interest me all that much, but I study enough to get by. Sometimes I just don't feel like talking to people and prefer to be by myself. I like to stick to doing the things that I am used to.\nCory: I'm usually in a pretty good mood. Things just don't bother me the way they do some people. If a problem comes up, I can usually figure out how to solve it.\nSally: People call me the class clown. Sometimes I like to liven things up with jokes. There are a few subjects in school that really interest me, so I devote a lot of time to them. After school I enjoy spending time with my friends.\nIn describing their personalities, these teenagers chose the behaviors, feelings, and thoughts that best defined the way they are. How would you describe your own personality? Think about the things you like to do and how you A normally act. Do you tend to be friendly and outgoing? This is called being an extrovert (ek struh vurt). Are you an introvert (in truh vurt), someone who is less outgoing and whose thoughts are directed inward? Are you moody or even- tempered? Driven or relaxed? Would you say you are assertive (uh sur tiv), able to stand up for yourself and express your feelings in a nonthreatening way? Perhaps you are more passive, holding back your thoughts and feelings and yielding to others, or aggressive, communicating your ideas and feelings in a forceful or threatening way. Are you satisfied with the way you are? Are there any characteristics of your personality that you would like to change?\n### The Healthy Personality\nLook back at the descriptions of Yoon, Richard, Cory, and Sally. Which of these teenagers would you say has a healthy personality? Which would you consider an unhealthy personality? Why?\nWhen psychologists (sy kahl uh jists), people who study the human mind and behavior, are asked to describe characteristics of a healthy personality, they often speak of mental health. Mental health is the state of being comfortable with yourself, with others, and with your surroundings. People who are mentally healthy are also:\n- realistic about their strengths and weaknesses.\n- able to take on the responsibilities of daily living.\n- caring toward themselves and others.\n- able to handle disappointments and learn from them.\n- able to feel enjoyment and a sense of achievement.\nPsychologists like to think of mental health as a continuum much like the Illness-Wellness continuum you read about in Chapter 1. Individuals can move toward the wellness end of the mental health continuum by developing the characteristics listed above.\nPsychologists have found some personality traits are often associated with mental health. Mentally healthy people tend to be friendly, optimistic, and loving. They are also able to be assertive, laugh at themselves, try new experiences, and strive to do the best they can. What other personality traits do you think are important for mental health?\n### How Is Personality Formed?\nSome personality traits appear to be inborn. They are acquired by heredity, the transmission of traits biologically from parent to offspring, just as hair color and eye color are. Other personality traits are shaped by a person's environment (en vy run ment), the physical and social conditions surrounding a person. Most personality traits, however, are believed to be influenced by a combination of heredity and environment.\n### Heredity\nPersonality traits apparent shortly after birth are thought to be inborn. In fact, even before birth, some aspects of personality are evident. For example, some babies kick and move around a lot inside their mothers, while others are relatively calm.\nAfter birth, individual differences become more apparent. Some babies are calm and cheerful; others tend to cry a lot. Some babies hate new surroundings; others seem to thrive on a change of scene. These differences indicate that each person is born with definite personality traits. Psychologists are not sure how these early personality traits affect one's personality later in life.\nScientists believe a person's basic intellect may also be inherited. It is also thought that talents, such as musical or artistic abilities, may be at least partly inherited.\n### Environment\nAlthough some early personality differences persist into adulthood, most are modified by a person's environment. Your friends, family members, home, school, and even the climate that you live in affect your personality.\nExperiences during childhood strongly influence the development of a healthy personality. A baby who is lovingly cared for learns to trust and love others. Children learn about feelings, attitudes, and appropriate ways of behaving from the people close to them. This process is called socialization (soh shul ih zay shun). As children develop, they copy the behavior of others. This is called modeling. For example, a child may learn acceptable table manners by watching his or her parents' behavior at the table. Children also learn through conditioning, or being rewarded for desirable behaviors and punished for undesirable behaviors. A child who is repeatedly praised for trying to do new things for himself or herself is very likely to grow up self-reliant and willing to try new experiences.\nBeginning with childhood and extending throughout the teenage years, friends, school, and community become increasingly important influences on personality. American teenagers spend more than half their time with other teens. These friends, who are about the same age and share similar interests, are known as a peer group. By being part of a group, you learn how to get along with others. A peer group also gives you a chance to learn about yourself and to make decisions and to do things without your parents. Being a part of a healthy peer group is likely to have a positive influence on your personality.\nBy young adulthood, your personality traits are fairly well established. This does not mean you cannot work to change personality traits with which you are dissatisfied. In fact, recognizing weaknesses and working to improve them is a sign of mental health. At the same time, it is important to recognize your strengths and achievements.\n### Your Self-Concept\nIf you were to ask a psychologist what the most important influence on mental health is, the answer would be self-concept. Your self-concept, the physical and mental picture you have of yourself and your place in the world, includes all of the beliefs that you have about yourself. People with a positive self-concept feel good about themselves and have a realistic view of their strengths and weaknesses. They maintain a positive attitude even when they fail at a task and they take the opportunity to learn about themselves.\nThey show that they value themselves by taking care of their health and appearance and by forming close friendships.\nYour self-concept begins to form when you are young. It depends on the responses of others to your behavior and appearance. Young children need support and encouragement from family members to develop a positive self-concept and to become confident individuals. As you grow older, teachers, friends, and other people, as well as events in your life, influence your self-concept. If you do well in school or excel at a sport, your achievements and the encouragement you receive can influence your self-concept in a positive way. Think about the people and events that influenced your self-concept. How have these events helped you form a realistic picture of yourself?\nYou may realize that you are not always the same person in different situations. You behave differently in public than in private. For example, your public self, the way you want others to see you, may be cheery and outgoing, while your private self, the real you or the way you are when you are alone, may often feel shy and insecure. Although it is normal to have these two \"selves,\" it is best when your public self and private self blend into one. People with a positive self-concept are not afraid to reveal their true nature: It is not easy to let others see your faults. By revealing your weaknesses as well as your strengths, you let others know that you feel good about yourself and about them.\nIt may be difficult to improve your self-concept, but it can be done. It is a good idea to take an inventory of your strengths and weaknesses. Learn to focus on your strengths and build on the things you do well. Select friends who will give you support and encouragement to do what you do best. Focus on activities in which you can excel, but accept the fact you will not excel in everything. When you do experience defeat or discouragement, avoid dwelling on it. Try to learn something positive from the experience and then move on to something else.\n### Kasblar \u00b7 San\u2019at, raqs va musiqa terapiyasi\nSometimes an effective way to help people understand themselves and their problems is through creative expression. Art, dance, and music therapists combine their artistic talents with therapy programs to help improve a person's self-concept. An art therapist may teach people to paint or create things with their hands. A dance therapist may teach a person how to move in a graceful manner. A music therapist may teach a person to play a musical instrument or sing.\nArt, dance, and music therapists work with a wide range of people from the mentally ill to the physically handicapped. They may also provide instruction and therapy for children at summer camps or they may work with the elderly in nursing homes.\nFor these careers, you need a bachelor's degree in psychology or in art, dance, or music therapy. You also need a solid background in either art, dance, or music.\n### Section Review\n- 1. Define the term personality.\n- 2. Give five characteristics of mental health.\n- 3. How does a person's environment influence his or her personality?\n### What Do You Think?\n- 4. Your best friend is struggling to overcome a negative self-concept. She or he asks you for help. What could you say or do to help?\n## 2. Theories of Personality\ni\nPeople's personalities change as they grow and are exposed to new ideas, attitudes, and behaviors. Still, some basic personality traits stay the same throughout a person's life. Think back to when you were seven or eight. How has your personality changed since then? In what ways has it remained the same?\nPsychologists have tried to explain how and why the human personality develops. These explanations are called theories. A theory (thee uh ree) is an organized set of ideas used to explain something. Three important theories of personality will be described in this section.\n### Freud\nIn the late 1800s, an Austrian physician named Sigmund Freud became interested in mental illness. From his work with the mentally ill, he concluded that each individual's personality is made up of three parts: the id, the ego, and the superego. The id consists of biological urges, such as hunger, thirst, and seeking physical pleasure. The ego is the thoughtful, decision-making part of the personality. For example, if the id urged you to eat, the ego would help you find food. The superego is the knowledge of right and wrong, or what you might refer to as your conscience. For example, the superego would direct you not to steal the food that your id urges you to find.\nAccording to Freud, people's minds operate at two levels of thought: conscious (kahn shus) thought and unconscious thought. Conscious thoughts are those of which a person is aware. Unconscious thoughts are those of which a person is not aware. A forgotten childhood event is an example of an unconscious thought.\nFreud believed that people often push unpleasant or frightening thoughts into their unconscious. These unconscious thoughts influence the individual's personality, even though he or she may not be aware of their effects. For example, a child who was unloved by a parent might, as an adult, be constantly searching for the approval of people in authority, people such as teachers or bosses. Such a person might seem overly obedient and anxious to please others.\nTo Freud's way of thinking, adult personalities are shaped mainly by early childhood experiences and conflicts. These memories are stored in the unconscious. Freud believed that by undergoing psychoanalysis (sy koh uh nal uh sis), a form of therapy that involves unlocking these memories and bringing them into the conscious mind, the painful memories can be eased and the inner conflicts resolved.\n### Erikson\nOne follower of Freud, Erik Erikson, devised an eight- stage theory of personality development covering a person's entire life span. Unlike Freud, Erikson believes that an individual's personality continues to be influenced by experiences beyond the childhood years. According to Erikson, people continue to develop socially and psychologically up until their death. Each phase of life has its own particular problems or crises to overcome. If each crisis is worked out in a satisfactory way, it has a positive effect on personality development. If, however, the problem or crisis is not worked out in a satisfactory way, it has a negative effect on personality development.\n> Figure 2-6 \u2014 Erikson's eight stages of development.\n- Birth to 18 months \u00b7 Trust versus Mistrust \u00b7 Feeding \u2014 If cared for and loved, the infant gains trust and views the world as a safe place. Otherwise, mistrust and fear develop.\n- 18 months to 3 years \u00b7 Autonomy versus Shame and Doubt \u00b7 Toilet training \u2014 The child learns bodily control: walking, talking, elimination. With encouragement the child gains confidence; otherwise, inadequacy and doubt.\n- 3 to 6 years \u00b7 Initiative versus Guilt \u00b7 Independence \u2014 The child takes charge more, develops a sense of right and wrong, and play-acts. Self-worth grows if the child is encouraged; low self-esteem and guilt follow if the child is scolded.\n- 7 to 12 years \u00b7 Industry versus Inferiority \u00b7 School \u2014 The child accomplishes tasks and attempts new things. If encouraged, the child feels competent; if not praised, the child may feel like a failure.\n- 13 to 19 years \u00b7 Identity versus Role Confusion \u00b7 Adolescence \u2014 The teen seeks a sense of self and raises questions about sex, religion and role. If this is not resolved, confusion results.\n- Young adulthood, 20 to 40 \u00b7 Intimacy versus Isolation \u00b7 Love relationships \u2014 The young adult develops close bonds with others and shares himself or herself; otherwise, he or she suffers loneliness.\n- Middle adulthood, 41 to 64 \u00b7 Generativity versus Stagnation \u00b7 Parenting \u2014 The adult finds self-worth in helping younger people. If self-absorbed, the person lacks true satisfaction.\n- Late adulthood, 65 to death \u00b7 Ego Integrity versus Despair \u00b7 Reflections on life \u2014 The older adult reflects on and accepts the life lived; otherwise, he or she approaches death with regret.\nFigure 2-6 outlines Erikson's theory of personality development. As you can see, you already have faced four of Erikson's eight conflicts. The first conflict, that of trust versus > mistrust, occurs during the first year of life. A young child who is cared for and loved learns to trust. The trusting child is likely to develop a secure personality.\nThe second conflict, that of self-control and independence versus lack of self-control and dependence, occurs during the second and third years of life. This is the time when children gain control over their own bodies. Children who are encouraged to gain control over themselves tend to develop independent, confident personalities.\nThe third stage involves acquiring self-confidence. Between the ages of three and six, children begin to explore who they are through fantasy play and imitating the behavior of others. They also develop a sense of right and wrong. Children who are encouraged to initiate activities on their own and to create fantasies tend to develop a sense of self-worth.\nThe fourth stage lasts until the teenage years; children learn how to accomplish real tasks. They learn how to help around the home, how to succeed at school, and how to get along with others. These skills make children feel competent. Without them, the child may feel like a failure.\nThe fifth stage is the one you are going through right now. Teenagers are concerned mainly with finding out who they are and what they want to do with their lives. Erikson calls this the search for identity. Some teenagers resolve their identity crises by trying new experiences and thinking and behaving in ways that are different from family teachings. Other teenagers focus on shaping their identities to go along with standards set by their family or community. Often, the search for identity extends beyond the teenage years.\nLook again at Figure 2-6. What is the next stage that you will be going through, according to Erikson? What crisis will you need to resolve during that stage?\n### Maslow\nAn American psychologist named Abraham Maslow theorized that everyone has a basic drive to achieve their fullest potential. Maslow gave a name to the process by which each person strives to be all that she or he can be: self- actualization. To define the characteristics of a self-actualized person, Maslow studied people who, in his view, had attained self-actualization. These people included Abraham Lincoln, Thomas Jefferson, Eleanor Roosevelt, and many others. Based on these studies, Maslow arrived at the following list of ideal personality traits:\n> Maslow's list of ideal personality traits: realistic \u00b7 accepting \u00b7 spontaneous \u00b7 problem-centred \u00b7 independent and self-sufficient \u00b7 appreciative of life \u00b7 spiritual or mystical \u00b7 concerned about humankind \u00b7 capable of loving others \u00b7 fair and unprejudiced \u00b7 creative \u00b7 hardworking \u00b7 not afraid to be different.\nMaslow found that few people ever reached their full potential. He developed a theory to explain why.\nMaslow suggested that before people could achieve self-actualization, they had basic needs that had to be met. Maslow put these needs in an ascending order, called Maslow's hierarchy of needs. Notice the hierarchy, shown in Figure 2-8, is a pyramid, with self-actualization at the top. At the base is what Maslow considered to be a person's most urgent needs: physical needs of the body. These include getting enough sleep, exercising, and satisfying hunger and thirst. If these basic needs are not met a person has little or no energy to pursue higher needs.\nLook again at Figure 2-8; the next need is for safety. This includes the needs for adequate shelter, adequate income, and protection from danger. Once the need for safety is met, a person has the energy to pursue the next level of Maslow's hierarchy: social needs.\nOnce social needs are met, people can direct their energies toward the need for self-esteem. Self-esteem refers to how much one likes oneself and feels good about oneself. To gain self-esteem, people need to experience competence and independence. In other words, you need to know what you do well and you need the opportunity to accomplish things for yourself. Achieving success will give you a sense of self-esteem and will gain you the respect of others.\n> Figure 2-8 \u2014 Maslow's hierarchy of needs, from the base of the pyramid upward: basic physical needs \u2192 safety needs \u2192 social needs \u2192 esteem needs \u2192 self-actualization.\nOnce you have achieved self-esteem, you can then go on to be creative, accepting, caring, unprejudiced, and to achieve all the other qualities of a self-actualized person. On the other hand, if you have low self-esteem, then you are not likely to reach your full potential.\nMaslow's hierarchy provides a framework for thinking about human needs. It is possible to meet some of your basic needs only partially and still strive to meet higher needs. For example, many great artists, such as Mozart and van Gogh, were extremely creative although some of their basic needs were not met. Nevertheless, a well-fed person with adequate shelter is more likely to be friendly, have higher self-esteem, and perform tasks better than someone who lacks adequate food and shelter.\n### Section Review\n- 1. What is psychoanalysis?\n- 2. What is one major difference between Freud's view of personality development and Erikson's view?\n- 3. According to Erikson, what three conflicts must adults resolve?\n- 4. What are some of the characteristics of someone who has achieved self-actualization?\n### What Do You Think?\n- 5. Think about one aspect of your personality that you would like to change. How could you work either to change this trait or to develop a more positive view of the trait and use it to your advantage?\n## 3. Expressing Emotions\nRead the following four descriptions and identify what each teenager might be feeling in the situation described:\nPatty just received a call from Bob, who invited her to go with him to the spring dance. This is just what Patty had been hoping for; she cannot wait to tell her best friend.\nClayton has flunked math and science. He dreads telling his parents about it. Worse still, he knows that he will have to give up being on the football team until he brings his grades in those subjects up to at least a C.\nLinda is going to try out for the lead in the class play. She has already memorized her lines but is certain that she will forget them at the audition. Every time she thinks about getting on stage her heart beats faster, and she feels as if she were going to faint.\nPeter's dad has lost his job. Money is tight at home. Peter wants to help, but he has not been able to find an after-school job. Yesterday he spotted a twenty- dollar bill in his friend Bill's locker. When Bill looked v away, Peter grabbed the money and stuffed it into his pocket.\n### Common Emotions\nYou and your classmates may disagree about exactly what Patty, Clayton, Linda, or Peter are feeling. However, everyone probably would agree that each is experiencing some kind of emotion, or feeling. Psychologists define an emotion as a reaction to a situation that involves a person's mind, body, and ways of behaving. The ability to recognize and appropriately express emotions is an important part of a healthy personality.\n### Love\nMany people think of love primarily as a romantic involvement between two people. While this certainly is a kind of love, there are many other types of love. Love of self is the basis for all other kinds of love. A person who feels self-love has the capacity for loving others. Love may be directed toward friends. Loving friendships are characterized by mutual respect and caring. The love between two married people includes a caring commitment to support and respect each other and act in responsible ways. Love within a family involves expressions of affection and concern. These expressions include caring enough to set or adhere to limits and to enforce or obey rules of behavior. \u0410\nYou can also feel love toward places and things. You may love your country. You may feel love and concern for your fellow human beings. Love is perhaps one of the most positive emotions of which people are capable. The capacity to give and receive love is essential to mental health.\n### Anger\nIt is normal to feel angry sometimes. What are some situations in which you have felt angry? How did you express your angry feelings?\nAnger can be either helpful or harmful. Anger can be a strong motivating force; it may provide you with the energy necessary to try to change things. Consider the case of Clayton, the teenager who flunked math and science. Clayton's first reaction to his poor grades might be anger toward his teachers. After thinking about his situation, however, Clayton may realize that he has to change his own behavior. He may have to give up some after-school activities and spend more time studying.\nAnger can also be a destructive emotion. Suppose Clayton continued to direct his anger at his teacher or turned his anger upon himself. He might give up on his schoolwork altogether or become aggressive or even violent. These reactions would tend to worsen the situation instead of improve it.\nWhat is the best way to deal with anger? First, it is important that you do not deny your feelings or try to ignore them. Second, find a healthful way of expressing your anger. For example, find a physical outlet such as jogging or hitting a punching bag. Third, after you have calmed down, think about exactly what made you angry. Writing down what happened or talking it over with a friend can help. Fourth, consider what constructive action you can take to improve a situation that makes you angry or to prevent another angry episode from occurring.\n### Fear\nEveryone is afraid of something: a figure in the dark, spiders, or horror films. Fear can be a helpful emotion; it can cause you to run from life-threatening situations, such as a fire or a dangerous person. When you feel fear, your heart races, and your breathing quickens. You are prepared to fight or flee the situation if necessary. Do you know people who enjoy scary films or frightening amusement park rides? These people like to feel the reaction brought on by fear.\nFear can also be a harmful emotion. A person who is afraid of something may choose to avoid the fearful situation rather than to confront it. Fear can lead to physical problems. You have probably experienced indigestion, loss of sleep, or headaches when you were afraid of something. Over a long period, fears can lead to physical damage.\nAdmitting that you are afraid and talking about it with someone often make a fear more manageable. Sometimes it helps to picture your worst fears. For example, Linda, who was nervous about auditioning for the school play, handled her fear by talking with her mother. Her mother asked Linda to project the worst thing that could happen. Linda said that she was terrified that she would forget her lines and everyone would laugh at her. To give Linda more confidence in herself, Linda's family acted as an audience for several nights. Although Linda was nervous the day of her audition, she got the part.\n### Guilt\nYou feel guilty when you think you have done something wrong. Guilt can be a helpful emotion; it can stop you from doing something you know is wrong, or it can make you take action to correct something you've done. Feeling too much guilt, however, can make you doubt yourself and your actions.\nThe best way to deal with feelings of guilt is to correct the situation if possible and to talk about your feelings. Peter, the boy who stole money from his friend Bill, felt both anger and guilt. He was angry because his father was out of work. He felt guilty because he stole Bill's money. Peter tried to justify taking the money, but he knew what he did was wrong. After a sleepless night, Peter decided to tell Bill about what he had done. Bill was understanding but said that he needed the money back. Together, the two boys worked out a plan by which Peter could pay back the money.\n### Happiness\nLike love, happiness is a strong, positive emotion. Think about a recent time when you felt happy. Were you happy about something you accomplished? Or was your happiness a result of a pleasant surprise? People feel happy for many different reasons and sometimes for no particular reason at all. It is a normal response to pleasant events in one's life. When a person feels happy, he or she also feels satisfied with life. Feeling happy makes you feel good about yourself.\nWhat makes you feel happy? Take some time to make a list of the things you enjoy. Then, try to \"build\" these happy times into your daily life. If you enjoy skating with your friends, for example, make a date with your friends to go skating. If you like to read books, set aside some time each day for reading. The good feelings will stay with you for the rest of the day.\n### Sadness\nSadness is a feeling of sorrow or grief that can be a normal response to life events, such as a day when nothing seems to go right, a poor grade in school or some other failure, or the death of a loved one. If you feel sad for too long, however, you may become depressed. Depression is an emotional state in which you feel hopeless and worthless. People who remain in a depressed state for a long time may require the help of a psychologist. A\nIf you are sad about the death of a loved one, you will probably experience a period of deep sorrow known as grief. Often, one's first reaction is to feel numb and deny the death. Then you may feel angry toward the person who has died. You may feel the p
