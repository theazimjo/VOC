ical depression.\nMany people receive treatment for depression outside of a hospital or clinic. If a depressed person becomes extremely withdrawn, dangerous, or suicidal, it may be necessary for the person to enter a hospital for treatment.\nSome of the early signs of clinical depression are listed in Figure 4-5. Some teenagers who develop clinical depression lose interest in most of their usual activities and become withdrawn like Jason. Other teenagers may become overly active or put themselves in risky situations like Bob, whom you read about at the start of this chapter. Anyone who has the symptoms of clinical depression should seek help from a parent, teacher, guidance counselor, physician, or another health-care professional.\n> Figure 4-5 \u2014 Signs of clinical depression. Odam o\u2018zini g\u2018amgin va umidsiz his qilsa va kamida ikki hafta davomida deyarli har kuni quyidagilardan to\u2018rttasi kuzatilsa, ehtimol klinik depressiya:\n- 1. Change in appetite: either poor appetite with significant weight loss or increased appetite with significant weight gain\n- 2. Change in sleep patterns: either difficulty sleeping or sleeping too much\n- 3. Change in activity level: either increased physical activity or slowed down levels of activity\n- 4. Loss of interest or pleasure in usual activities\n- 5. Loss of energy, feeling tired all the time\n- 6. Feelings of worthlessness; excessive or inappropriate guilty feelings\n- 7. Difficulty thinking or concentrating\n- 8. Recurrent thoughts of death and suicide\nWith help, clinical depression can be eased and will usually go away. With help, individuals suffering from clinical depression can learn new strategies for coping with problems. Jason and Bob found the help they needed through group therapy. Group therapy involves talking with others who share the same problems as you. A therapist usually leads the group. Group members give each other emotional support and work together to develop better coping strategies and a more positive outlook on life.\n> Manic Depression: An Inherited Defect? \u2014 yon-maqola.\nRecent studies suggest that some forms of manic depression may be inherited through the body's chromosomes. Scientists studying three Amish families in Pennsylvania recently linked manic depression to a defect on the tip of chromosome 11. A similar study of non-Amish families in the United States found no evidence of this defect. Since there are many manic depressives who are not Amish, this finding supports the theory that manic depression may be the result of two defects.\nA study of five families in Israel suggests that manic depression is also linked to a defect on the X chromosome. Scientists think that this defect, which has not been identified yet, may be responsible for one-third of all cases of manic depression.\nOnce these chromosome defects are identified, researchers will be able to study individuals who have inherited one or more of them. These studies could lead to an understanding of the factors that cause the disease.\n### Manic-Depressive Disorder\nNormally, people have moods that shift from happy and lively to sad and somewhat disinterested, depending on what is happening in their lives. People who suffer from a manic-depressive disorder shift from one emotional extreme to another for no apparent reason. During a manic episode, manic depressives usually become overly excited and restless. They may talk so rapidly that you cannot follow what they are trying to say. They may have difficulty concentrating for long on any one thing. They frequently show poor judgment. They may overspend during a shopping spree, for example, or they may drive recklessly.\nThese manic episodes alternate with periods of deep depression. In between these periods of extreme moods, manic depressives may behave normally.\nManic depression can be treated with a combination of psychotherapy and drug therapy. Drug therapy is the use of special medications to relieve some or all of the symptoms of a mental disorder. Often, people with mild cases of manic depression receive treatment outside of a hospital. People with more severe cases may need to be hospitalized so that they can undergo treatment.\n### Eating Disorders\nPerhaps you recognized the symptoms of an eating disorder when you read the case history of Pat at the beginning of this chapter. An estimated 4 percent of the teenaged girls in this country suffer from an eating disorder called anorexia nervosa (an uh rek see uh nur voh suh). Anorexia nervosa is a refusal to eat normally or to retain food in the body. The main symptom is an extreme loss of body weight. A person suffering from anorexia nervosa can starve to death.\nBecause of her extreme weight loss, Pat was hospitalized. After her weight and eating habits were stabilized, she received psychotherapy along with the members of her family. With prompt attention from a mental health professional and cooperation from the patient and family members, anorexia nervosa can be treated successfully.\nAnother eating disorder found among teenaged girls is bulimia (boo lim ee uh). Individuals go on eating binges followed by purging, or getting rid of the food they have eaten. Often bulimics get rid of the food they have eaten through self-induced vomiting. Aside from mental problems, bulimics may also have some serious physical problems, including damaged kidneys, teeth, gums, stomach, and heart. As with anorexia nervosa, persons suffering from bulimia require the assistance of a mental health professional as soon as possible.\n### Somatoform Disorders\nA mental disorder in which a person complains of physical symptoms, such as pain, but there is no underlying physical cause for the symptoms is known as somatoform (soh mat uh form) disorder.\n> Case History: Juanita is convinced that she is about to become seriously ill. Each morning she takes her temperature. After school she reads popular health magazines for the symptoms of major illnesses. At least once a week, she goes to the school nurse's office complaining of chest pains, headaches, or stomachaches. She blames her poor performance in school on her poor health. The school nurse and the school physician tell Juanita that there is nothing wrong with her physically, but Juanita does not believe them.\nJuanita is suffering from a somatoform disorder commonly known as hypochondria (hy puh kahn dree uh). Sometimes, the underlying cause of hypochondria is anxiety or depression. In Juanita's case, the cause was anxiety. Juanita was extremely anxious about doing well in school because her older brother and sister had both excelled in school. Juanita was helped through psychotherapy.\nMany people confuse somatoform disorders such ashypochondria with the stress-related symptoms and illnesses discussed in Chapter 3. Stress-related conditions are characterized by real physical damage to the body. With somatoform disorders, a person complains of disease symptoms, but no physical damage can be found.\n### Personality Disorders\nEvery person has a different way of dealing with life situations. You may like to have every minute of your day carefully planned, or you may love to do things on the spur of the moment. You may be neat, or you may be messy. You may crave time to yourself, or you may always like being with others. As you learned in Chapter 2, these long-lasting patterns of behavior are formed during your childhood. They are a part of the normal range of traits that, together, make up your personality.\n> Figure 4-8 \u2014 Some common personality disorders.\n- Antisocial: Disregard for the rights of others; inability to hold a job or stay in school; impulsive with no regard for the consequences. Early signs frequently include lying, stealing, and fighting.\n- Dependent: Allows and seeks others to assume responsibility for actions; lacks self-confidence; cannot function independently; usually gives in to the wishes of others.\n- Histrionic: Overly dramatic; needs to always be the centre of attention; seeks excitement; overreacts.\n- Narcissistic: Exaggerated sense of self-importance; has fantasies of unlimited success; usually needs constant attention and admiration.\n- Paranoid: Suspicious for no reason; envies and mistrusts others; overly sensitive; limited emotional reactions; rarely seeks help.\nA personality disorder is characterized by behavior that is inflexible and interferes with a person's pursuit of a happy, healthy life. Because personality traits usually are deeply entrenched by young adulthood, these disorders often require long-term treatment. Figure 4-8 lists a number of personality disorders in addition to the ones described below.\n### Compulsive Personality Disorder\nFollowing a set routine can be helpful, but some people carry this activity to an extreme. It is the focus of their lives.\n> Case History: Alex is obsessed with doing everything on a set schedule. For example, every morning he follows an unvarying routine of exercises, followed by tidying up his room. Alex becomes extremely agitated if his routine is interrupted for any reason.\nAlex is showing the symptoms of a compulsive personality disorder, which is characterized by the compulsion to do things in a set way over and over again. People with this disorder need to have a set routine for everything they do.\n### Passive-Aggressive Personality Disorder\nPersons with passive-aggressive personality disorders depend on others to direct them. At the same time, they resent being told what to do. Unable to express their anger openly, they vent it indirectly.\n> Case History: LeRoy hates his after-school job. Every day he arrives late and leaves early. His boss criticizes him for doing his work slowly and sloppily. Half the time, LeRoy \u201cforgets\" to do what his boss has told him.\nLeRoy shows many of the signs of a passive-aggressive personality: chronic lateness, forgetfulness, slowness, and sloppiness. He expresses his resentment indirectly, through his failure to be reliable.\n### Oppositional Disorder\nSome mental health specialists think that a passive-aggressive personality disorder has its roots in a childhood disorder called an oppositional (ahp uh zish uh nul) disorder. An oppositional disorder is characterized by behavior that causes constant conflict with others. For example, a child or a teenager with an oppositional disorder is often stubborn, may frequently disregard the rights of others, has outbursts of temper, and argues constantly with other people.\n### Schizoid Personality Disorder\nPeople who are totally withdrawn from others, that is, who show no warm feelings toward other people, may suffer from a schizoid (skit soyd) personality disorder. They often avoid contact with others. Any criticism of their behavior tends to make them withdraw further. Willy, the boy in the case history at the beginning of this chapter, shows some of the symptoms of a schizoid personality disorder. .\n### Dissociative Disorders\nSuppose you read a newspaper article that began \"Joan Smith was found wandering the streets of a major city in winter. She was wearing summer clothing and did not know who she was.\" What would you think? A dissociative disorder is a mental disorder in which persons become disconnected from, or dissociated from, their former identity. Joan shows signs of amnesia (am nee zhuh), the sudden loss of memory. Amnesia may be brought on by a severe trauma (trow muh), a painful physical or emotional experience. For example, a person who witnesses the death of a loved one may develop amnesia. Amnesia may last a short time or for the rest of a person's life.\nAnother dissociative disorder is called multiple personality disorder. People with this disorder change between two or more separate personalities. Usually, they are not aware of the different personalities coexisting within their minds. They are also unable to control or predict their changes in personality. Although in real life multiple personality disorder is extremely rare, you may know about it from some popular books or movies.\n### Schizophrenia\nSevere mental disorders characterized by unpredictable disturbances in thinking, mood, awareness, and behavior are known as schizophrenia (skit suh free nee uh). Schizophrenia means \"split mind.\" People with this mental disorder have minds that are \"split off\" from reality. ( H r\nSchizophrenics are rarely harmful to others. At times they may appear to be normal. As the disease progresses, schizophrenics become more and more withdrawn and seem to lack emotion.\nSchizophrenic disorders that are characterized by the false belief that others are trying to harm or influence a person are known as paranoid (par uh noyd) schizophrenic disorders. People with paranoid schizophrenic disorders may believe that they are being controlled by aliens or that there is a worldwide plot against them.\nFigure 4-10 shows drawings done by a teenager who is schizophrenic. The drawing on the left shows a state of mental confusion. The drawing on the right shows that, with successful treatment, the artist's mental state has improved.\nThe treatment for schizophrenia varies. In many cases, drug therapy has helped. Drug therapy may be used alone or in combination with other kinds of therapies.\n### Section Review\n- 1. What is a phobic disorder and how can it be treated?\n- 2. How can you tell if a person is appropriately depressed or clinically depressed?\n- 3. What is a somatoform disorder? How does it differ from a psychosomatic illness?\n- 4. What are the symptoms of schizophrenia?\n### What Do You Think?\n- 5. How would you react if you found out that a friend was taking medication regularly for a mental disorder?\n## 3. Suicide\n> Bu yerda kitobda Vivienne ismli o\u2018smir yozgan she\u2019r keltirilgan. She\u2019r mualliflik huquqi bilan himoyalangani uchun bu faylga ko\u2018chirilmadi \u2014 asl kitobdan o\u2018qishingiz mumkin.\nA teenager named Vivienne wrote this poem. She committed suicide when she was fourteen. From this poem, would you have realized Vivienne was thinking of suicide?\nSuicide affects all kinds of people: young, old, bright, average, handsome, homely, rich, poor, female, male. In this country, it is one of the leading causes of death among teenagers. In fact, in the last 25 years, the number of suicides has tripled among young people between the ages of 15 and 24.\n### The Warning Signs\nSuicides can be prevented if people know how to recognize and help potential victims. How much do you know about the problem of suicide? Figure 4-11 presents some of the myths and facts about suicide.\n> Figure 4-11 \u2014 Myths and facts about suicide.\n- Myth: People who talk about suicide seldom actually attempt suicide. Fact: Suicide victims often talk about committing suicide before they actually do it.\n- Myth: If you dare a suicidal person to go ahead and do it, the person is not likely to attempt suicide. Fact: Daring a suicidal person may only confirm in that person's mind that nobody really cares, and may strengthen the person's resolve.\n- Myth: Suicidal persons are always tired, sad, and inactive. Fact: Some suicidal persons, teenagers in particular, may suddenly become overly active and aggressive.\n- Myth: If a suicidal person confides in you and makes you promise not to tell anyone, you should keep the secret no matter what. Fact: By sharing the secret with a parent, teacher, or other responsible adult, you may save the person's life.\n- Myth: If a depressed, suicidal person suddenly seems better, you do not need to worry. Fact: A sudden shift in mood from depressed to happy may indicate that the person has made a decision and needs help.\n- Myth: If people try to take their own lives and do not succeed, they usually will not try again. Fact: Suicide victims often have a history of several attempts.\n- Myth: If people have a history of suicide in their families, they are unlikely to attempt suicide because they know how much pain it causes others. Fact: People may become suicidal because of the loss of a family member, or they may feel that the tendency runs in their family and that there is nothing they can do about their own feelings.\n- Myth: Suicide attempts should be kept secret because the information could ruin the person's future life. Fact: The person may have no future unless professional help is sought.\nSevere depression may cause a person to give up. Anyone who is suffering from a major depression should be watched carefully. Of course, any previous attempt at suicide is a signal that a person needs help, but there are other, less obvious signals.\nRadical changes in a person's personality often are a sign of possible danger. An outgoing person suddenly withdraws from people, for example, or a shy, retiring person suddenly becomes aggressive, irritable, or overly active. These people may be showing signs of severe depression and could be thinking about suicide.\nSometimes, a person's actions are a warning sign. If a person stops doing things that he or she enjoys and gives away favorite belongings, the person may be in need of help. Another sign, which is especially common among severely depressed teenagers, is a sudden increase in risk-taking behavior and accidents. Bob's case history at the start of this chapter is a good example of this type of behavior. Bob was risking his life every time he skateboarded across the highway near his school. Bob's depression led him almost to the edge of suicide.\nSometimes a major trauma may bring a person to the brink of suicide. Moving to a new place, losing a boyfriend or girlfriend, getting a serious illness, having a family member or friend die, or going through a family divorce, all can lead to depression and, sometimes, suicide.\nSometimes a suicide or an attempted suicide triggers a particularly tragic form of suicide known as cluster suicide.\n> Friend to Friend \u2014 do\u2018stlar suhbati.\n- Laura: I'm really worried about Joan. She seems so depressed lately. She acts like a zombie.\n- Carla: I'm worried too. On Tuesday, she didn't show up at the movies as we planned. She didn't even apologize to me. She didn't seem to care. It's just not like her.\n- Laura: I can't believe it. And, yesterday, when I stopped by her house to see why she missed school, she asked me if I would take Pappy.\n- Carla: She wanted you to take Pappy? But she adores that dog. It just doesn't make sense.\n- Laura: Remember that program on suicide last month? The speaker said that one of the warning signs of suicide is when a person gives away her favorite possessions. I think Joan may be in serious trouble.\n- Carla: I think you're right. What should we do?\n- Laura: We've got to talk to someone. This is no time to keep things to ourselves. Let's go talk to Mr. McCarthy, my counselor. He'll know what to do.\nCluster suicides, which are frequently associated with teenagers, occur when several people in the same school or social group attempt to kill themselves within a short period of time. To prevent cluster suicides, all the people in the school or social group where a suicide or an attempted suicide has occurred should receive counseling.\nThe warning signs of suicide can be deceptive. If a person you know has been severely depressed and suddenly becomes happy and carefree, you may conclude that the problem has passed. This is not necessarily so. A sudden change from depressed to happy may mean that the person has resolved to end his or her life. The person feels happy because the decision is made.\nSuicidal behavior is a cry for help in dealing with problems that seem impossible. Showing your care and concern is only the first step in getting help for the person.\n### Prevention\nIf people act promptly to get professional help, often suicides can be prevented. Figure 4-12 offers some of the \"do's\" and \"don't's\" for dealing with people who are potential suicide victims.\n> Figure 4-12 \u2014 How to help a suicidal person.\n- Do: trust your feelings if you believe the person may be suicidal \u00b7 take the person's words seriously \u00b7 tell the person how concerned you are and how much you care \u00b7 listen carefully \u00b7 talk calmly \u00b7 find professional help \u00b7 stay with the person until help arrives.\n- Don't: dare the person to go ahead \u00b7 judge the person \u00b7 analyse the person's motives \u00b7 argue or try to convince the person of reasons why he or she should not do it \u00b7 keep the person's self-destructive thoughts or actions a secret \u00b7 leave the person alone with no help.\nSuicidal teenagers often feel that they have looked to others for support and have received no response. It is vital for friends and relatives to respond with concern and interest. If you believe that a friend is thinking of suicide, or if you become aware of a suicide pact among a group of teenagers, you should report it immediately to an adult, such as a parent, teacher, or physician. Sometimes, a friend may make you promise not to tell anyone about a plan to commit suicide. Whether or not your friend realizes it, by confiding in you, your friend is asking for help. To help your friend, you must break the promise and notify an adult that your friend is in danger.\nSuicide is not a reasonable or useful solution to a problem. Suicidal people usually want to get rid of their pain or sense of helplessness, not their lives. You can help by listening to and providing support for friends or family members who are feeling depressed, hopeless, or overwhelmed by stress. When the support you offer is backed by professional intervention, a life may be saved.\nIn most communities, crisis centers and suicide prevention hotlines provide support for suicidal and depressed people. Some communities have hotlines that are staffed by specially trained, concerned teenagers who help depressed teenagers. The telephone number of the crisis centers and hotlines in your area can be obtained by calling the information operator in your area.\n### Section Review\n- 1. What are four warning signs of suicide?\n- 2. Is it \"true\u201d that a person who talks about committing suicide never does? Explain.\n- 3. What should you do if someone is suicidal?\n- 4. How can cluster suicides be prevented?\n### What Do You Think?\n- 5. Why do you think cluster suicides occur most frequently among teenagers?\n## 4. Treating Mental Disorders\nCan mental disorders be prevented? To some extent, they can be. The surest way to prevent mental disorders is to work constantly to improve your mental health. Here are a few ways that you can promote your own mental health.\n- Express your feelings to others.\n- Set realistic goals for yourself.\n- Recognize your strengths as well as your weaknesses.\n- Accept your shortcomings.\n- Show respect for yourself and others.\n- Keep a list of things you enjoy and things you do well.\n- Maintain friendships.\n- Reward yourself when you achieve a goal, such as maintaining your proper weight or exercising daily.\n- Take good care of yourself by getting enough rest and eating a healthful diet.\n- Practice behaving in an independent, responsible way.\n- Handle problems as they come up.\n- Try to do your best but do not expect to be perfect.\n- Be honest with yourself and others.\n- Avoid alcohol and drugs.\n- Keep disappointments in perspective.\n- Seek the help of a physician or mental health professional if you think you need it.\nAre there other ways to promote your mental health?\n### When to Seek Help\nAbout one out of every five adults in this country is likely to suffer from a mental disorder at some time during his or her life. The first step toward recovery is recognizing the need for help. Do not ignore the warning signs of mental illness. Some of these warning signs include:\n- a sudden, radical change in personality\n- self-destructive actions: overeating, undereating, alcohol or drug abuse, and risky behaviors\n- violent, uncontrollable shifts in mood\n- persistent feelings of worthlessness or hopelessness\n- deepening sadness that interferes with functioning\n- sleep disturbances\n- inability to concentrate on anything\n- trouble getting along with others\n- paralyzing attacks of fear or anger\n- frequent illness without a physical cause\n- obsessive thoughts or compulsive actions\n- delusions or hallucinations ( J \u2014 \u0410 i\n### Where to Find Help\nIn most communities, it is not difficult to find help. Often, a parent, teacher, school counselor, physician, or religious leader can tell you about local mental health professionals. Information on support groups for the families of the mentally ill can be obtained by calling or writing the National Alliance for the Mentally Ill in Arlington, Virginia.\nIn many communities, local hospitals have mental health centers. Other communities have special mental health centers or clinics. The Family Service Association of America also has agencies throughout the country that offer counseling and mental health education programs. Some communities have drop-in centers for teenagers. The counselors in these centers provide teenagers with help and guidance.\n### Types of Help\nThere are many types of mental health professionals. These are people who are specially trained to recognize and treat mental disorders. The type of treatment they offer depends upon their training.\n### Psychiatrists\nDoctors who specialize in the treatment of mental disorders are called psychiatrists (sy ky uh trist). Psychiatrists are M.D.s (doctors of medicine) with advanced training in the treatment of mental illnesses. They are trained to look for physical, as well as nonphysical, reasons for mental illnesses. They not only talk with the patients, and often the patient's family, to identify symptoms of a mental disorder but also examine the patient for signs of a physical cause of the illness. After diagnosing a disorder, a psychiatrist may treat the disorder in a variety of ways.\nBecause psychiatrists are medical doctors, they can prescribe medi 8 cations. Another approach is the use of psychotherapy. Frequently, psychiatrists use a combination of drug therapy and psychotherapy. If a psychiatrist suspects that a patient's symptoms may have an organic cause, he or she may recommend testing by a neurologist (nu rahl uh jist). A neurologist is a physician who specializes in detecting and treating organic disorders of the brain and nervous system.\n### Psychologists\nThe study of the mind and behavior is called psychology. A psychologist is someone who has earned an academic degree in psychology. Psychologists are not medical doctors, but they usually have a master's degree or a Ph.D. in psychology or a related field.\nClinical psychologists are mental health professionals who specialize in recognizing and treating abnormal behavior. In addition to a Ph.D. degree in psychology, they usually have at least two years of practical training in a psychiatric hospital. Because they are not medical doctors, clinical psychologists cannot prescribe medications.\nPsychologists often work with psychiatrists. A psychologist may help a psychiatrist diagnose a mental disorder or give tests to determine the psychological condition of a patient. Others also treat patients with psychotherapy.\n### Social Workers\nSocial workers usually complete four years of college and two years of study in a school of social work. Psychiatric social workers specialize in helping the mentally ill and their families accept and adjust to mental illness. Most psychiatric social workers work in hospitals, mental health clinics, or family service agencies.\n### Other Mental Health Specialists\nThere are many other people who help people with mental disorders. Psychiatric nurses work in hospitals, mental health facilities, or in private practice and specialize in the care and treatment of the mentally ill. Occupational therapists help the mentally ill become productive members of society by teaching them practical skills. Pastoral counselors are members of the religious community who have had practical training in counseling people with mental and social problems.\nSome mental health counselors work with specific problems or specific groups. Substance abuse counselors, for example, work with people who have drug or alcohol problems. School adjustment counselors work with students who are having problems in school. Youth counselors work with teenagers who are having problems.\nWhatever the problem, there are people to help you. Parents are a good place to start. Although it may be difficult, try to share your problems with a parent, guardian, or other responsible adult. Facing up to a problem and talking about it are the first steps to overcoming it.\n### Kinds of Treatments\n> Issues in Health \u2014 Should criminals be allowed to plead insanity?\nIn 1981, John Hinckley, Jr. shot President Ronald Reagan and two other men. Hinckley was declared not guilty by reason of insanity. Not guilty by reason of insanity is a legal phrase, not a psychological one. It means the jury has decided a person was mentally ill when he or she committed a crime and, therefore, could not understand that the actions were wrong. The person is sent to a mental institution instead of to jail.\nSome people feel the insanity defense protects citizens whose mental states prevent them from distinguishing right from wrong. These citizens are mentally ill, they argue, not criminals. They should be put in mental institutions where they can get treatment and counselling.\nOther people feel the insanity defense should be eliminated because it has been misused. The key witnesses in these trials are psychiatrists, who base their testimony on opinions rather than facts. There have been cases where people have acted mentally ill during their trials, only to be declared sane soon after they are institutionalized. Once released, some of these people have repeated their crimes. In other cases, people stay in mental institutions much longer than they would have been jailed. Do you think we should do away with the insanity defense? Why or why not?\nAfter a mental disorder has been diagnosed, it may be treated in a number of ways. These ways include drug therapy, psychotherapy, and hospitalization. Often, a combination of treatments is used.\n### Drug Therapy\nMany mental disorders, such as anxiety disorders, affective disorders, and schizophrenia, can be treated effectively through medication. Although the medications may not cure the mental disorder, they do relieve the symptoms, which allows many patients to function normally again. Unfortunately, some people experience negative side effects from the drugs and can also develop a dependency on the medication.\n### Psychotherapy\nDepending on their training and experience, psychotherapists can use a variety of methods in treating mental disorders. A few examples are analytic, behavioral, cognitive, and client-centered therapies. Along with any of these therapies, therapists also may use family therapy, group therapy, role-playing, and, for younger patients, play therapy.\nAnalytic psychotherapy is based on the idea that mental disorders are the result of unresolved inner conflicts. Freudian psychoanalysis is an example of an analytic approach.\nBehavioral therapies try to relieve the symptoms of a mental disorder by helping people alter their behavior. One way this is accomplished is by rewarding healthful behaviors while ignoring or mildly punishing unhealthful behaviors.\nCognitive therapies involve changing a patient's attitudes or ways of looking at the world. For example, a depressed patient might be asked to keep a daily record of things that make the patient feel happy, hopeful, or worthwhile. This record helps the patient to develop a more positive outlook on life.\nIn client-centered therapy, the patient, or client, sets the pace and the goals for therapy. The therapist shares his or her personal experiences with the client and provides a supportive environment for the client to figure out ways of solving his or her own problems.\nWhile using these therapies, mental health professionals may encourage their patients to act out problem situations or new behaviors. Sometimes this may be done through role-playing. For example, if a person has difficulty saying no to friends, the therapist may take on the role of a demanding 4 friend. The person can use this nonthreatening situation to practice how he or she would say no to the friend.\nFor young patients, play therapy may be used. Children undergoing play therapy use toys, such as dolls, to act out problem situations or to try out solutions to problems. A\n### Hospitalization\nPeople with mental disorders who need constant attention or who are in danger of harming themselves are usually hospitalized. During the time that they are in a hospital, they may be given drug therapy, psychotherapy, or both. In some cases of severe depression, where other treatments are not effective, the patient may be given electroconvulsive therapy, or ECT. ECT involves passing an electric current through the brain for a fraction of a second. Although it is not yet understood why, ECT has been found to relieve symptoms of severe depression.\nDuring hospitalization, the hospital staff work with patients to prepare them for the time when they are able to leave the hospital. Occupational therapists teach patients practical skills, which will help them manage on their own outside of the hospital. After the patient leaves the hospital, psychiatric social workers provide continued support to help the patient readjust to everyday life.\n### Section Review\n- 1. What is the best way to prevent mental disorders?\n- 2. What are four warning signs of mental illness?\n- 3. Name three types of mental health professionals and describe their training.\n- 4. Describe three treatments for mental disorders.\n### What Do You Think?\n- 5. Suppose that a friend of yours has been acting strangely for the past six months. You think that your friend may need help. What would you do?\n## Chapter Review\n### Chapter Summary\n- Mental disorders are illnesses that affect the mind. They prevent a person from being productive, adjusting to life situations, and getting along with others.\n- Mental disorders may be caused by organic (physical) factors, functional (environmental) factors, or a combination of both.\n- In anxiety disorders, a person's fears interfere with normal, everyday functioning. Phobias are fears that are related to specific objects or situations.\n- Affective disorders, such as clinical depression, result when moods or negative emotions persist over time and interfere with normal activities.\n- Eating disorders, such as anorexia nervosa and bulimia, are mental disorders found mainly in teenage girls. With these disorders, prompt professional help is crucial for effective treatment.\n- In somatoform disorders, a person complains of physical symptoms, although there is no underlying physical cause.\n- When an individual's personality traits prevent him or her from functioning normally and interacting with others, he or she may have a personality disorder.\n- In dissociative disorders and schizophrenia, a person loses touch with reality and with his or her identity.\n- Suicide frequently can be prevented if people recognize the problem and know how to help potential victims.\n- Mental health professionals, such as psychiatrists, clinical psychologists, and psychiatric social workers, are trained to recognize and treat mental disorders.\n- Mental disorders can be treated with drug therapy, psychotherapy, role-playing, group therapy, play therapy, and hospitalization.\n### Vocabulary Review\nListed below are some of the important terms in this chapter. Choose the term that best matches the phrase in the exercise that follows.\n> affective disorder \u00b7 anorexia nervosa \u00b7 anxiety disorder \u00b7 bulimia \u00b7 clinical depression \u00b7 clinical psychologists \u00b7 dissociative disorder \u00b7 drug therapy \u00b7 functional disorders \u00b7 manic-depressive disorder \u00b7 mental disorder \u00b7 obsessive-compulsive disorder \u00b7 organic disorder \u00b7 personality disorder \u00b7 phobia \u00b7 psychiatric social workers \u00b7 psychiatrists \u00b7 psychotherapy \u00b7 schizophrenia \u00b7 somatoform disorder\n- 1. mental disorder marked by mood swings\n- 2. a mental disorder with a physical cause\n- 3. anxiety about a specific situation or object\n- 4. doctors who specialize in the diagnosis and treatment of mental disorders\n- 5. severe mental disorders characterized by unpredictable disturbances in thinking, mood, awareness, and behavior\n- 6. a mental disorder marked by a person forgetting or changing his or her identity\n- 7. interactions between a trained therapist and a patient, which help the patient identify and overcome mental problems\n- 8. a mental disorder in which a person is overwhelmed by sad feelings\n- 9. a mental disorder characterized by severe weight loss due to a refusal to eat\n- 10. a mental disorder in which patients suffer from symptoms, such as pain, that have no underlying physical cause\n### What Have You Learned?\n- 1. Define mental disorder. Give one example.\n- 2. What are some causes of organic disorders?\n- 3. Give an example of how a mental disorder might be caused by an environmental factor.\n- 4. Explain how an anxiety disorder might be treated by a mental health professional.\n- 5. How are anorexia nervosa and bulimia similar? How do they differ?\n- 6. Distinguish between compulsive, passive- aggressive, and schizoid personality disorders.\n### What Do You Think?\n1. In some states, the mentally ill have been released from institutions. Some now live on the streets, where they receive little or no help. What, if anything, should be done about these mentally ill, homeless people? 2. People recovering from mental disorders sometimes live in \u201chalfway houses\" where they get treatment and readjust to life. Many neighborhoods object to having halfway houses. How do you feel about it?\n### What Would You Do?\n1. A friend of yours has dieted her weight down to 75 pounds from 120 pounds. You are very concerned about your friend's health. What would you do? 2. Your parents are getting a divorce, and you are having trouble sleeping, eating, and concentrating on your schoolwork. What steps could you take to help yourself?\n### For Further Study\n- 1. Using your phone book, look up mental health facilities. Call five facilities to find out what services they provide. List the facilities, their phone numbers, and services.\n- 2. Some veterans of the Vietnam War suffer from post-traumatic stress syndrome. Use your library to find out about this mental disorder and how it is treated. Do people other than veterans suffer from this disorder? If so, why?\n- 3. Research the drug lithium. What mental disorder is it used to treat? How does it work? How effective is this drug?" },
