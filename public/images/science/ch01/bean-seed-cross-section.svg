<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="700" fill="#FBF8F1"/>

  <!-- seed coat outline -->
  <path d="M450 120 C 620 120, 700 260, 690 380 C 680 520, 560 600, 450 600 C 340 600, 220 520, 210 380 C 200 260, 280 120, 450 120 Z" fill="#E7C98C" stroke="#8A6412" stroke-width="4"/>

  <!-- two cotyledons (stored food) -->
  <path d="M450 160 C 560 165, 630 260, 620 370 C 612 470, 540 550, 460 555 L 450 160 Z" fill="#F3DFA6" stroke="#B8850C" stroke-width="3"/>
  <path d="M450 160 C 340 165, 270 260, 280 370 C 288 470, 360 550, 440 555 L 450 160 Z" fill="#F6ECC9" stroke="#B8850C" stroke-width="3"/>

  <!-- embryo (tiny young plant) nestled at the top between cotyledons -->
  <g>
    <path d="M450 180 C 450 220, 440 240, 415 250" fill="none" stroke="#6FAE5B" stroke-width="7" stroke-linecap="round"/>
    <path d="M450 180 C 450 220, 460 240, 485 250" fill="none" stroke="#6FAE5B" stroke-width="7" stroke-linecap="round"/>
    <line x1="450" y1="180" x2="450" y2="300" stroke="#4F7A3B" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="450" cy="315" rx="16" ry="20" fill="#B9895A" stroke="#7A5A38" stroke-width="2"/>
  </g>

  <!-- labels -->
  <g font-size="24" fill="#3E3A34">
    <line x1="670" y1="220" x2="770" y2="170" stroke="#3E3A34" stroke-width="2"/>
    <text x="778" y="176">seed coat</text>

    <line x1="560" y1="300" x2="780" y2="300" stroke="#3E3A34" stroke-width="2"/>
    <text x="600" y="290">stored food</text>
    <text x="600" y="318">(cotyledons)</text>

    <line x1="450" y1="290" x2="230" y2="230" stroke="#3E3A34" stroke-width="2"/>
    <text x="60" y="236">embryo</text>
    <text x="30" y="264">(tiny young plant)</text>
  </g>
</svg>
